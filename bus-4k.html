<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0c10">
<title>ONE STREET HD &middot; Good Vibes Arcade</title>
<style>
  :root{
    --ink:#eef1f4; --dim:#8c93a0; --line:#2a2f38;
    --panel:rgba(10,12,16,.62); --panelEdge:rgba(160,175,195,.22);
    --amber:#ffb524;
    --pad:calc(10px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right))
          calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; overflow:hidden; overscroll-behavior:none; }
  body{
    background:#0a0c10; color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    touch-action:none; user-select:none; -webkit-user-select:none;
  }
  /* The canvas IS the page. Everything else floats over it. */
  #game{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }

  #ui{ position:fixed; inset:0; pointer-events:none; padding:var(--pad); }
  #ui > *{ pointer-events:auto; }

  /* ---- top bar ---------------------------------------------------- */
  #topbar{
    position:absolute; top:0; left:0; right:0; padding:var(--pad);
    display:flex; flex-wrap:wrap; align-items:center; gap:6px;
    transition:opacity .5s ease;
  }
  #topbar.dim{ opacity:.22; }
  #topbar .grow{ flex:1 1 auto; }
  a.back{
    color:var(--ink); text-decoration:none; font-weight:700; font-size:13px;
    letter-spacing:.08em; padding:7px 10px; border-radius:9px;
    background:var(--panel); border:1px solid var(--panelEdge);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  .chip{
    font:inherit; font-size:11px; font-weight:700; letter-spacing:.09em;
    color:var(--ink); background:var(--panel); border:1px solid var(--panelEdge);
    border-radius:9px; padding:7px 9px; cursor:pointer; min-width:58px;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  .chip:active{ background:rgba(120,140,170,.35); }
  .chip.on{ background:var(--amber); color:#0a0c10; border-color:var(--amber); }
  /* Phones get one row of chrome, not three. */
  @media (max-width:600px){
    .chip{ font-size:10px; padding:6px 7px; min-width:0; letter-spacing:.05em; }
    a.back{ font-size:11px; padding:6px 8px; }
    .vchip{ font-size:9px; padding:4px 7px; letter-spacing:.06em; }
    #keyhint{ font-size:10px; padding:5px 9px; }
  }
  #variants{
    position:absolute; left:0; right:0; bottom:0; padding:var(--pad);
    display:flex; gap:5px; justify-content:center; flex-wrap:wrap;
    transition:opacity .5s ease;
  }
  #variants.dim{ opacity:.16; }
  .vchip{
    text-decoration:none; font-size:10px; font-weight:700; letter-spacing:.1em;
    color:var(--dim); background:var(--panel); border:1px solid var(--panelEdge);
    border-radius:8px; padding:5px 9px;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  .vchip.on{ color:#0a0c10; background:var(--amber); border-color:var(--amber); }

  /* ---- touch controls --------------------------------------------- */
  /* Two invisible relative drag areas (research S11): the left thumb steers,
     the right thumb is a three-band speed pad whose null position is cruise.
     They sit first in #ui so every real button paints on top of them. */
  #zones{ display:none; }
  body.touch.drag #zones{ display:block; position:absolute; inset:0; }
  #zones > div{ position:absolute; top:0; bottom:0; width:50%; touch-action:none; }
  #zoneL{ left:0; } #zoneR{ right:0; }

  #pads{ display:none; }
  body.touch.pads #pads{
    display:block; position:absolute; inset:0; pointer-events:none;
  }
  #pads > *{ pointer-events:auto; }
  #dpad{
    position:absolute; left:calc(14px + env(safe-area-inset-left));
    bottom:calc(46px + env(safe-area-inset-bottom));
    --k:clamp(52px, 15vmin, 84px);
    display:grid; grid-template-columns:repeat(3,var(--k)); grid-template-rows:repeat(3,var(--k)); gap:5px;
  }
  .btn{
    background:rgba(22,27,34,.72); color:var(--ink);
    border:1px solid rgba(160,175,195,.26); border-radius:14px;
    font-size:calc(var(--k) * .34); font-weight:700; line-height:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; touch-action:none;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    box-shadow:0 6px 18px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.10);
  }
  .btn:active{ background:rgba(120,140,170,.55); transform:translateY(2px); box-shadow:0 2px 8px rgba(0,0,0,.5); }
  #up{ grid-area:1/2; } #left{ grid-area:2/1; } #right{ grid-area:2/3; } #down{ grid-area:3/2; }
  #horn{
    position:absolute; right:calc(18px + env(safe-area-inset-right));
    bottom:calc(58px + env(safe-area-inset-bottom));
    width:clamp(84px, 24vmin, 132px); aspect-ratio:1; border-radius:50%;
    background:radial-gradient(circle at 34% 30%, #ffd06a, #d9891a 62%, #96590c);
    color:#2a1c04; border:1px solid rgba(255,220,150,.5);
    font-size:clamp(13px,3.4vmin,18px); font-weight:800; letter-spacing:.14em;
    display:flex; align-items:center; justify-content:center; cursor:pointer; touch-action:none;
    box-shadow:0 8px 22px rgba(0,0,0,.5), inset 0 2px 0 rgba(255,255,255,.35);
  }
  #horn:active{ transform:translateY(3px) scale(.97); }
  /* The horn stays a big always-visible button under BOTH schemes (research
     S11), but only on touch -- desktop already has the biggest key there is. */
  #horn{ display:none; }
  body.touch #horn{ display:flex; }
  /* ---- settings sheet --------------------------------------------- */
  /* Everything that is not the horn lives in here, so the glass stays clear
     for the thumbs. Opening it pauses. */
  #settings[hidden]{ display:none; }
  #settings{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(6,8,12,.72); padding:var(--pad);
    backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
  }
  #sheet{
    width:min(420px, 100%); max-height:100%; overflow:auto;
    background:rgba(14,17,23,.94); border:1px solid var(--panelEdge);
    border-radius:16px; padding:14px;
    box-shadow:0 18px 50px rgba(0,0,0,.6);
  }
  .srow{
    display:flex; align-items:center; gap:10px; padding:7px 2px;
    border-bottom:1px solid rgba(160,175,195,.10);
  }
  .srow:last-of-type{ border-bottom:0; }
  .slab{ flex:1 1 auto; font-size:11px; font-weight:700; letter-spacing:.10em; color:var(--dim); }
  .srow .chip{ min-width:96px; text-align:center; }
  #svars{ display:flex; gap:5px; flex-wrap:wrap; justify-content:center; padding-top:10px; }
  #sfoot{ display:flex; gap:8px; align-items:center; padding-top:12px; }
  #sfoot .grow{ flex:1 1 auto; }
  #gear{ font-size:13px; letter-spacing:0; }

  #keyhint{
    position:absolute; left:50%; transform:translateX(-50%);
    bottom:calc(38px + env(safe-area-inset-bottom));
    font-size:11px; letter-spacing:.1em; color:var(--dim);
    background:var(--panel); border:1px solid var(--panelEdge);
    border-radius:9px; padding:6px 12px; white-space:nowrap;
    transition:opacity .6s ease; text-align:center;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  #keyhint.gone{ opacity:0; }
  @media (max-width:620px){ #keyhint{ white-space:normal; max-width:88vw; line-height:1.5; } }
  body.touch #keyhint, body.forcepad #keyhint{ display:none; }
</style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="ui">
    <div id="zones"><div id="zoneL"></div><div id="zoneR"></div></div>

    <div id="topbar">
      <a class="back" href="index.html">&#9664; ARCADE</a>
      <span class="grow"></span>
      <button class="chip" id="gear">&#9776; MENU</button>
    </div>

    <div id="pads">
      <div id="dpad">
        <button class="btn" id="up">&#9650;</button>
        <button class="btn" id="left">&#9664;</button>
        <button class="btn" id="right">&#9654;</button>
        <button class="btn" id="down">&#9660;</button>
      </div>
    </div>
    <button class="btn" id="horn">HORN</button>

    <div id="keyhint">&#8593;&#8595; THROTTLE / BRAKE &middot; &#8592;&#8594; STEER &middot; SPACE HORN &middot; H HOLD ON &middot; R RESTART</div>

    <div id="settings" hidden>
      <div id="sheet">
        <div class="srow"><span class="slab">CONTROLS</span><button class="chip" id="ctrlBtn">DRAG</button></div>
        <div class="srow"><span class="slab">PALETTE</span><button class="chip" id="palBtn">HD</button></div>
        <div class="srow"><span class="slab">ZOOM</span><button class="chip" id="zoomBtn">1.0&times;</button></div>
        <div class="srow"><span class="slab">SWEPT PATH</span><button class="chip on" id="ghostBtn">GHOST</button></div>
        <div class="srow"><span class="slab">SOUND</span><button class="chip" id="muteBtn">SOUND</button></div>
        <div class="srow"><span class="slab">ROUTE</span><button class="chip" id="resetBtn">RESET</button></div>
        <div class="srow"><span class="slab">DISPLAY</span><button class="chip" id="fullBtn">FULLSCREEN</button></div>
        <div id="svars">
          <a class="vchip on" href="bus-4k.html">HD</a>
          <a class="vchip" href="bus.html">RIGID</a>
          <a class="vchip" href="bus-bendy.html">BENDY</a>
          <a class="vchip" href="bus-chase.html">CHASE</a>
          <a class="vchip" href="bus-shift.html">SHIFT</a>
        </div>
        <div id="sfoot">
          <a class="back" href="index.html">&#9664; ARCADE</a>
          <span class="grow"></span>
          <button class="chip" id="closeBtn">CLOSE</button>
        </div>
      </div>
    </div>
  </div>

<script>
(function(){
"use strict";

// ============================================================
// ONE STREET HD
// The same simulation as bus.html -- identical physics, identical street,
// identical oncoming-car AI -- rendered properly. Everything below the
// "Render" banner is new; everything above it is the prototype verbatim,
// so the driving model cannot drift from the version it is compared against.
//
// The visual brief: full-screen on a laptop, responsive on a phone, and
// satisfying to look at while you thread a 12 m bus through a 3.3 m pinch.
// ============================================================

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// Viewport-driven resolution. W/H are CSS pixels; the backing store is
// multiplied by devicePixelRatio (capped at 2 -- past that it is invisible
// and expensive). PPM is chosen so the WORLD framing is the same on every
// screen: a phone and a 4K monitor see the same slice of street, the big
// screen just resolves it better.
const VIEW_X_M = 46;   // minimum metres visible across the width
const VIEW_Y_M = 27;   // minimum metres visible down the height
// VW/VH are the real canvas in CSS pixels. W/H are the LOGICAL render extents:
// on a portrait phone the whole world is turned a quarter turn so the street
// runs down the long axis instead of across the short one, and W/H swap. The
// rotation is fixed to the device, never to the bus, so steering stays
// vehicle-relative and the camera still never spins.
let VW = 960, VH = 540, rot90 = false;
let W = 960, H = 540, DPR = 1, PPM = 20, PPM_BASE = 20;
let zoomStep = 1;
const ZOOMS = [0.82, 1.0, 1.22];

function readViewport(){
  const iw = (typeof window !== "undefined" && window.innerWidth)  || 960;
  const ih = (typeof window !== "undefined" && window.innerHeight) || 540;
  return { w: Math.max(280, iw|0), h: Math.max(200, ih|0) };
}
function resize(){
  const v = readViewport();
  VW = v.w; VH = v.h;
  DPR = Math.min((typeof window !== "undefined" && window.devicePixelRatio) || 1, 2);
  canvas.width  = Math.round(VW*DPR);
  canvas.height = Math.round(VH*DPR);
  if(canvas.style){ canvas.style.width = VW+"px"; canvas.style.height = VH+"px"; }
  rot90 = VH > VW*1.12;
  W = rot90 ? VH : VW;
  H = rot90 ? VW : VH;
  PPM_BASE = Math.min(W/VIEW_X_M, H/VIEW_Y_M) * ZOOMS[zoomStep];
  PPM = PPM_BASE;
  buildTexture();
}
// Logical render space -> device pixels, for the few things drawn upright.
function devX(lx,ly){
  const zx = W/2 + (lx-W/2)*zoomEase, zy = H/2 + (ly-H/2)*zoomEase;
  return rot90 ? VW - zy : zx;
}
function devY(lx,ly){
  const zx = W/2 + (lx-W/2)*zoomEase, zy = H/2 + (ly-H/2)*zoomEase;
  return rot90 ? zx : zy;
}

// ---------- Palettes ----------
// Bodies are authored with single-char colour KEYS, as in the prototype.
// Every key must appear in BOTH KEY_TONE and GBC or it renders magenta.
// Lighting, shadow and glow are drawn as alpha overlays instead of keys, so
// the two Game Boy palettes keep working while the HD one gets the depth.
const TONES = {
  green: ["#0f380f","#306230","#8bac0f","#9bbc0f"],
  gray:  ["#0b0b0b","#4a4a4a","#a6a6a6","#eaeaea"]
};
const KEY_TONE = {
  ".":-1,
  "a":0,                                // void behind everything
  "b":1,"B":0,"q":1,"Q":0,"i":2,        // building roof / wall, warm variant, roof detail
  "j":3,"J":0,                          // lit window, dark window
  "d":1,"D":0,"T":1,"Z":0,"R":1,        // asphalt, shade, patch, crack, wheel-track
  "p":2,"P":1,"k":3,"K":1,"l":3,        // pavement, joint, kerb top, kerb face, paint
  "u":3,"U":2,"g":1,"G":0,"t":0,"m":2,  // bus body/shade, glass, tyre, mirror
  "c":2,"C":1,"v":2,"V":1,"o":2,"O":1,  // parked car, van, oncoming car
  "h":3,"r":2,"n":1,"N":2,              // hazard, brake light, bin, bin lid
  "s":3,"f":3,"e":2,                    // spark, warm light, ghost
  "z":1,"S":2,"W":3,                    // waiting passenger coat / skin, stop sign
  "E":2,"Y":1,                          // the skip, and its shaded flank
  "x":3,"X":2,"y":3,"w":3               // hud, hud dim, warn, white
};
const GBC = {
  "a":"#080a0e",
  "b":"#565f6b","B":"#333a44","q":"#6b5a4c","Q":"#3f3630","i":"#7d8794",
  "j":"#ffd98a","J":"#191e26",
  "d":"#3c3f46","D":"#2c2f35","T":"#464a52","Z":"#2a2d33","R":"#33363c",
  "p":"#8a8d93","P":"#75787e","k":"#b9bcc2","K":"#6e7178","l":"#e8e2c8",
  "u":"#e2493a","U":"#a32f22","g":"#2f4d63","G":"#1a2b38","t":"#15161a","m":"#c3c7cd",
  "c":"#4a86c6","C":"#2f5e91","v":"#e0dbcf","V":"#a9a496","o":"#52a86e","O":"#2f7048",
  "h":"#ffb524","r":"#ff4a3d","n":"#46583f","N":"#67805c",
  "s":"#fff0b8","f":"#ffd8a0","e":"#6fe3bd",
  "z":"#3d5a80","S":"#d9a273","W":"#dfe4ea",
  "E":"#e0862a","Y":"#a35c14",
  "x":"#eef1f4","X":"#8c93a0","y":"#ffe45c","w":"#ffffff"
};
const PAL_ORDER = ["color","green","gray"];
const PAL_LABEL = { color:"HD", green:"GREEN", gray:"GRAY" };
let palMode = localStorage.getItem("bus4k_pal3") || "color";
if(PAL_ORDER.indexOf(palMode) < 0) palMode = "color";

function col(key){
  if(palMode === "color") return GBC[key] || "#ff00ff";
  const t = KEY_TONE[key]; return TONES[palMode][t === undefined ? 0 : t];
}

// ============================================================
// SIMULATION -- the driving model from bus.html, unchanged.
//
// What used to be a verbatim copy of the whole block is now a verbatim copy
// of the CODE with the world DATA lifted out into LEVELS: the street, the
// parked cars and the bins are refilled by loadLevel() instead of being
// written inline. Level 1 is the gate-test street node for node, so the
// empty bus still drives exactly as the prototype does, and
// tools/parity-bus.js proves it -- 6000 scripted frames, zero drift, on
// every field. Nothing here may read game state; the passenger, clock and
// comfort systems live below the GAME banner and only ever act after
// update() has run.
// ============================================================
// ============================================================
// The street: a centreline polyline with a varying half-width.
// Half-width is the BUILDING line -- hard collision. Inside it sits a
// 0.9 m pavement strip each side that the bus may mount (rumble, no damage),
// which is the small voluntary margin the design wants players to gamble on.
// ============================================================
const PAVE = 0.9;
const NODES = [];          // refilled by loadLevel()
const SEGS = [];
let TOTAL_S = 0;
function buildPath(){
  SEGS.length = 0; TOTAL_S = 0;
  for(let i=0;i<NODES.length-1;i++){
    const a = NODES[i], b = NODES[i+1];
    const dx = b.x-a.x, dy = b.y-a.y;
    const len = Math.hypot(dx,dy);
    SEGS.push({
      ax:a.x, ay:a.y, bx:b.x, by:b.y,
      dx:dx/len, dy:dy/len, nx:dy/len, ny:-dx/len,   // left normal
      len, s0:TOTAL_S, hw0:a.hw, hw1:b.hw
    });
    TOTAL_S += len;
  }
}

// Nearest point on the path. Returns along-distance s, lateral offset q
// (positive = left of travel), and the half-width there.
function project(x,y){
  let best = null, bestD = Infinity;
  for(let i=0;i<SEGS.length;i++){
    const g = SEGS[i];
    let t = ((x-g.ax)*g.dx + (y-g.ay)*g.dy);
    if(t < 0) t = 0; else if(t > g.len) t = g.len;
    const px = g.ax + g.dx*t, py = g.ay + g.dy*t;
    const d = Math.hypot(x-px, y-py);
    if(d < bestD){
      bestD = d;
      const u = t/g.len;
      best = { s:g.s0+t, q:(x-g.ax)*g.nx + (y-g.ay)*g.ny, hw:g.hw0+(g.hw1-g.hw0)*u, seg:i, t };
    }
  }
  return best;
}
// World position / frame at a given along-distance.
function pathPoint(s){
  if(s < 0) s = 0; else if(s > TOTAL_S) s = TOTAL_S;
  for(let i=0;i<SEGS.length;i++){
    const g = SEGS[i];
    if(s <= g.s0+g.len || i === SEGS.length-1){
      const t = Math.min(s-g.s0, g.len), u = t/g.len;
      return { x:g.ax+g.dx*t, y:g.ay+g.dy*t, dx:g.dx, dy:g.dy, nx:g.nx, ny:g.ny,
               hw:g.hw0+(g.hw1-g.hw0)*u, ang:Math.atan2(g.dy,g.dx) };
    }
  }
  return null;
}
function toWorld(s,q){ const p = pathPoint(s); return { x:p.x+p.nx*q, y:p.y+p.ny*q, ang:p.ang }; }

// ============================================================
// Obstacles. Six parked cars, two of them badly -- each one is a joke that
// is also a geometry problem. Bins are nudgeable (the pressure valve).
// ============================================================
const CAR_L = 4.2, CAR_W = 1.8, VAN_L = 5.4, VAN_W = 2.1;
const SKIP_L = 3.4, SKIP_W = 1.9;      // the recurring nemesis (research S5)
const BAR_L  = 2.1, BAR_W  = 0.5;      // roadworks barrier (research S5 set-piece)
// Every parked-body kind, so a level can name one instead of hard-coding sizes.
const RIG_DIM = {
  car:  {l:CAR_L,  w:CAR_W},
  van:  {l:VAN_L,  w:VAN_W},
  skip: {l:SKIP_L, w:SKIP_W},
  bar:  {l:BAR_L,  w:BAR_W}
};
let PARKED_SPEC = [], BIN_SPEC = [];   // refilled by loadLevel()

let obstacles = [], bins = [];
function buildWorld(){
  obstacles = PARKED_SPEC.map(p=>{
    const w = toWorld(p.s, p.q);
    const dim = RIG_DIM[p.t] || RIG_DIM.car;
    const o = { x:w.x, y:w.y, ang:w.ang + p.a,
             hl:dim.l/2, hw:dim.w/2,
             kind:p.t, hazard:!!p.hazard, straddle:!!p.straddle };
    const pr = project(o.x,o.y); o.ps = pr.s; o.pq = pr.q;
    return o;
  });
  bins = BIN_SPEC.map(b=>{
    const w = toWorld(b.s, b.q);
    return { x:w.x, y:w.y, vx:0, vy:0, ang:Math.random()*3, spin:0, r:0.36 };
  });
}

// ============================================================
// The bus. Bicycle model driven from the REAR AXLE, with real overhangs so
// the tail sweeps outward opposite the turn. That sweep is the whole game.
// ============================================================
const BUS_L = 12.0, BUS_W = 2.55, WB = 6.0, FRONT_OH = 2.5, REAR_OH = 3.5;
const BUS_HW = BUS_W/2;
const STEER_MAX = 0.733;          // ~42 deg -> ~22 m kerb-to-kerb circle
const V_MAX = 14.0, V_REV = 4.0;  // m/s
const ACCEL = 1.9, BRAKE = 4.2, DRAG = 0.55;

const bus = {
  rx:0, ry:0, h:0, v:0,
  steer:0, steerNorm:0,
  scrapes:[],      // permanent decals: {a, side}
  bump:0
};
function busFrame(){ return { c:Math.cos(bus.h), s:Math.sin(bus.h) }; }
// Local (along-from-rear-axle, left-offset) -> world.
function busLocal(a,b){
  const c = Math.cos(bus.h), s = Math.sin(bus.h);
  return { x:bus.rx + a*c + b*s, y:bus.ry + a*s - b*c };
}
function busCentre(){ return busLocal(WB + FRONT_OH - BUS_L/2, 0); }
function busOBB(){
  const p = busCentre();
  return { x:p.x, y:p.y, ang:bus.h, hl:BUS_L/2, hw:BUS_HW };
}

function resetBus(){
  const w = toWorld(8, 2.0);
  bus.rx = w.x; bus.ry = w.y; bus.h = w.ang; bus.v = 0;
  bus.steer = 0; bus.steerNorm = 0; bus.scrapes.length = 0; bus.bump = 0;
}

// ============================================================
// Geometry utilities
// ============================================================
function pointInOBB(px,py,o){
  const c = Math.cos(o.ang), s = Math.sin(o.ang);
  const dx = px-o.x, dy = py-o.y;
  const lx = dx*c + dy*s, ly = dx*s - dy*c;
  return lx >= -o.hl && lx <= o.hl && ly >= -o.hw && ly <= o.hw;
}
function obbAxes(o){
  const c = Math.cos(o.ang), s = Math.sin(o.ang);
  return [{x:c,y:s},{x:s,y:-c}];
}
function obbProject(o,ax){
  const c = Math.cos(o.ang), s = Math.sin(o.ang);
  const cen = o.x*ax.x + o.y*ax.y;
  const r = o.hl*Math.abs(c*ax.x + s*ax.y) + o.hw*Math.abs(s*ax.x - c*ax.y);
  return {min:cen-r, max:cen+r};
}
// Separating-axis test. Returns the minimum translation vector pushing A out of B.
function satOBB(A,B){
  const axes = obbAxes(A).concat(obbAxes(B));
  let best = Infinity, bx = 0, by = 0;
  for(const ax of axes){
    const pa = obbProject(A,ax), pb = obbProject(B,ax);
    const ov = Math.min(pa.max,pb.max) - Math.max(pa.min,pb.min);
    if(ov <= 0) return null;
    if(ov < best){
      best = ov;
      const dir = (pa.min+pa.max)/2 < (pb.min+pb.max)/2 ? -1 : 1;
      bx = ax.x*dir; by = ax.y*dir;
    }
  }
  return {depth:best, nx:bx, ny:by};
}

// ============================================================
// The oncoming car: it negotiates rather than just existing.
// Telegraphs every decision, yields into a bay when the corridor cannot
// hold both, or -- if stubborn -- refuses until you use the horn.
// ============================================================
const NEED_BOTH = BUS_W + CAR_W + 0.55;   // width for a shared pass
const car = { s:0, q:0, v:0, targetQ:0, mode:"cruise", timer:0, stubborn:false,
              honked:false, blink:0, ang:0, x:0, y:0 };

function spawnCar(){
  car.s = TOTAL_S - 10; car.q = -2.0; car.v = 0; car.targetQ = -2.0;
  car.mode = "cruise"; car.timer = 0; car.honked = false;
  car.stubborn = Math.random() < 0.5;
  const w = toWorld(car.s, car.q); car.x = w.x; car.y = w.y; car.ang = w.ang + Math.PI;
}
// Widest free lateral interval at along-distance s, ignoring the given actor.
function freeInterval(s){
  const p = pathPoint(s);
  if(!p) return {lo:0, hi:0, w:0};
  const lim = p.hw;
  // Collect blocked spans from static obstacles that straddle this s.
  const blocked = [];
  for(const o of obstacles){
    const reach = Math.abs(o.hl*Math.cos(o.ang - p.ang)) + Math.abs(o.hw*Math.sin(o.ang - p.ang));
    if(s < o.ps - reach || s > o.ps + reach) continue;
    const half = Math.abs(o.hl*Math.sin(o.ang - p.ang)) + Math.abs(o.hw*Math.cos(o.ang - p.ang));
    blocked.push([o.pq-half, o.pq+half]);
  }
  blocked.sort((a,b)=>a[0]-b[0]);
  let lo = -lim, best = {lo:-lim, hi:lim, w:2*lim};
  best.w = -1;
  let cursor = -lim;
  for(const b of blocked){
    if(b[0] > cursor){
      const w = Math.min(b[0],lim) - cursor;
      if(w > best.w) best = {lo:cursor, hi:Math.min(b[0],lim), w};
    }
    if(b[1] > cursor) cursor = b[1];
  }
  if(lim > cursor){ const w = lim - cursor; if(w > best.w) best = {lo:cursor, hi:lim, w}; }
  if(best.w < 0) best = {lo:0, hi:0, w:0};
  return best;
}
function busS(){ const p = busCentre(); return project(p.x,p.y); }

function updateCar(dt){
  const bp = busS();
  const gap = car.s - bp.s;             // positive while the car is still ahead
  car.blink += dt;

  // Is there a sample between us where we cannot both fit?
  let conflict = false, worstS = car.s;
  if(gap > 0){
    for(let s = Math.max(bp.s, car.s-60); s <= car.s; s += 2){
      if(freeInterval(s).w < NEED_BOTH){ conflict = true; worstS = s; break; }
    }
  }

  if(car.mode === "cruise"){
    // Close to within sight of the pinch before negotiating, so the whole
    // exchange happens on screen where the player can read it.
    if(conflict && gap < 55 && (car.s - worstS) < 18){ car.mode = "telegraph"; car.timer = 0.42; }
  } else if(car.mode === "telegraph"){
    car.timer -= dt;
    if(car.timer <= 0){
      if(car.stubborn && !car.honked){ car.mode = "wait"; car.honked = false; }
      else {
        // Look behind (higher s) for a bay wide enough to share.
        let bay = -1;
        for(let s = Math.max(worstS, car.s); s < Math.min(TOTAL_S-4, car.s+38); s += 1.5){
          if(freeInterval(s).w >= NEED_BOTH + 0.6){ bay = s + 6; break; }
        }
        if(bay > 0 && bay > car.s){ car.mode = "backing"; car.bay = Math.min(bay, TOTAL_S-6); }
        else { car.mode = "wait"; car.honked = false; }
      }
    }
  } else if(car.mode === "backing"){
    car.v = 3.0;                        // reverse, away from the bus
    if(car.s >= car.bay){ car.v = 0; car.mode = "yield"; }
  } else if(car.mode === "yield" || car.mode === "wait"){
    car.v = 0;
    if(car.mode === "wait" && car.honked){ car.mode = "telegraph"; car.timer = 0.42; car.stubborn = false; }
    if(gap < -9) { car.mode = "cruise"; car.honked = false; }
  }

  if(car.mode === "cruise"){
    // Keep left, but step around anything parked in the way.
    const look = freeInterval(car.s - 7);
    let want = -2.0;
    if(want < look.lo + CAR_W/2 + 0.2 || want > look.hi - CAR_W/2 - 0.2){
      want = (look.lo + look.hi)/2;
    }
    car.targetQ = want;
    // Slow down as the gap to the bus closes (light IDM flavour).
    let vWant = 7.0;
    if(gap > 0 && gap < 30) vWant = Math.max(1.6, 7.0 * (gap-6)/24);
    if(gap > 0 && gap < 9) vWant = 0;
    car.v += Math.max(-6*dt, Math.min(6*dt, (-vWant) - car.v));
  } else if(car.mode === "yield"){
    // Hug the far side of the bay so the bus gets the room.
    const fi = freeInterval(car.s);
    car.targetQ = fi.lo + CAR_W/2 + 0.15;
  } else if(car.mode === "telegraph" || car.mode === "wait"){
    car.v += Math.max(-8*dt, Math.min(8*dt, 0 - car.v));
  }

  car.s += car.v * dt;        // signed along +s: cruise negative, backing positive
  car.q += Math.max(-1.8*dt, Math.min(1.8*dt, car.targetQ - car.q));
  if(car.s < 4 || car.s > TOTAL_S - 2) spawnCar();

  const w = toWorld(car.s, car.q);
  const lateralDrift = (car.targetQ - car.q);
  car.x = w.x; car.y = w.y;
  car.ang = w.ang + Math.PI + Math.max(-0.25, Math.min(0.25, -lateralDrift*0.35));
}
function carOBB(){ return {x:car.x, y:car.y, ang:car.ang, hl:CAR_L/2, hw:CAR_W/2}; }

// ============================================================
// Clearance probing -- ray-march outward from the bus flanks. Feeds the
// squeeze feedback, the mirror fold and the HUD bars.
// ============================================================
let clearL = 1.5, clearR = 1.5, squeezing = false, squeezeMin = 9, squeezeDirty = false;
let squeezeFlash = 0, squeezeFlashVal = 0;
const CLEAR_CAP = 1.5;

function blockedAt(px,py){
  const pr = project(px,py);
  if(Math.abs(pr.q) > pr.hw || pr.s <= 0.2 || pr.s >= TOTAL_S-0.2) return true;
  for(const o of obstacles) if(pointInOBB(px,py,o)) return true;
  const co = carOBB();
  if(pointInOBB(px,py,co)) return true;
  for(const b of bins) if((px-b.x)*(px-b.x)+(py-b.y)*(py-b.y) < b.r*b.r) return true;
  return false;
}
function probeSide(sign){
  const c = Math.cos(bus.h), s = Math.sin(bus.h);
  let best = CLEAR_CAP;
  for(const a of [-REAR_OH+0.4, 0, 2.5, 5.5, WB+FRONT_OH-0.4]){
    const ox = bus.rx + a*c, oy = bus.ry + a*s;
    for(let d=0; d<=CLEAR_CAP; d+=0.12){
      const b = sign*(BUS_HW + d);
      if(blockedAt(ox + b*s, oy - b*c)){ if(d < best) best = d; break; }
    }
  }
  return best;
}

// ============================================================
// Collision -- forgiving by design. Scrapes cost paint and a little speed,
// head-on contact stalls you. Nothing ever ends the run.
// ============================================================
let shake = 0, hitCount = 0;
const sparks = [];
function addSparks(x,y,n){
  for(let i=0;i<n;i++)
    sparks.push({x,y, vx:(Math.random()-0.5)*7, vy:(Math.random()-0.5)*7, life:0.28+Math.random()*0.22});
}
function resolveHit(nx,ny,depth,px,py){
  bus.rx += nx*depth; bus.ry += ny*depth;
  const c = Math.cos(bus.h), s = Math.sin(bus.h);
  const along = Math.abs(nx*c + ny*s);         // 1 = head-on, 0 = pure scrape
  const impact = Math.abs(bus.v) * (0.25 + along);
  if(along > 0.55){
    bus.v *= 0.06;                              // stall
  } else {
    bus.v *= 0.90;                              // scrape past
    const lx = (px-bus.rx)*c + (py-bus.ry)*s;
    const side = ((px-bus.rx)*s - (py-bus.ry)*c) > 0 ? 1 : -1;
    if(bus.scrapes.length < 40 && Math.abs(bus.v) > 0.6) bus.scrapes.push({a:lx, side});
    bus.h += side * Math.min(0.05, Math.abs(bus.v)*0.006);   // slight yaw kick
  }
  if(impact > 0.7){
    shake = Math.min(4.5, shake + impact*0.5);
    addSparks(px, py, 3 + (impact*1.5|0));
    sBump(impact);
    hitCount++;
    squeezeDirty = true;
  }
  bus.bump = Math.max(bus.bump, Math.min(1, impact/6));
}
function collide(){
  const A = busOBB();
  for(const o of obstacles){
    const m = satOBB(A,o);
    if(m) resolveHit(m.nx, m.ny, m.depth, (A.x+o.x)/2, (A.y+o.y)/2);
  }
  const co = carOBB();
  const mc = satOBB(A,co);
  if(mc) resolveHit(mc.nx, mc.ny, mc.depth, (A.x+co.x)/2, (A.y+co.y)/2);

  // Walls: push each body corner and flank midpoint back inside the corridor.
  const c = Math.cos(bus.h), s = Math.sin(bus.h);
  for(const a of [-REAR_OH, 0, 2.5, 5.5, WB+FRONT_OH]){
    for(const b of [-BUS_HW, BUS_HW]){
      const px = bus.rx + a*c + b*s, py = bus.ry + a*s - b*c;
      const pr = project(px,py);
      const over = Math.abs(pr.q) - pr.hw;
      if(over > 0){
        const p = pathPoint(pr.s);
        const sgn = pr.q > 0 ? 1 : -1;
        resolveHit(-p.nx*sgn, -p.ny*sgn, over, px, py);
      }
      if(pr.s < 0.4 || pr.s > TOTAL_S-0.4){
        const p = pathPoint(pr.s < 0.4 ? 0 : TOTAL_S);
        const sgn = pr.s < 0.4 ? 1 : -1;
        resolveHit(p.dx*sgn, p.dy*sgn, 0.5, px, py);
      }
    }
  }
  // Bins are nudgeable -- the pressure valve, and the funniest thing here.
  for(const bn of bins){
    const pr2 = ((bn.x-A.x)*Math.cos(A.ang) + (bn.y-A.y)*Math.sin(A.ang));
    const ly = ((bn.x-A.x)*Math.sin(A.ang) - (bn.y-A.y)*Math.cos(A.ang));
    if(Math.abs(pr2) < A.hl + bn.r && Math.abs(ly) < A.hw + bn.r){
      const push = (ly > 0 ? 1 : -1);
      const c2 = Math.cos(bus.h), s2 = Math.sin(bus.h);
      bn.vx += (s2*push)*Math.abs(bus.v)*0.55 + c2*bus.v*0.25;
      bn.vy += (-c2*push)*Math.abs(bus.v)*0.55 + s2*bus.v*0.25;
      bn.spin += (Math.random()-0.5)*9;
      const need = A.hw + bn.r - Math.abs(ly);
      bn.x += s2*push*need; bn.y += -c2*push*need;
      if(Math.abs(bus.v) > 1.2){ sBin(); }
    }
  }
}

// ============================================================
// Camera -- world-fixed (never rotates), critically damped, with a
// look-ahead that is capped so the tail can never leave the screen.
// ============================================================
let camX = 0, camY = 0, camVX = 0, camVY = 0;
function updateCam(dt, snap){
  const p = busCentre();
  const c = Math.cos(bus.h), s = Math.sin(bus.h);
  const halfAlong = ((W/2)*Math.abs(c) + (H/2)*Math.abs(s)) / PPM;
  const maxLook = Math.max(0, halfAlong - (BUS_L/2) - 2.5);
  const look = Math.min(Math.abs(bus.v) * 1.15, maxLook, 20);
  const tx = p.x + c*look, ty = p.y + s*look;
  if(snap){ camX = tx; camY = ty; camVX = camVY = 0; return; }
  const w = 6.5;
  camVX += (-2*w*camVX - w*w*(camX-tx))*dt; camX += camVX*dt;
  camVY += (-2*w*camVY - w*w*(camY-ty))*dt; camY += camVY*dt;
}
let shakeX = 0, shakeY = 0;
// Screen mapping. Same formula as the prototype; the shake term is authored
// in prototype pixels (a 320-wide canvas) so it is scaled to the real
// viewport here, otherwise a 4 px kick is invisible on a laptop.
function shakeScale(){ return PPM_BASE/6; }
function sx(x){ return (x-camX)*PPM + W/2 + shakeX*shakeScale(); }
function sy(y){ return (y-camY)*PPM + H/2 + shakeY*shakeScale(); }

// ============================================================
// Update
// ============================================================
const input = { left:false, right:false, up:false, down:false, horn:false, hornEdge:false, axis:0 };
let timeScale = 1, showGhost = true, frameNo = 0;
let noClip = false;   // test-only: skip collision resolution

function update(){
  frameNo++;
  const target = squeezing ? 0.9 : 1;
  timeScale += (target - timeScale) * 0.12;
  const dt = (1/60) * timeScale;

  // Steering ramps to lock over ~250 ms and self-centres faster, so a
  // partial lock is holdable. Binary steer would ruin the precision fantasy.
  // input.axis is the analogue channel a touch drag writes to. It is 0 unless a
  // drag is live, so the keyboard, the variants and the parity harness are all
  // exactly as they were.
  let want = input.axis || 0;
  if(input.left) want -= 1;
  if(input.right) want += 1;
  if(want > 1) want = 1; else if(want < -1) want = -1;
  const rate = want === 0 ? dt/0.18 : dt/0.25;
  const diff = want - bus.steerNorm;
  bus.steerNorm += Math.max(-rate, Math.min(rate, diff));
  const speedFrac = Math.min(1, Math.abs(bus.v)/V_MAX);
  bus.steer = bus.steerNorm * STEER_MAX * (1 - 0.62*speedFrac);

  // Mass: slow to wind up, slow to shed.
  if(input.up)        bus.v += ACCEL*dt;
  else if(input.down){
    if(bus.v > 0.15)  bus.v -= BRAKE*dt;
    else              bus.v -= ACCEL*0.7*dt;
  } else {
    const d = DRAG*dt;
    if(bus.v > d) bus.v -= d; else if(bus.v < -d) bus.v += d; else bus.v = 0;
  }
  if(bus.v > V_MAX) bus.v = V_MAX;
  if(bus.v < -V_REV) bus.v = -V_REV;

  bus.rx += bus.v*dt*Math.cos(bus.h);
  bus.ry += bus.v*dt*Math.sin(bus.h);
  bus.h  += bus.v*dt*Math.tan(bus.steer)/WB;

  if(input.hornEdge){
    input.hornEdge = false;
    sHorn();
    const bp = busS();
    if(Math.abs(car.s - bp.s) < 50) car.honked = true;
  }

  updateCar(dt);
  if(!noClip) collide();

  for(const b of bins){
    b.x += b.vx*dt; b.y += b.vy*dt; b.ang += b.spin*dt;
    const f = Math.pow(0.02, dt);
    b.vx *= f; b.vy *= f; b.spin *= f;
    const pr = project(b.x,b.y);
    if(Math.abs(pr.q) > pr.hw - b.r){
      const p = pathPoint(pr.s), sg = pr.q > 0 ? 1 : -1;
      const over = Math.abs(pr.q) - (pr.hw - b.r);
      b.x -= p.nx*sg*over; b.y -= p.ny*sg*over;
      b.vx *= -0.4; b.vy *= -0.4;
    }
  }
  for(let i=sparks.length-1;i>=0;i--){
    const p = sparks[i];
    p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= 0.9; p.vy *= 0.9;
    p.life -= dt; if(p.life <= 0) sparks.splice(i,1);
  }

  clearL = probeSide(1); clearR = probeSide(-1);
  const wasSqueezing = squeezing;
  squeezing = clearL < 0.75 && clearR < 0.75;
  if(squeezing){
    const g = Math.min(clearL, clearR);
    if(!wasSqueezing){ squeezeMin = g; squeezeDirty = false; }
    else if(g < squeezeMin) squeezeMin = g;
    sSqueeze(g);
  } else if(wasSqueezing){
    if(!squeezeDirty){ squeezeFlash = 1.1; squeezeFlashVal = squeezeMin; sChime(); }
    squeezeDirty = false;
  }
  if(squeezeFlash > 0) squeezeFlash -= dt;

  if(shake > 0){ shake = Math.max(0, shake - dt*9); }
  shakeX = shake ? (Math.random()-0.5)*shake*2 : 0;
  shakeY = shake ? (Math.random()-0.5)*shake*2 : 0;
  bus.bump = Math.max(0, bus.bump - dt*2.5);

  updateCam(dt, false);
  engineUpdate(bus.v);
}

// ============================================================
// GAME
// The one-street gate test passed (research S15), so this is the shift
// built on top of it: a route with stops, a manifest, a clock and a
// comfort multiplier -- S3 (three pressures that disagree), S4 (the fare
// loop, bus-ified) and S12 (session structure and scoring).
//
// The rule that keeps the physics honest: nothing here runs inside
// update(). gameTick() is called immediately after it, from the same
// fixed-step loop, and the only thing it writes back into the driving
// model is payloadStep() -- the passengers' mass, added as a correction.
// With an empty bus that correction is exactly zero, which is why
// tools/parity-bus.js still reports no drift at all against bus.html.
// ============================================================

const DOCK_SKEW = 0.34;    // radians of skew tolerated
const BOARD_MIN = 0.9;     // S4: dead time is the enemy -- best case under 1.5 s
const BOARD_MAX = 3.2;
