// The playable routes. [0] is the reference street and never appears in a menu.
const ROUTES = LEVELS.reduce((a,L,i)=> L.hidden ? a : a.concat(i), []);
function routeOrd(lvl){ const k = ROUTES.indexOf(lvl); return k < 0 ? 0 : k; }
function nextRoute(lvl){
  const k = ROUTES.indexOf(lvl);
  return k >= 0 && k < ROUTES.length-1 ? ROUTES[k+1] : -1;
}

// ---------- state ----------
const G = {
  state:"title",          // title | brief | play | result | shift
  lvl:0, pick:1,   // pick is a LEVELS index; ROUTES[0] is the first playable one
  clock:0, par:0, score:0, mult:1, chain:0,
  riders:0, moved:0, next:0,
  comfort:1,
  holdT:0, holdCool:0, brace:0,
  doorT:0, board:0, boardLen:0, boardQ:0, boardOn:0, boardOff:0,
  msg:"", msgT:0, msgKey:'x', hint2:0,
  pop:[],                 // floating score pops: {s, x, y, t}
  hits:[],                // tappable rectangles on the front-end cards
  sqArmed:true,           // one squeeze bonus per squeeze, not per frame
  lastHits:0, prevV:0, prevH:0, hitCool:0,
  runScore:0,             // carried across both levels of a shift
  best:[0,0],
  tick:0, waiters:[], alight:[]
};
try{
  G.best[0] = parseInt(localStorage.getItem("bus4k_best0"),10) || 0;
  G.best[1] = parseInt(localStorage.getItem("bus4k_best1"),10) || 0;
}catch(e){}

function levelData(){ return LEVELS[G.lvl]; }
function nextStop(){ return G.stops && G.next < G.stops.length ? G.stops[G.next] : null; }
function say(m, key, t){ G.msg = m; G.msgKey = key || 'x'; G.msgT = t || 2.2; }
function pop(text, x, y, key){ G.pop.push({s:text, x, y, t:1.5, key:key||'y'}); }

// ---------- level loading ----------
// Rebuilds the whole world from a level spec. The three builders below use
// their own seeded generators, never Math.random, so loading a level cannot
// shift the shared random stream that the oncoming car draws its personality
// from -- which is what lets the parity harness reset mid-run and still agree.
function loadLevel(i){
  G.lvl = Math.max(0, Math.min(LEVELS.length-1, i|0));
  const L = LEVELS[G.lvl];
  NODES.length = 0;
  for(const n of L.nodes) NODES.push(n);
  buildPath();
  PARKED_SPEC = L.parked;
  BIN_SPEC    = L.bins;
  buildNormals(); buildProps(); buildBlocks();
  G.stops = L.stops.map((st,k)=>Object.assign({idx:k, served:false, missed:false}, st));
  G.par = L.par;
}

// A stop's kerb-side geometry: where the post stands, and where the bus's
// front door has to end up.
function stopPost(st){
  const p = pathPoint(st.s);
  const w = toWorld(st.s, st.side*(p.hw - PAVE*0.45));
  return { x:w.x, y:w.y, ang:p.ang, hw:p.hw };
}
function stopDoorQ(st){
  const p = pathPoint(st.s);
  return st.side * ((p.hw - PAVE) - BUS_HW - 0.10);
}
function stopGapTol(st){ return st.blocked ? 2.9 : DOCK_GAP; }

// How well the bus is currently parked at a stop. Returns null when the
// door is nowhere near it.
function dockAt(st){
  const d = busLocal(DOOR_A, st.side*BUS_HW);
  const pr = project(d.x, d.y);
  const ds = pr.s - st.s;
  const gap = (pr.hw - PAVE) - st.side*pr.q;      // flank to kerb line, metres
  let da = bus.h - pathPoint(st.s).ang;
  while(da >  Math.PI) da -= 2*Math.PI;
  while(da < -Math.PI) da += 2*Math.PI;
  const skew = Math.abs(da);
  const tol = stopGapTol(st);
  if(Math.abs(ds) > DOCK_S || gap < -0.40 || gap > tol || skew > DOCK_SKEW*2)
    return { ok:false, ds, gap, skew };
  const qs = 1 - Math.min(1, Math.abs(ds)/DOCK_S);
  const ref = st.blocked ? 2.4 : DOCK_REF;
  const qg = 1 - Math.min(1, Math.max(0, gap - 0.10)/ref);
  const qa = 1 - Math.min(1, skew/(DOCK_SKEW*2));
  let q = 0.20*qs + 0.45*qg + 0.35*qa;
  if(st.blocked) q = Math.min(q, 0.78);           // you cannot ace a dock you can't reach
  return { ok:true, ds, gap, skew, q };
}
function grade(q){ return q >= 0.88 ? "PERFECT" : q >= 0.70 ? "GOOD" : q >= 0.45 ? "OK" : "ROUGH"; }

// ---------- shift control ----------
function startLevel(i){
  loadLevel(i);
  resetAll();
  G.clock = G.par; G.next = 0; G.riders = 0; G.moved = 0;
  G.mult = 1; G.chain = 0; G.comfort = 1; G.sqArmed = true;
  G.holdT = 0; G.holdCool = 0; G.brace = 0;
  G.doorT = 0; G.board = 0; G.boardLen = 0; G.alight.length = 0;
  G.lastHits = hitCount; G.prevV = bus.v; G.prevH = bus.h; G.hitCool = 0;
  G.score = 0; G.pop.length = 0; G.msgT = 0; G.tick = 0; G.hint2 = 0;
  buildWaiters();
  G.state = "play";
  routeHint();
}
function beginShift(i){ G.runScore = 0; G.pick = i; G.lvl = i; G.state = "brief"; }

// Advance from any non-play screen. One button drives the whole front end.
function advance(){
  audioInit();
  if(G.state === "title"){ beginShift(G.pick); return; }
  if(G.state === "brief"){ startLevel(G.lvl); return; }
  if(G.state === "result"){
    const nx = nextRoute(G.lvl);
    if(G.result && G.result.win && nx >= 0){ G.lvl = nx; G.state = "brief"; }
    else if(G.result && G.result.win){ G.state = "shift"; }
    else { G.state = "brief"; }                 // out of time: straight back in
    return;
  }
  if(G.state === "shift"){ G.state = "title"; loadLevel(G.pick); resetAll(); return; }
}
function endLevel(win){
  const left = Math.max(0, G.clock|0);
  const timeBonus = win ? left*60 : 0;   // finishing early has to be worth real points
  G.score += timeBonus;
  if(win){
    G.runScore += G.score;                        // only completed routes count
    const bi = routeOrd(G.lvl);
    if(G.score > G.best[bi]){
      G.best[bi] = G.score;
      try{ localStorage.setItem("bus4k_best"+bi, ""+G.score); }catch(e){}
    }
  }
  G.result = { win, timeBonus, left, moved:G.moved, score:G.score,
               served:G.stops.filter(s=>s.served).length, total:G.stops.length };
  G.state = "result";
  sSqueezeOff();
}

// ---------- mass (S2.3) ----------
// update() is the empty-bus model, untouched. This adds the payload back
// afterwards: slower to wind up, much longer to shed. A full bus takes about
// 33 m to stop from 50 km/h where an empty one takes 23 m, which is the whole
// point -- a successful pickup run makes the next corner harder.
function payloadStep(sdt){
  const k = G.riders / CAP;
  if(k <= 0) return;
  if(input.up){
    bus.v -= ACCEL*sdt*k*0.34;
  } else if(input.down && bus.v > 0.15){
    bus.v += BRAKE*sdt*k*0.30;
  } else if(!input.down && Math.abs(bus.v) > 1e-6){
    const give = DRAG*sdt*k*0.35;                 // momentum carries a loaded bus further
    if(bus.v > 0) bus.v += give; else bus.v -= give;
  }
  if(bus.v >  V_MAX) bus.v =  V_MAX;
  if(bus.v < -V_REV) bus.v = -V_REV;
}

// ---------- comfort (S3) ----------
// A multiplier, never a health bar. An empty bus cannot spill anyone's
// shopping, so this only bites once you are actually carrying people.
function comfortStep(sdt){
  const lon = Math.abs(bus.v - G.prevV)/Math.max(1e-4, sdt);
  let dh = bus.h - G.prevH;
  while(dh >  Math.PI) dh -= 2*Math.PI;
  while(dh < -Math.PI) dh += 2*Math.PI;
  const lat = Math.abs(bus.v * dh/Math.max(1e-4, sdt));
  G.prevV = bus.v; G.prevH = bus.h;
  if(G.riders <= 0){ G.comfort = Math.min(1, G.comfort + sdt*0.55); return; }

  let pen = 0;
  if(lon > 2.6) pen += (lon - 2.6)*0.11;
  if(lat > 2.4) pen += (lat - 2.4)*0.13;
  const bp = busS();
  if(Math.abs(bp.q) > bp.hw - PAVE) pen += 0.30;   // riding the kerb rattles everyone
  pen = Math.min(pen, 2.5);

  if(G.holdT > 0){
    if(pen > 0.02) G.brace = Math.min(1, G.brace + pen*0.9);
    return;                                        // braced: free violence
  }
  if(pen > 0) G.comfort = Math.max(0, G.comfort - pen*sdt);
  else        G.comfort = Math.min(1, G.comfort + sdt*0.16);

  if(G.comfort < 0.34){
    G.comfort = 0.60;
    if(G.mult > 1){ G.mult--; say("SHOPPING EVERYWHERE  ·  x"+G.mult, 'r', 2.0); }
    else say("HOLD ON BACK THERE!", 'r', 1.6);
    sJolt();
  }
}

function holdOn(){
  if(G.state !== "play" || G.holdCool > 0 || G.holdT > 0) return;
  G.holdT = HOLD_T; G.holdCool = HOLD_COOL;
  G.clock = Math.max(0, G.clock - HOLD_COST);
  say("HOLD ON!  −"+HOLD_COST.toFixed(0)+"s", 'h', 1.4);
  sHold();
}

// ---------- waiting-passenger dressing ----------
// Purely aesthetic (S4.1: the waving character draws the eye and has no
// mechanics). Seeded so a level always looks the same.
function buildWaiters(){
  G.waiters.length = 0;
  let seed = 1337 + G.lvl*7919;
  const rnd = ()=> (seed = (seed*1664525 + 1013904223) >>> 0) / 4294967296;
  for(const st of G.stops){
    const p = pathPoint(st.s);
    const list = [];
    for(let i=0;i<st.on;i++){
      const along = st.s - 2.6 + rnd()*5.2;
      const off   = (p.hw - PAVE*0.62) - rnd()*0.45;
      const w = toWorld(along, st.side*off);
      list.push({ x:w.x, y:w.y, ang:p.ang, ph:rnd()*6.283, coat:rnd(), gone:false });
    }
    G.waiters.push(list);
  }
}

// Move whoever is mid-transfer. Dressing only -- no rider count depends on
// where these figures happen to be.
function walkStep(dt){
  const st = nextStop();
  if(st){
    const dw = busLocal(DOOR_A, st.side*BUS_HW);
    for(const w of (G.waiters[st.idx] || [])){
      if(w.gone || w.go === undefined) continue;
      if(w.go > 0){ w.go -= dt; continue; }
      const dx = dw.x-w.x, dy = dw.y-w.y, L = Math.hypot(dx,dy);
      if(L < 0.45){ w.gone = true; continue; }
      const v2 = Math.min(1.6, 0.9 + L*0.5)*dt;
      w.x += dx/L*v2; w.y += dy/L*v2;
      w.ang = Math.atan2(dy,dx);
    }
  }
  for(let i=G.alight.length-1;i>=0;i--){
    const a = G.alight[i];
    a.life -= dt;
    if(a.life <= 0){ G.alight.splice(i,1); continue; }
    if(a.wait > 0){ a.wait -= dt; continue; }
    const dx = a.tx-a.x, dy = a.ty-a.y, L = Math.hypot(dx,dy);
    if(L > 0.25){
      const v2 = Math.min(1.5, 0.8 + L*0.6)*dt;
      a.x += dx/L*v2; a.y += dy/L*v2;
      a.ang = Math.atan2(dy,dx);
    }
  }
}

// ---------- the per-frame game step ----------
function gameTick(){
  const sdt = (1/60)*timeScale;      // exactly the dt update() just integrated with
  G.tick++;

  if(G.state !== "play"){
    G.prevV = bus.v; G.prevH = bus.h;
    for(let i=G.pop.length-1;i>=0;i--){ G.pop[i].t -= 1/60; if(G.pop[i].t<=0) G.pop.splice(i,1); }
    if(G.msgT > 0) G.msgT -= 1/60;
    return;
  }

  payloadStep(sdt);
  comfortStep(sdt);

  // Damage: never a fail state, always a cost (S12). The score bleeds per
  // contact, but the clock is charged at most once every 0.8 s, so a long
  // scrape down a wall is expensive rather than instantly fatal.
  if(G.hitCool > 0) G.hitCool -= 1/60;
  if(hitCount > G.lastHits){
    const n = hitCount - G.lastHits;
    G.lastHits = hitCount;
    G.score = Math.max(0, G.score - 30*n);
    G.comfort = Math.max(0, G.comfort - Math.min(0.22, 0.08*n));
    if(G.hitCool <= 0){
      G.hitCool = 0.8;
      G.clock = Math.max(0, G.clock - 2);
      if(G.mult > 1){ G.mult = 1; G.chain = 0; say("CRUNCH  ·  −2s  ·  COMBO LOST", 'r', 1.8); }
      else say("CRUNCH  ·  −2s", 'r', 1.4);
    } else if(G.mult > 1){ G.mult = 1; G.chain = 0; }
  }

  // A clean squeeze is worth money, and it builds the chain (S12). The flash
  // stays up for most of a second, so the payout is armed once and consumed.
  if(squeezeFlash <= 0) G.sqArmed = true;
  if(squeezeFlash > 0 && G.sqArmed){
    G.sqArmed = false;
    const cm = Math.max(0, 0.75 - squeezeFlashVal);
    const pts = Math.round(cm*900)*G.mult;
    if(pts > 0){
      G.score += pts;
      G.chain++;
      const bc = busCentre();
      pop("+"+pts, bc.x, bc.y, 'e');
      if(G.chain % 2 === 0 && G.mult < 5){ G.mult++; say("SMOOTH  ·  x"+G.mult, 'e', 1.6); }
    }
  }

  walkStep(1/60);
  if(G.holdT > 0) G.holdT -= 1/60;
  if(G.holdCool > 0) G.holdCool -= 1/60;
  if(G.brace > 0) G.brace = Math.max(0, G.brace - 1.6/60);

  // ---- stops, doors, boarding ----
  const st = nextStop();
  if(st){
    const d = dockAt(st);
    if(G.board > 0){
      // Doors open: the bus is going nowhere, which is also the real rule.
      bus.v = 0;
      G.doorT = Math.min(1, G.doorT + (1/60)/0.35);
      G.board -= 1/60;
      if(G.board <= 0){
        G.doorT = 0;
        st.served = true;
        const off = Math.min(G.riders, st.terminus ? G.riders : st.off);
        G.riders -= off;
        const on = Math.min(st.on, CAP - G.riders);
        G.riders += on;
        G.moved += off + on;
        const base = Math.round((70*(off+on) + 90) * (0.55 + G.boardQ));
        const pts = base*G.mult;
        G.score += pts;
        G.clock += st.bonus;
        const sp = stopPost(st);
        pop("+"+pts, sp.x, sp.y, 'e');
        G.chain++;
        if(G.boardQ >= 0.70 && G.comfort > 0.72 && G.mult < 5){
          G.mult++;
          say(grade(G.boardQ)+" DOCK  ·  x"+G.mult+(st.bonus?"  ·  +"+st.bonus+"s":""), 'e', 2.2);
        } else {
          say(grade(G.boardQ)+" DOCK"+(st.bonus?"  ·  +"+st.bonus+"s":""), 'y', 2.0);
        }
        sChime();
        G.next++;
        if(st.terminus){ endLevel(true); return; }
      }
    } else if(d.ok && Math.abs(bus.v) < 0.08){
      G.boardQ = d.q;
      G.boardLen = BOARD_MIN + (1-d.q)*(BOARD_MAX-BOARD_MIN);
      G.board = G.boardLen;
      G.doorT = 0;
      sDoors();
      // Send the queue at the door rather than deleting it: the two seconds
      // the doors are open are the only two seconds anyone can see the point
      // of the whole loop.
      const list = G.waiters[st.idx] || [];
      for(let i=0;i<list.length;i++) list[i].go = 0.10 + i*(G.boardLen*0.55/Math.max(1,list.length));
      const off = Math.min(G.riders, st.terminus ? G.riders : st.off);
      const p = pathPoint(st.s);
      for(let i=0;i<off;i++){
        const dw = busLocal(DOOR_A, st.side*BUS_HW);
        const t = toWorld(st.s - 1.6 + (i%3)*1.6, st.side*(p.hw - PAVE*0.5));
        G.alight.push({ x:dw.x, y:dw.y, tx:t.x, ty:t.y, ang:p.ang,
                        wait:0.25 + i*(G.boardLen*0.5/Math.max(1,off)),
                        coat:(i*0.37)%1, life:3.2 });
      }
    } else {
      G.doorT = Math.max(0, G.doorT - (1/60)/0.30);
      // The overshoot (S4): sail past and it is entirely your own fault.
      const bp = busS();
      if(!st.missed && bp.s > st.s + DOCK_S + BUS_L*0.6){
        st.missed = true;
        say("MISSED "+st.name+"  ·  BACK UP", 'h', 2.6);
      } else if(st.missed && bp.s < st.s + DOCK_S){
        st.missed = false;
      }
    }
  }

  // ---- the clock ----
  const wasWhole = Math.ceil(G.clock);
  G.clock -= 1/60;
  if(G.clock < 10 && Math.ceil(G.clock) !== wasWhole) sTick();
  if(G.clock <= 0){ G.clock = 0; endLevel(false); return; }

  for(let i=G.pop.length-1;i>=0;i--){ G.pop[i].t -= 1/60; if(G.pop[i].t<=0) G.pop.splice(i,1); }
  if(G.msgT > 0) G.msgT -= 1/60;
  if(G.hint2 > 0){
    G.hint2 -= 1/60;
    if(G.hint2 <= 0) say("TWO-FINGER TAP  \u00b7  HOLD ON", 'w', 3.0);
  }
}

// ============================================================
// RENDER
// Everything from here down is new. The prototype drew 320x192 pixels with a
// scanline rasteriser; this draws real geometry at the device's own
// resolution, with fake-3D extruded buildings, a directional sun, and enough
// surface grime that the street reads as a place rather than a corridor.
// No sim state is touched below this line -- all render-only state
// (particles, skid marks, eased zoom) lives here and is driven by the frame
// delta, so update() stays bit-identical to bus.html.
// ============================================================

const SUN_DX = 0.62, SUN_DY = 0.42;        // world direction shadows fall
const SUN_L  = Math.hypot(SUN_DX, SUN_DY);
const EXT    = 0.115;                      // building lean per metre of camera distance
const BLD_SH = 2.1;                        // building shadow length per unit height

function shade(a){ return "rgba(0,0,0,"+a+")"; }
function lite(a){ return "rgba(255,255,255,"+a+")"; }
function hash2(a,b){
  let h = (a*374761393 + b*668265263) | 0;
  h = ((h ^ (h>>>13)) * 1274126177) | 0;
  return ((h ^ (h>>>16)) >>> 0) / 4294967296;
}
// Rounded rect path in whatever space the context is currently in.
function rr(x,y,w,h,r){
  r = Math.min(r||0, Math.abs(w)/2, Math.abs(h)/2);
  ctx.beginPath();
  if(!r){ ctx.rect(x,y,w,h); ctx.closePath(); return; }
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
function fillRR(x0,y0,x1,y1,style,r){
  rr(Math.min(x0,x1), Math.min(y0,y1), Math.abs(x1-x0), Math.abs(y1-y0), r);
  ctx.fillStyle = style; ctx.fill();
}
function fillKey(x0,y0,x1,y1,key,r){ if(key !== ".") fillRR(x0,y0,x1,y1,col(key),r); }
// World polygon helper: pts are {x,y} in world metres.
// Polygon in the CURRENT transform (metres inside inLocal), as opposed to
// poly(), which takes world points and maps them through sx/sy.
function poly2(pts){
  ctx.beginPath();
  for(let i=0;i<pts.length;i++){
    if(i === 0) ctx.moveTo(pts[i][0], pts[i][1]); else ctx.lineTo(pts[i][0], pts[i][1]);
  }
  ctx.closePath();
}
function poly(pts){
  ctx.beginPath();
  for(let i=0;i<pts.length;i++){
    const px = sx(pts[i].x), py = sy(pts[i].y);
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();
}
// Draw in a body's local frame: +x forward, +y left, units are METRES.
function inLocal(x,y,ang,fn){
  const c = Math.cos(ang), s = Math.sin(ang);
  ctx.save();
  ctx.transform(c*PPM, s*PPM, s*PPM, -c*PPM, sx(x), sy(y));
  fn();
  ctx.restore();
}

// ---------- asphalt grain, rebuilt whenever the viewport changes ----------
let grain = null, grainSize = 64;
function buildTexture(){
  grain = null;
  if(typeof document === "undefined" || !document.createElement) return;
  let tile;
  try { tile = document.createElement("canvas"); } catch(e){ return; }
  if(!tile || !tile.getContext) return;
  tile.width = tile.height = grainSize;
  const g = tile.getContext("2d");
  if(!g || !g.fillRect) return;
  for(let y=0; y<grainSize; y+=2){
    for(let x=0; x<grainSize; x+=2){
      const n = hash2(x*7+1, y*11+3);
      g.fillStyle = n > 0.5 ? "rgba(255,255,255,"+(0.030*(n-0.5)*2).toFixed(3)+")"
                            : "rgba(0,0,0,"+(0.055*(0.5-n)*2).toFixed(3)+")";
      g.fillRect(x,y,2,2);
    }
  }
  try { grain = ctx.createPattern(tile, "repeat"); } catch(e){ grain = null; }
}

// ---------- corridor outline, mitred at the kinks ----------
const NRM = [];
function buildNormals(){
  NRM.length = 0;
  for(let i=0;i<NODES.length;i++){
    let nx, ny;
    if(i === 0){ nx = SEGS[0].nx; ny = SEGS[0].ny; }
    else if(i === NODES.length-1){ const g = SEGS[SEGS.length-1]; nx = g.nx; ny = g.ny; }
    else {
      nx = SEGS[i-1].nx + SEGS[i].nx; ny = SEGS[i-1].ny + SEGS[i].ny;
      const L = Math.hypot(nx,ny) || 1; nx /= L; ny /= L;
      const d = nx*SEGS[i].nx + ny*SEGS[i].ny;   // mitre out to the true corner
      if(d > 0.35){ nx /= d; ny /= d; }
    }
    NRM.push({x:nx, y:ny});
  }
}
function corridorPath(shrink, ext){
  ext = ext || 0;
  const g0 = SEGS[0], gN = SEGS[SEGS.length-1], last = NODES.length-1;
  ctx.beginPath();
  for(let pass=0; pass<2; pass++){
    const sg = pass === 0 ? 1 : -1;
    const from = pass === 0 ? 0 : last, to = pass === 0 ? last : 0, stp = pass === 0 ? 1 : -1;
    for(let i=from; ; i+=stp){
      const n = NRM[i], w = NODES[i].hw - shrink;
      let x = NODES[i].x + n.x*w*sg, y = NODES[i].y + n.y*w*sg;
      if(i === 0){ x -= g0.dx*ext; y -= g0.dy*ext; }
      if(i === last){ x += gN.dx*ext; y += gN.dy*ext; }
      const px = sx(x), py = sy(y);
      if(pass === 0 && i === 0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      if(i === to) break;
    }
  }
  ctx.closePath();
}

// ---------- one-time street dressing ----------
const PROPS = [];
function buildProps(){
  PROPS.length = 0;
  let seed = 90210;
  const rnd = ()=> (seed = (seed*1664525 + 1013904223) >>> 0) / 4294967296;
  for(let s = 5; s < TOTAL_S - 4; s += 2.6 + rnd()*6.5){
    const p = pathPoint(s);
    const inner = p.hw - PAVE - 0.5;
    const q = (rnd()*2 - 1) * inner;
    const roll = rnd();
    let pr;
    if(roll < 0.14)      pr = { k:"manhole", s, q, rad:0.32 + rnd()*0.12 };
    else if(roll < 0.26) pr = { k:"drain",   s, q:(q>0?1:-1)*(p.hw - PAVE - 0.3) };
    else if(roll < 0.62) pr = { k:"patch",   s, q, w:1.2 + rnd()*2.8, h:0.7 + rnd()*1.7, tw:(rnd()-0.5)*0.7 };
    else                 pr = { k:"crack",   s, q, w:1.2 + rnd()*3.2, tw:(rnd()-0.5)*1.6 };
    pr.ang = p.ang + (pr.tw || 0);
    const w = toWorld(s, pr.q); pr.x = w.x; pr.y = w.y;
    PROPS.push(pr);
  }
}

const BLOCKS = [];
function buildBlocks(){
  BLOCKS.length = 0;
  let seed = 4242;
  const rnd = ()=> (seed = (seed*1664525 + 1013904223) >>> 0) / 4294967296;
  for(const side of [1,-1]){
    let s = -12;
    while(s < TOTAL_S + 12){
      const len = 5.5 + rnd()*8.5;
      const dep = 7 + rnd()*10;
      const mid = Math.max(0, Math.min(TOTAL_S, s + len/2));
      const pm = pathPoint(mid);
      // Seat the inner face on the building line, then push it out until no
      // point along that face is inside the corridor. Blocks are straight and
      // the street is not, so on the inside of a bend the naive offset would
      // let a corner eat the road -- which the harness sweeps for.
      let innerOff = pm.hw + 0.15;
      for(let iter=0; iter<30; iter++){
        let worst = 0;
        for(let t=-1; t<=1.0001; t+=0.1){
          const ex = pm.x + pm.dx*t*len/2 + pm.nx*side*innerOff;
          const ey = pm.y + pm.dy*t*len/2 + pm.ny*side*innerOff;
          const pr = project(ex,ey);
          const need = pr.hw + 0.15 - Math.abs(pr.q);
          if(need > worst) worst = need;
        }
        if(worst <= 0) break;
        innerOff += worst + 0.02;
      }
      const off = innerOff + dep/2;
      BLOCKS.push({
        x: pm.x + pm.nx*side*off, y: pm.y + pm.ny*side*off, ang: pm.ang,
        hl: len/2, hw: dep/2,
        ht: 0.45 + rnd()*1.75,
        warm: rnd() < 0.45,
        seed: (rnd()*65536)|0
      });
      s += len + 0.3 + rnd()*1.4;
    }
  }
}

function viewBounds(m){
  const hx = (W/2)/PPM + m, hy = (H/2)/PPM + m;
  return { x0:camX-hx, x1:camX+hx, y0:camY-hy, y1:camY+hy };
}

// ---------- ground ----------
function drawGround(){
  ctx.fillStyle = col('a'); ctx.fillRect(0,0,W,H);

  // Pavement slab, then the kerb face, then the carriageway on top of it, so
  // the 0.2 m band left showing between them reads as a raised kerb.
  corridorPath(0, 1.0);      ctx.fillStyle = col('p'); ctx.fill();
  corridorPath(PAVE-0.20, 1.0); ctx.fillStyle = col('K'); ctx.fill();

  // Paving joints, drawn across the pavement ring.
  ctx.save();
  corridorPath(0, 1.0); ctx.clip();
  ctx.strokeStyle = col('P'); ctx.lineWidth = Math.max(1, 0.05*PPM);
  const vb = viewBounds(4);
  for(let s = 0; s < TOTAL_S; s += 1.35){
    const p = pathPoint(s);
    if(p.x < vb.x0-6 || p.x > vb.x1+6 || p.y < vb.y0-6 || p.y > vb.y1+6) continue;
    for(const sg of [1,-1]){
      const ax = p.x + p.nx*sg*(p.hw-PAVE), ay = p.y + p.ny*sg*(p.hw-PAVE);
      const bx = p.x + p.nx*sg*p.hw,        by = p.y + p.ny*sg*p.hw;
      ctx.beginPath(); ctx.moveTo(sx(ax),sy(ay)); ctx.lineTo(sx(bx),sy(by)); ctx.stroke();
    }
  }
  ctx.restore();

  // Kerb top highlight, then the road.
  corridorPath(PAVE-0.20, 1.0);
  ctx.strokeStyle = col('k'); ctx.lineWidth = Math.max(1, 0.09*PPM); ctx.stroke();
  corridorPath(PAVE, 1.0); ctx.fillStyle = col('d'); ctx.fill();

  // Everything from here is road-surface detail, clipped to the carriageway.
  ctx.save();
  corridorPath(PAVE, 1.0); ctx.clip();

  // Worn wheel tracks either side of the centreline.
  ctx.strokeStyle = col('R'); ctx.lineWidth = Math.max(1, 0.85*PPM);
  ctx.globalAlpha = 0.55;
  for(const q of [1.05, -1.05]){
    ctx.beginPath();
    for(let s=0; s<=TOTAL_S; s+=4){
      const w = toWorld(s, q);
      if(s === 0) ctx.moveTo(sx(w.x),sy(w.y)); else ctx.lineTo(sx(w.x),sy(w.y));
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // Patches, cracks, manholes, gully grates.
  for(const p of PROPS){
    if(p.x < vb.x0 || p.x > vb.x1 || p.y < vb.y0 || p.y > vb.y1) continue;
    if(p.k === "patch"){
      inLocal(p.x, p.y, p.ang, ()=>{
        fillKey(-p.w/2,-p.h/2, p.w/2, p.h/2, 'T', 0.25);
        ctx.strokeStyle = col('Z'); ctx.lineWidth = 0.06;
        rr(-p.w/2,-p.h/2,p.w,p.h,0.25); ctx.stroke();
      });
    } else if(p.k === "crack"){
      inLocal(p.x, p.y, p.ang, ()=>{
        ctx.strokeStyle = col('Z'); ctx.lineWidth = 0.055; ctx.beginPath();
        ctx.moveTo(-p.w/2, 0);
        ctx.lineTo(-p.w/6,  0.16);
        ctx.lineTo( p.w/6, -0.13);
        ctx.lineTo( p.w/2,  0.05);
        ctx.stroke();
      });
    } else if(p.k === "manhole"){
      const px = sx(p.x), py = sy(p.y);
      ctx.beginPath(); ctx.arc(px,py,p.rad*PPM,0,6.2832);
      ctx.fillStyle = col('Z'); ctx.fill();
      ctx.beginPath(); ctx.arc(px,py,p.rad*0.74*PPM,0,6.2832);
      ctx.fillStyle = col('T'); ctx.fill();
    } else {
      inLocal(p.x, p.y, p.ang, ()=>{
        fillKey(-0.32,-0.20, 0.32, 0.20, 'Z', 0.05);
        ctx.strokeStyle = col('D'); ctx.lineWidth = 0.045;
        for(let i=-2;i<=2;i++){ ctx.beginPath(); ctx.moveTo(i*0.12,-0.17); ctx.lineTo(i*0.12,0.17); ctx.stroke(); }
      });
    }
  }

  // Centre line.
  ctx.strokeStyle = col('l'); ctx.lineWidth = Math.max(1, 0.13*PPM);
  ctx.globalAlpha = 0.72;
  for(let s=0; s<TOTAL_S-2.6; s+=5){
    const a = pathPoint(s), b = pathPoint(Math.min(TOTAL_S, s+2.6));
    if(a.x < vb.x0 || a.x > vb.x1 || a.y < vb.y0 || a.y > vb.y1) continue;
    ctx.beginPath(); ctx.moveTo(sx(a.x),sy(a.y)); ctx.lineTo(sx(b.x),sy(b.y)); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // Rubber laid down by the player.
  if(skids.length){
    ctx.strokeStyle = shade(0.30); ctx.lineWidth = Math.max(1, 0.26*PPM);
    ctx.beginPath();
    for(const k of skids){
      if(k.x0 < vb.x0 || k.x0 > vb.x1 || k.y0 < vb.y0 || k.y0 > vb.y1) continue;
      ctx.moveTo(sx(k.x0),sy(k.y0)); ctx.lineTo(sx(k.x1),sy(k.y1));
    }
    ctx.stroke();
  }

  // Grain last, so it sits over the paint and the patches.
  if(grain){
    const t = grainSize;
    const ox = -(((camX*PPM) % t) + t) % t, oy = -(((camY*PPM) % t) + t) % t;
    ctx.save(); ctx.translate(ox, oy);
    ctx.fillStyle = grain; ctx.fillRect(0,0,W+t*2,H+t*2);
    ctx.restore();
  }
  ctx.restore();
}

// ---------- fake-3D buildings ----------
// The prism silhouette is the footprint plus the roof translated away from
// the camera. Draw the outward-facing walls, then drop the roof on top.
function blockCorners(B){
  const c = Math.cos(B.ang), s = Math.sin(B.ang), P = [];
  const quad = [[1,1],[1,-1],[-1,-1],[-1,1]];
  for(const [a,b] of quad)
    P.push({ x:B.x + a*B.hl*c + b*B.hw*s, y:B.y + a*B.hl*s - b*B.hw*c });
  return P;
}
function drawBlockShadows(){
  const vb = viewBounds(30);
  ctx.fillStyle = shade(0.26);
  for(const B of BLOCKS){
    if(B.x < vb.x0 || B.x > vb.x1 || B.y < vb.y0 || B.y > vb.y1) continue;
    const P = blockCorners(B), dx = SUN_DX*B.ht*BLD_SH, dy = SUN_DY*B.ht*BLD_SH;
    poly(P.concat([]).map(p=>({x:p.x+dx, y:p.y+dy})));
    ctx.fill();
  }
}
function drawBlocks(){
  const vb = viewBounds(30);
  for(const B of BLOCKS){
    if(B.x < vb.x0 || B.x > vb.x1 || B.y < vb.y0 || B.y > vb.y1) continue;
    const P = blockCorners(B);
    let ox = (B.x-camX)*EXT*B.ht, oy = (B.y-camY)*EXT*B.ht;
    const oL = Math.hypot(ox,oy);
    if(oL > 6){ ox = ox/oL*6; oy = oy/oL*6; }
    const offPx = Math.hypot(ox,oy)*PPM;
    const wallKey = B.warm ? 'Q' : 'B', roofKey = B.warm ? 'q' : 'b';

    for(let i=0;i<4;i++){
      const A = P[i], Bp = P[(i+1)%4];
      let ex = Bp.x-A.x, ey = Bp.y-A.y;
      const L = Math.hypot(ex,ey) || 1;
      let nx = ey/L, ny = -ex/L;
      const mx = (A.x+Bp.x)/2, my = (A.y+Bp.y)/2;
      if((mx-B.x)*nx + (my-B.y)*ny < 0){ nx = -nx; ny = -ny; }
      if((mx-camX)*nx + (my-camY)*ny >= 0) continue;      // faces away: hidden behind the roof

      poly([A, Bp, {x:Bp.x+ox, y:Bp.y+oy}, {x:A.x+ox, y:A.y+oy}]);
      ctx.fillStyle = col(wallKey); ctx.fill();
      const litness = -(nx*SUN_DX + ny*SUN_DY)/SUN_L;
      if(litness > 0){ ctx.fillStyle = lite(0.11*litness); ctx.fill(); }
      else           { ctx.fillStyle = shade(0.20*-litness); ctx.fill(); }

      // Windows, only once the wall is big enough on screen to read as one.
      if(offPx > 16 && L*PPM > 34){
        const cols = Math.max(1, Math.round(L/2.3));
        const rows = B.ht > 1.15 ? 3 : (B.ht > 0.72 ? 2 : 1);
        for(let ci=0; ci<cols; ci++){
          for(let ri=0; ri<rows; ri++){
            const hh = hash2(B.seed + i*977, ci*31 + ri*7);
            if(hh < 0.17) continue;
            const on = hh > 0.80;
            const u0 = (ci+0.26)/cols, u1 = (ci+0.74)/cols;
            const v0 = (ri+0.20)/rows, v1 = (ri+0.70)/rows;
            const pt = (u,v)=>({ x:A.x + ex*u + ox*v, y:A.y + ey*u + oy*v });
            poly([pt(u0,v0), pt(u1,v0), pt(u1,v1), pt(u0,v1)]);
            ctx.fillStyle = col(on ? 'j' : 'J'); ctx.fill();
          }
        }
      }
    }

    // Roof.
    const R = P.map(p=>({x:p.x+ox, y:p.y+oy}));
    poly(R); ctx.fillStyle = col(roofKey); ctx.fill();
    ctx.fillStyle = lite(0.05); ctx.fill();
    poly(R); ctx.strokeStyle = col('i');
    ctx.lineWidth = Math.max(1, 0.16*PPM); ctx.stroke();

    // Rooftop clutter: a vent box and a tank, seeded so they never move.
    if(offPx > 10){
      const rc = { x:(R[0].x+R[2].x)/2, y:(R[0].y+R[2].y)/2 };
      inLocal(rc.x, rc.y, B.ang, ()=>{
        const a = hash2(B.seed, 5), b = hash2(B.seed, 9);
        const bw = Math.min(B.hl*0.5, 1.4), bh = Math.min(B.hw*0.5, 1.2);
        const px = (a-0.5)*B.hl*0.9, py = (b-0.5)*B.hw*0.9;
        fillKey(px-bw/2, py-bh/2, px+bw/2, py+bh/2, 'i', 0.12);
        ctx.fillStyle = shade(0.22);
        rr(px-bw/2+0.12, py-bh/2+0.12, bw, bh, 0.12); ctx.fill();
        if(hash2(B.seed,13) > 0.55){
          const cx2 = -px*0.7, cy2 = -py*0.7;
          ctx.beginPath(); ctx.arc(cx2, cy2, Math.min(0.6, B.hw*0.28), 0, 6.2832);
          ctx.fillStyle = col('i'); ctx.fill();
        }
      });
    }
  }
}

// ---------- lighting helpers ----------
// World (SUN_DX,SUN_DY) expressed in a body's local (forward,left) frame.
// The local basis is its own inverse, so the same expression converts both ways.
function sunLocal(ang, k){
  const c = Math.cos(ang), s = Math.sin(ang);
  return { a:(SUN_DX*c + SUN_DY*s)*k, b:(SUN_DX*s - SUN_DY*c)*k };
}
// A light-to-dark wash across a body, aligned to the world sun rather than
// the body, so panels change tone as the bus swings round.
function sunWash(ang, reach, up, down){
  const sl = sunLocal(ang, reach);
  let g;
  try { g = ctx.createLinearGradient(-sl.a, -sl.b, sl.a, sl.b); } catch(e){ return null; }
  if(!g || !g.addColorStop) return null;
  g.addColorStop(0, lite(up));
  g.addColorStop(0.52, "rgba(255,255,255,0)");
  g.addColorStop(1, shade(down));
  return g;
}
function beam(wx, wy, ang, len, spread, al){
  const px = sx(wx), py = sy(wy);
  let g;
  try { g = ctx.createRadialGradient(px,py,0,px,py,Math.max(1,len*PPM)); } catch(e){ return; }
  if(!g || !g.addColorStop) return;
  g.addColorStop(0, "rgba(255,226,172,"+al+")");
  g.addColorStop(0.55, "rgba(255,214,150,"+(al*0.45).toFixed(3)+")");
  g.addColorStop(1, "rgba(255,206,140,0)");
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.beginPath(); ctx.moveTo(px,py);
  for(let i=0;i<=12;i++){
    const a = ang - spread/2 + spread*i/12;
    ctx.lineTo(px + Math.cos(a)*len*PPM, py + Math.sin(a)*len*PPM);
  }
  ctx.closePath();
  ctx.fillStyle = g; ctx.fill();
  ctx.restore();
}

// ---------- vehicles ----------
function wheel(a, b, len, wid, steerAng){
  ctx.save();
  ctx.translate(a,b);
  if(steerAng) ctx.rotate(-steerAng);      // +steer turns right, i.e. toward -left
  fillRR(-len/2, -wid/2, len/2, wid/2, col('t'), wid*0.42);
  ctx.fillStyle = lite(0.07);
  rr(-len/2, -wid/2, len, wid*0.4, wid*0.2); ctx.fill();
  ctx.restore();
}

function drawBus(){
  const bc = busCentre();
  const sl = sunLocal(bus.h, 1.0);
  const braking = input.down && bus.v > 0.3;
  const foldL = clearL < 0.45, foldR = clearR < 0.45;

  // Headlight wash on the road, before the body so the bus sits in it.
  const hl = busLocal(WB + FRONT_OH, 0);
  beam(hl.x, hl.y, bus.h, 13, 0.95, 0.085);

  inLocal(bc.x, bc.y, bus.h, ()=>{
    // Cast shadow. It carries the body roll so the bus reads as leaning into
    // a turn, while the hull stays exactly where the collision hull is.
    const roll = -bus.steer * Math.min(1, Math.abs(bus.v)/V_MAX) * 0.30;
    ctx.fillStyle = shade(0.34);
    rr(-6 + sl.a*0.9, -1.275 + sl.b*0.9 + roll, 12, 2.55, 0.55); ctx.fill();

    // Running gear.
    wheel( 3.5,  1.18, 1.30, 0.46, bus.steer);
    wheel( 3.5, -1.18, 1.30, 0.46, bus.steer);
    wheel(-2.5,  1.18, 1.36, 0.50, 0);
    wheel(-2.5, -1.18, 1.36, 0.50, 0);

    // Hull.
    fillKey(-6,-1.275, 6,1.275, 'u', 0.55);
    fillKey(-6,-1.275, 6,-0.94, 'U', 0.5);
    fillKey(-6, 0.94,  6,1.275, 'U', 0.5);
    ctx.fillStyle = shade(0.13);
    rr(-5.55,-0.74, 11.1, 1.48, 0.34); ctx.fill();
    fillKey(-3.4,-0.44,-2.2,0.44,'U',0.10);
    fillKey( 1.4,-0.44, 2.6,0.44,'U',0.10);
    fillKey(-5.85, 0.74, 5.85, 0.86, 'l', 0.05);
    fillKey(-5.85,-0.86, 5.85,-0.74, 'l', 0.05);

    // Glass.
    fillKey( 4.32,-1.06, 5.74, 1.06, 'g', 0.32);
    fillKey(-4.45,-1.20, 3.95,-0.88, 'g', 0.10);
    fillKey(-4.45, 0.88, 3.95, 1.20, 'g', 0.10);
    fillKey(-5.74,-0.96,-4.92, 0.96, 'G', 0.28);
    ctx.fillStyle = lite(0.14);
    rr(4.5, -0.98, 1.05, 0.30, 0.12); ctx.fill();
    rr(-4.2, 0.90, 2.6, 0.12, 0.05); ctx.fill();

    // Pillars, doors and panel seams. The two kerb-side doors slide back as
    // G.doorT eases up, which is the only animation the boarding loop needs.
    fillKey(0.58,-1.275, 0.78, 1.275, 'U', 0.04);
    fillKey(2.98,-1.275, 3.18, 1.275, 'U', 0.04);
    if(G.doorT > 0.01){
      const o = G.doorT;
      for(const d of [[1.86, 3.10],[-1.80,-0.56]]){
        const w0 = d[0], w1 = d[1], len = w1 - w0;
        // Light spilling out of the bus is what actually reads from above.
        ctx.fillStyle = "rgba(255,214,140," + (0.15*o).toFixed(3) + ")";
        poly2([[w0+0.10,1.28],[w1-0.10,1.28],[w1+0.55,2.55],[w0-0.55,2.55]]);
        ctx.fill();
        fillKey(w0, 0.86, w1, 1.32, 'a', 0.05);                       // the aperture
        fillKey(w0+0.06, 0.92, w1-0.06, 1.18, 'q', 0.04);             // lit step well
        // Both leaves slide back out of the way.
        const leaf = len*0.5*(1-o);
        fillKey(w0, 1.02, w0+leaf, 1.30, 'G', 0.05);
        fillKey(w1-leaf, 1.02, w1, 1.30, 'G', 0.05);
        ctx.fillStyle = lite(0.16);
        rr(w0, 1.30, len, 0.05, 0.02); ctx.fill();
      }
    }
    ctx.strokeStyle = shade(0.13); ctx.lineWidth = 0.05;
    for(const a of [-4.2,-1.6,1.9,4.2]){
      ctx.beginPath(); ctx.moveTo(a,-1.20); ctx.lineTo(a,1.20); ctx.stroke();
    }

    // Destination blind, lamps.
    fillKey(5.60,-0.84, 5.99, 0.84, 'h', 0.06);
    ctx.fillStyle = shade(0.45); ctx.lineWidth = 0.05;
    for(let i=-2;i<=2;i++){ ctx.beginPath(); ctx.moveTo(5.66,i*0.28); ctx.lineTo(5.93,i*0.28); ctx.stroke(); }
    fillKey(5.56,-1.22, 6.0,-0.86, 's', 0.12);
    fillKey(5.56, 0.86, 6.0, 1.22, 's', 0.12);
    fillKey(-6.0,-1.22,-5.58,-0.86, 'r', 0.12);
    fillKey(-6.0, 0.86,-5.58, 1.22, 'r', 0.12);
    if(braking){
      ctx.fillStyle = lite(0.42);
      rr(-6.0,-1.22,0.42,0.36,0.12); ctx.fill();
      rr(-6.0, 0.86,0.42,0.36,0.12); ctx.fill();
    }

    // Mirrors fold in when a flank gets tight -- a free, readable warning.
    for(const side of [1,-1]){
      const tip = side*((side>0?foldL:foldR) ? 1.52 : 1.94);
      ctx.strokeStyle = col('t'); ctx.lineWidth = 0.085;
      ctx.beginPath(); ctx.moveTo(5.16, side*1.22); ctx.lineTo(5.16, tip); ctx.stroke();
      fillKey(5.00, tip - side*0.32, 5.32, tip, 'm', 0.06);
    }

    // Paint you have already lost.
    for(const sc of bus.scrapes){
      const a = Math.max(-5.8, Math.min(5.8, sc.a - 2.5));
      fillKey(a-0.36, sc.side>0?1.02:-1.275, a+0.36, sc.side>0?1.275:-1.02, 'U', 0.05);
    }

    // Sun wash over the whole hull.
    const g = sunWash(bus.h, 4.2, 0.17, 0.20);
    if(g){ rr(-6,-1.275,12,2.55,0.55); ctx.fillStyle = g; ctx.fill(); }

    // Proximity rail: the flank that is running out of room lights up.
    for(const side of [1,-1]){
      const cl = side > 0 ? clearL : clearR;
      if(cl >= 0.75) continue;
      const t = 1 - cl/0.75;
      ctx.strokeStyle = cl < 0.28 ? col('r') : col('y');
      ctx.globalAlpha = 0.35 + 0.55*t;
      ctx.lineWidth = 0.09 + 0.10*t;
      ctx.beginPath();
      ctx.moveTo(-5.9, side*1.30); ctx.lineTo(5.9, side*1.30);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  });
}

// Shared four-wheeled body. opts: glassFwd, cabinFrom, brake, head, hazard.
function drawRig(x,y,ang,hl,hw,tint,sh,opts){
  opts = opts || {};
  const sl = sunLocal(ang, 1.0);
  if(opts.head){
    const c = Math.cos(ang), s = Math.sin(ang);
    beam(x + hl*c, y + hl*s, ang, 9, 0.9, 0.06);
  }
  inLocal(x, y, ang, ()=>{
    ctx.fillStyle = shade(0.30);
    rr(-hl + sl.a*0.75, -hw + sl.b*0.75, hl*2, hw*2, hw*0.42); ctx.fill();

    const wa = hl*0.62, ww = hw*0.98;
    wheel( wa,  ww, hl*0.30, hw*0.26, 0);
    wheel( wa, -ww, hl*0.30, hw*0.26, 0);
    wheel(-wa,  ww, hl*0.30, hw*0.26, 0);
    wheel(-wa, -ww, hl*0.30, hw*0.26, 0);

    fillKey(-hl,-hw, hl,hw, tint, hw*0.44);
    fillKey(-hl,-hw, hl,-hw*0.70, sh, hw*0.34);
    fillKey(-hl, hw*0.70, hl, hw, sh, hw*0.34);

    const c0 = opts.cabinFrom !== undefined ? opts.cabinFrom : -hl*0.36;
    const c1 = opts.cabinTo   !== undefined ? opts.cabinTo   :  hl*0.50;
    fillKey(c0,-hw*0.80, c1, hw*0.80, sh, hw*0.30);
    fillKey(c1-0.05,-hw*0.70, c1+hl*0.16, hw*0.70, 'g', hw*0.24);       // windscreen
    if(!opts.blind) fillKey(c0-hl*0.14,-hw*0.66, c0+0.05, hw*0.66, 'G', hw*0.22);

    if(opts.head){
      fillKey(hl-hl*0.06,-hw*0.94, hl, -hw*0.52, 's', hw*0.14);
      fillKey(hl-hl*0.06, hw*0.52, hl,  hw*0.94, 's', hw*0.14);
    }
    fillKey(-hl,-hw*0.94, -hl+hl*0.06, -hw*0.52, 'r', hw*0.14);
    fillKey(-hl, hw*0.52, -hl+hl*0.06,  hw*0.94, 'r', hw*0.14);

    if(opts.hazard){
      for(const ax of [[hl-hl*0.13, hl],[-hl, -hl+hl*0.13]])
        for(const by of [[-hw,-hw*0.55],[hw*0.55,hw]])
          fillKey(ax[0],by[0],ax[1],by[1],'h', hw*0.12);
    }
    if(opts.blink){
      for(const ax of [[hl-hl*0.28, hl-hl*0.04],[-hl+hl*0.04, -hl+hl*0.28]])
        for(const by of [[-hw*0.98,-hw*0.52],[hw*0.52,hw*0.98]])
          fillKey(ax[0],by[0],ax[1],by[1],'h', hw*0.12);
    }

    const g = sunWash(ang, hl*0.8, 0.15, 0.18);
    if(g){ rr(-hl,-hw,hl*2,hw*2,hw*0.44); ctx.fillStyle = g; ctx.fill(); }
  });
}

function drawBin(b){
  const sl = sunLocal(b.ang, 1.0);
  inLocal(b.x, b.y, b.ang, ()=>{
    ctx.fillStyle = shade(0.28);
    ctx.beginPath(); ctx.arc(sl.a*0.6, sl.b*0.6, b.r, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(0,0,b.r,0,6.2832); ctx.fillStyle = col('n'); ctx.fill();
    ctx.beginPath(); ctx.arc(0,0,b.r*0.72,0,6.2832); ctx.fillStyle = col('N'); ctx.fill();
    ctx.strokeStyle = shade(0.30); ctx.lineWidth = 0.05;
    ctx.beginPath(); ctx.moveTo(-b.r*0.7,0); ctx.lineTo(b.r*0.7,0); ctx.stroke();
  });
}

// ---------- render-only effects ----------
// Driven by the real frame delta, never by update(), so none of this can
// perturb the simulation.
const puffs = [], dust = [], skids = [];
let emitT = 0, lastRear = null, zoomEase = 1;

function fxUpdate(rdt){
  // Exhaust while pulling away.
  emitT -= rdt;
  if(input.up && Math.abs(bus.v) < 9 && emitT <= 0){
    emitT = 0.07;
    const p = busLocal(-REAR_OH - 0.2, -0.95);
    puffs.push({ x:p.x, y:p.y, r:0.20, a:1,
                 vx:-Math.cos(bus.h)*0.7 + (Math.random()-0.5)*0.5,
                 vy:-Math.sin(bus.h)*0.7 + (Math.random()-0.5)*0.5 });
  }
  for(let i=puffs.length-1;i>=0;i--){
    const p = puffs[i];
    p.x += p.vx*rdt; p.y += p.vy*rdt; p.r += 0.85*rdt; p.a -= 0.62*rdt;
    if(p.a <= 0) puffs.splice(i,1);
  }

  // Kerb dust: mounting the pavement should look as rough as it sounds.
  if(Math.abs(bus.v) > 1.4){
    for(const a of [-REAR_OH, WB+FRONT_OH]) for(const b of [-BUS_HW, BUS_HW]){
      const p = busLocal(a,b), pr = project(p.x,p.y);
      if(Math.abs(pr.q) > pr.hw - PAVE && Math.random() < 0.30)
        dust.push({ x:p.x, y:p.y, r:0.10, a:1,
                    vx:(Math.random()-0.5)*1.6, vy:(Math.random()-0.5)*1.6 });
    }
  }
  for(let i=dust.length-1;i>=0;i--){
    const p = dust[i];
    p.x += p.vx*rdt; p.y += p.vy*rdt; p.r += 0.55*rdt; p.a -= 1.5*rdt;
    if(p.a <= 0) dust.splice(i,1);
  }

  // Rubber under braking.
  if(input.down && bus.v > 3.5){
    const L = busLocal(0, 1.18), R = busLocal(0, -1.18);
    if(lastRear){
      skids.push({x0:lastRear.L.x, y0:lastRear.L.y, x1:L.x, y1:L.y});
      skids.push({x0:lastRear.R.x, y0:lastRear.R.y, x1:R.x, y1:R.y});
      while(skids.length > 600) skids.shift();
    }
    lastRear = {L,R};
  } else lastRear = null;

  const target = 1 - 0.055*Math.min(1, Math.abs(bus.v)/V_MAX);
  zoomEase += (target - zoomEase) * Math.min(1, rdt*3.5);
}

function drawSoftDots(list, r, g, b){
  for(const p of list){
    const a = Math.max(0, Math.min(1, p.a));
    ctx.beginPath();
    ctx.arc(sx(p.x), sy(p.y), Math.max(0.5, p.r*PPM), 0, 6.2832);
    ctx.fillStyle = "rgba("+r+","+g+","+b+","+(a*0.34).toFixed(3)+")";
    ctx.fill();
  }
}
function drawSparks(){
  if(!sparks.length) return;
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.fillStyle = col('s');
  for(const p of sparks){
    const a = Math.max(0, Math.min(1, p.life/0.40));
    ctx.globalAlpha = a;
    ctx.beginPath();
    ctx.arc(sx(p.x), sy(p.y), (0.09 + (1-a)*0.11)*PPM, 0, 6.2832);
    ctx.fill();
  }
  ctx.restore();
}

// ---------- swept-path ghost ----------
// Same projection as the prototype, drawn as a ribbon between the two rear
// corners instead of dotted lines. Tail swing is only fair if it is knowable.
function drawGhostHD(){
  let rx = bus.rx, ry = bus.ry, h = bus.h;
  const dir = bus.v < -0.2 ? -1 : 1;
  const v = Math.max(Math.abs(bus.v), 2.6) * dir;
  const N = 20, dt = 0.9/N, tan = Math.tan(bus.steer);
  const L = [], R = [];
  for(let i=0;i<N;i++){
    rx += v*dt*Math.cos(h); ry += v*dt*Math.sin(h); h += v*dt*tan/WB;
    const c = Math.cos(h), s = Math.sin(h), a = -REAR_OH;
    L.push({ x:rx + a*c + BUS_HW*s, y:ry + a*s - BUS_HW*c });
    R.push({ x:rx + a*c - BUS_HW*s, y:ry + a*s + BUS_HW*c });
  }
  ctx.save();
  poly(L.concat(R.slice().reverse()));
  ctx.fillStyle = col('e'); ctx.globalAlpha = 0.13; ctx.fill();
  ctx.globalAlpha = 0.55; ctx.strokeStyle = col('e');
  ctx.lineWidth = Math.max(1, 0.06*PPM);
  for(const side of [L,R]){
    ctx.beginPath();
    for(let i=0;i<side.length;i++){
      const px = sx(side[i].x), py = sy(side[i].y);
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.stroke();
  }
  // Where the whole bus ends up in 0.9 s.
  const c = Math.cos(h), s = Math.sin(h), cor = [];
  for(const a of [-REAR_OH, WB+FRONT_OH]) for(const b of [BUS_HW,-BUS_HW])
    cor.push({ x:rx + a*c + b*s, y:ry + a*s - b*c });
  poly([cor[0],cor[1],cor[3],cor[2]]);
  ctx.globalAlpha = 0.7; ctx.lineWidth = Math.max(1, 0.07*PPM); ctx.stroke();
  ctx.restore();
}

// ---------- HUD ----------
// ---------- the skip: the recurring nemesis (S5) ----------
// Not a vehicle -- an open steel box someone left in the road. Drawn without
// wheels so it reads instantly as "this is not going to move for you".
// A roadworks barrier: a striped plank on two feet. Drawn from keys that
// already exist ('h' hazard, 'l' road paint, 'k'/'K' kerb), so it adds nothing
// to KEY_TONE / GBC and the mirror check stays exact.
function drawBarrier(o){
  const sl = sunLocal(o.ang, 0.5);
  inLocal(o.x, o.y, o.ang, ()=>{
    ctx.fillStyle = shade(0.30);
    rr(-o.hl + sl.a*0.5, -o.hw + sl.b*0.5, o.hl*2, o.hw*2, 0.06); ctx.fill();
    fillKey(-o.hl, -o.hw*0.35, o.hl, o.hw*0.35, 'k', 0.03);          // the feet
    fillKey(-o.hl, -o.hw, o.hl, o.hw, 'l', 0.05);                    // the plank
    for(let i=0;i<5;i++){
      const x0 = -o.hl + (i*2+0.35)*o.hl/5;
      fillKey(x0, -o.hw, x0 + o.hl/5, o.hw, 'h', 0.04);              // hazard stripes
    }
    ctx.strokeStyle = col('K'); ctx.lineWidth = 0.05;
    rr(-o.hl, -o.hw, o.hl*2, o.hw*2, 0.06); ctx.stroke();
  });
}
function drawSkip(o){
  const sl = sunLocal(o.ang, 1.0);
  inLocal(o.x, o.y, o.ang, ()=>{
    ctx.fillStyle = shade(0.34);
    rr(-o.hl + sl.a*0.7, -o.hw + sl.b*0.7, o.hl*2, o.hw*2, 0.10); ctx.fill();
    // Tapered body: the top rim is longer than the base.
    poly([{x:-o.hl*0.78,y:-o.hw*0.86},{x:o.hl*0.78,y:-o.hw*0.86},
          {x:o.hl*0.78,y:o.hw*0.86},{x:-o.hl*0.78,y:o.hw*0.86}].map(p=>({
            x:o.x + p.x*Math.cos(o.ang) + p.y*Math.sin(o.ang),
            y:o.y + p.x*Math.sin(o.ang) - p.y*Math.cos(o.ang) })));
    ctx.fillStyle = col('Y'); ctx.fill();
    fillKey(-o.hl, -o.hw, o.hl, o.hw, 'E', 0.10);
    ctx.fillStyle = shade(0.42);
    rr(-o.hl*0.80, -o.hw*0.80, o.hl*1.60, o.hw*1.60, 0.06); ctx.fill();   // the hole
    // Rubble, seeded off the position so it never crawls.
    for(let i=0;i<7;i++){
      const a = hash2((o.x*7)|0, i*13), b = hash2((o.y*7)|0, i*29);
      const rx = (a-0.5)*o.hl*1.4, ry = (b-0.5)*o.hw*1.4;
      fillKey(rx-0.16, ry-0.12, rx+0.16, ry+0.12, i%3 ? 'i' : 'q', 0.04);
    }
    ctx.strokeStyle = col('E'); ctx.lineWidth = 0.10;
    rr(-o.hl, -o.hw, o.hl*2, o.hw*2, 0.10); ctx.stroke();
    const g = sunWash(o.ang, o.hl*1.4, 0.13, 0.16);
    if(g){ rr(-o.hl,-o.hw,o.hl*2,o.hw*2,0.10); ctx.fillStyle = g; ctx.fill(); }
    // Hazard stripes on the road-facing end.
    for(let i=-1;i<=1;i++) fillKey(o.hl-0.24, i*0.34-0.10, o.hl-0.06, i*0.34+0.10, 'h', 0.02);
  });
}

// ---------- bus stops ----------
// The stop is three things drawn together: a box painted on the road (where
// the bus goes), a pole on the pavement (what you aim at) and the people
// (what you are actually here for).
function drawStops(){
  if(!G.stops || !G.stops.length) return;
  const vb = viewBounds(26);
  for(const st of G.stops){
    const sp = stopPost(st);
    if(sp.x < vb.x0 || sp.x > vb.x1 || sp.y < vb.y0 || sp.y > vb.y1) continue;
    const live = !st.served;
    const isNext = live && nextStop() === st;

    // Road box: the bay you are meant to end up in.
    const qIn  = st.side*((sp.hw - PAVE) - 0.06);
    const qOut = st.side*((sp.hw - PAVE) - BUS_W - 0.55);
    ctx.beginPath();
    for(let k=0;k<=12;k++){
      const w = toWorld(st.s - DOCK_S - 3.0 + (k/12)*(DOCK_S*2 + 6.0), qIn);
      if(k===0) ctx.moveTo(sx(w.x),sy(w.y)); else ctx.lineTo(sx(w.x),sy(w.y));
    }
    for(let k=12;k>=0;k--){
      const w = toWorld(st.s - DOCK_S - 3.0 + (k/12)*(DOCK_S*2 + 6.0), qOut);
      ctx.lineTo(sx(w.x),sy(w.y));
    }
    ctx.closePath();
    ctx.fillStyle = live ? "rgba(255,181,36,0.10)" : "rgba(255,255,255,0.05)";
    ctx.fill();
    ctx.strokeStyle = col(live ? 'h' : 'X');
    ctx.globalAlpha = live ? 0.75 : 0.30;
    ctx.lineWidth = Math.max(1, 0.11*PPM);
    ctx.setLineDash([0.7*PPM, 0.5*PPM]);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;

    // "BUS STOP" cage marking down the middle of the bay.
    const cq = st.side*((sp.hw - PAVE) - BUS_W*0.5 - 0.3);
    ctx.strokeStyle = col('l'); ctx.globalAlpha = live ? 0.5 : 0.25;
    ctx.lineWidth = Math.max(1, 0.08*PPM);
    for(let k=0;k<7;k++){
      const a = toWorld(st.s - 3.2 + k*1.1, cq + st.side*0.55);
      const b = toWorld(st.s - 3.2 + k*1.1 - 0.55, cq - st.side*0.55);
      ctx.beginPath(); ctx.moveTo(sx(a.x),sy(a.y)); ctx.lineTo(sx(b.x),sy(b.y)); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // Where the front door has to be, while this is the stop you want.
    if(isNext){
      const dw = toWorld(st.s, stopDoorQ(st));
      const t = 0.5 + 0.5*Math.sin(G.tick*0.09);
      ctx.beginPath(); ctx.arc(sx(dw.x), sy(dw.y), (0.55 + 0.22*t)*PPM, 0, 6.2832);
      // Amber when somebody is parked on it: the ring still shows where the
      // door belongs, and why you are not getting it.
      ctx.strokeStyle = col(st.blocked ? 'h' : 'e'); ctx.globalAlpha = 0.55 + 0.35*t;
      ctx.lineWidth = Math.max(1, 0.10*PPM); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // The pole, its shadow and the flag.
    const pl = 0.34;
    ctx.fillStyle = shade(0.30);
    ctx.beginPath(); ctx.arc(sx(sp.x + SUN_DX*0.5), sy(sp.y + SUN_DY*0.5), pl*0.8*PPM, 0, 6.2832); ctx.fill();
    inLocal(sp.x, sp.y, sp.ang, ()=>{
      ctx.beginPath(); ctx.arc(0,0,0.17,0,6.2832); ctx.fillStyle = col('W'); ctx.fill();
      fillKey(-0.62, -st.side*0.16, 0.62, -st.side*0.86, live ? 'h' : 'X', 0.10);
      fillKey(-0.50, -st.side*0.26, 0.50, -st.side*0.76, 'a', 0.06);
      for(let i=-1;i<=1;i++)
        fillKey(i*0.30-0.10, -st.side*0.40, i*0.30+0.10, -st.side*0.62, live ? 'h' : 'X', 0.03);
    });

    // Floating count, colour-coded by payout (S4.2: price the fare first).
    if(live && st.on > 0){
      const k = st.on >= 5 ? 'e' : st.on >= 3 ? 'h' : 'r';
      const px = sx(sp.x), py = sy(sp.y) - (1.9 + 0.18*Math.sin(G.tick*0.07))*PPM;
      const rad = 0.62*PPM;
      ctx.beginPath(); ctx.arc(px, py, rad, 0, 6.2832);
      ctx.fillStyle = "rgba(10,12,16,0.72)"; ctx.fill();
      ctx.strokeStyle = col(k); ctx.lineWidth = Math.max(1.5, 0.10*PPM); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(px - rad*0.34, py + rad*0.86);
      ctx.lineTo(px + rad*0.34, py + rad*0.86); ctx.lineTo(px, py + rad*1.5);
      ctx.closePath(); ctx.fillStyle = "rgba(10,12,16,0.72)"; ctx.fill();
      label(""+st.on, px, py, k, rad*1.18, "center", 800);
    }
    if(live && st.terminus){
      const px = sx(sp.x), py = sy(sp.y) - 1.9*PPM;
      label("⚑", px, py, 'w', 0.9*PPM, "center", 800);
    }
  }

  // The people. Aesthetics only, but they are why the stop reads as a stop.
  for(const a of G.alight){
    if(a.x < vb.x0 || a.x > vb.x1 || a.y < vb.y0 || a.y > vb.y1) continue;
    ctx.save();
    ctx.globalAlpha = Math.min(1, a.life*1.2);
    inLocal(a.x, a.y, a.ang, ()=>{
      ctx.fillStyle = shade(0.30);
      ctx.beginPath(); ctx.ellipse(SUN_DX*0.30, SUN_DY*0.30, 0.30, 0.22, 0, 0, 6.2832); ctx.fill();
      fillKey(-0.20, -0.17, 0.20, 0.17, a.coat > 0.5 ? 'z' : 'q', 0.17);
      ctx.beginPath(); ctx.arc(0.02, 0, 0.13, 0, 6.2832); ctx.fillStyle = col('S'); ctx.fill();
    });
    ctx.restore();
  }
  for(let i=0;i<G.waiters.length;i++){
    const st = G.stops[i];
    for(const w of G.waiters[i]){
      if(w.gone) continue;
      if(w.x < vb.x0 || w.x > vb.x1 || w.y < vb.y0 || w.y > vb.y1) continue;
      const bob = Math.sin(G.tick*0.05 + w.ph)*0.05;
      const wave = st && !st.served && nextStop() === st;
      inLocal(w.x, w.y + bob, w.ang, ()=>{
        ctx.fillStyle = shade(0.30);
        ctx.beginPath(); ctx.ellipse(SUN_DX*0.30, SUN_DY*0.30, 0.30, 0.22, 0, 0, 6.2832); ctx.fill();
        fillKey(-0.20, -0.17, 0.20, 0.17, w.coat > 0.5 ? 'z' : 'q', 0.17);
        ctx.beginPath(); ctx.arc(0.02, 0, 0.13, 0, 6.2832); ctx.fillStyle = col('S'); ctx.fill();
        if(wave){
          const a = Math.sin(G.tick*0.22 + w.ph)*0.5;
          ctx.strokeStyle = col('S'); ctx.lineWidth = 0.07;
          ctx.beginPath(); ctx.moveTo(0.06, 0.16);
          ctx.lineTo(0.06 + Math.cos(a)*0.24, 0.16 + Math.sin(a)*0.24); ctx.stroke();
        }
      });
    }
  }
}

// ---------- route guide ----------
// Sega's navigation trick (US6200138B1), in the one form a single street
// allows: follow the ROAD to the stop while it is far away, and only point
// straight at it once you are close enough for that not to be confusing.
function drawRoute(){
  const st = nextStop();
  if(!st || G.state !== "play") return;
  const bp = busS();
  const ahead = st.s - bp.s;
  const k = Math.abs(ahead) < 26 ? 'w' : (ahead > 0 ? 'e' : 'h');
  const a = Math.min(bp.s, st.s), b = Math.max(bp.s, st.s);
  ctx.save();
  ctx.strokeStyle = col(k);
  ctx.lineWidth = Math.max(1.5, 0.16*PPM);
  ctx.globalAlpha = 0.34;
  ctx.setLineDash([1.1*PPM, 1.0*PPM]);
  ctx.lineDashOffset = -(G.tick*0.06*PPM) % (2.1*PPM);
  ctx.beginPath();
  const q0 = stopDoorQ(st);
  for(let s2=a; s2<=b+0.001; s2+=Math.max(1.2,(b-a)/40)){
    const u = (b-a) < 0.01 ? 1 : (s2-a)/(b-a);
    const w = toWorld(s2, q0*(0.35 + 0.65*u));
    if(s2 === a) ctx.moveTo(sx(w.x),sy(w.y)); else ctx.lineTo(sx(w.x),sy(w.y));
  }
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

// Off-screen stop pointer, in screen space so distance never shrinks it away.
function drawStopPointer(){
  const st = nextStop();
  if(!st || G.state !== "play") return;
  const sp = stopPost(st);
  const lx = sx(sp.x), ly = sy(sp.y);
  const dx = devX(lx,ly), dy = devY(lx,ly);
  const m = Math.min(VW,VH)*0.07;
  if(dx > m && dx < VW-m && dy > m && dy < VH-m) return;
  const cx = VW/2, cy = VH/2;
  let vx = dx-cx, vy = dy-cy;
  const L = Math.hypot(vx,vy) || 1; vx /= L; vy /= L;
  const rx = Math.min(VW/2 - m, VH/2 - m);
  const px = cx + vx*rx, py = cy + vy*rx;
  const U = Math.max(11, Math.min(VW,VH)*0.024);
  ctx.save();
  ctx.translate(px,py); ctx.rotate(Math.atan2(vy,vx));
  ctx.beginPath();
  ctx.moveTo(U*1.1,0); ctx.lineTo(-U*0.6,-U*0.72); ctx.lineTo(-U*0.2,0); ctx.lineTo(-U*0.6,U*0.72);
  ctx.closePath();
  ctx.fillStyle = col('e'); ctx.globalAlpha = 0.9; ctx.fill();
  ctx.restore();
  const bp = busS();
  label(Math.abs(Math.round(st.s - bp.s)) + " M", px, py + U*1.6, 'x', U*0.7, "center", 800);
}

// ---------- floating score pops ----------
function drawPops(){
  for(const p of G.pop){
    const t = 1 - p.t/1.5;
    const lx = sx(p.x), ly = sy(p.y) - t*2.2*PPM;
    ctx.save();
    ctx.globalAlpha = Math.min(1, p.t*1.6);
    const U = Math.max(11, Math.min(VW,VH)*0.024);
    label(p.s, devX(lx,ly), devY(lx,ly), p.key, U*1.15, "center", 800);
    ctx.restore();
  }
}

const topbarEl = document.getElementById("topbar");
function hudFont(px, weight){
  ctx.font = (weight||700) + " " + Math.round(px) + "px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";
}
function label(str, x, y, key, px, align, weight){
  hudFont(px, weight);
  ctx.textAlign = align || "left";
  ctx.textBaseline = "middle";
  ctx.fillStyle = col(key);
  ctx.fillText(str, x, y);
}
function panel(x,y,w,h,r){
  rr(x,y,w,h,r === undefined ? 10 : r);
  ctx.fillStyle = "rgba(10,12,16,0.60)"; ctx.fill();
  ctx.strokeStyle = "rgba(160,175,195,0.20)"; ctx.lineWidth = 1; ctx.stroke();
}
function hudTop(){
  let t = 56;
  if(topbarEl && topbarEl.getBoundingClientRect){
    const r = topbarEl.getBoundingClientRect();
    if(r && r.height) t = r.height + 8;
  }
  return t;
}

function drawHUDHD(){
  const U  = Math.max(11, Math.min(VW,VH) * 0.024);
  const bp = busS();

  // Progress hairline along the very top edge.
  const frac = Math.max(0, Math.min(1, bp.s/TOTAL_S));
  ctx.fillStyle = "rgba(255,255,255,0.10)"; ctx.fillRect(0,0,VW,3);
  ctx.fillStyle = col('h'); ctx.fillRect(0,0,VW*frac,3);

  // One strip under the chrome: speed, distance, clearance.
  const py = hudTop(), ph = U*2.9, pw = Math.min(VW - 24, Math.max(330, U*30));
  const px = (VW - pw)/2;
  panel(px, py, pw, ph, 12);

  const kmh = Math.abs(bus.v)*3.6;
  const mid = py + ph/2;
  const spd = "" + (kmh|0);
  hudFont(U*1.55, 800);
  const spdW = ctx.measureText(spd).width;
  label(spd, px + U*0.9, mid, 'x', U*1.55, "left", 800);
  label("KM/H", px + U*0.9 + spdW + U*0.45, mid + U*0.30, 'X', U*0.60, "left", 700);
  if(bus.v < -0.2) label("REV", px + U*0.9 + spdW + U*0.45, mid - U*0.55, 'y', U*0.60, "left", 800);

  // The schedule, in the middle where you cannot miss it.
  const low = G.clock < 15 && G.state === "play";
  const ck = low ? ((G.tick>>4)&1 ? 'r' : 'y') : 'x';
  label(fmtClock(G.clock), px + pw/2, mid - U*0.18, ck, U*1.5, "center", 800);
  label("SCHEDULE", px + pw/2, mid + U*0.95, 'X', U*0.52, "center", 700);

  // Clearance: left flank on the left of the pair, right on the right.
  const bw = U*4.4, bh = U*0.62, bx = px + pw - U*0.9 - bw*2 - U*0.6;
  let i = 0;
  for(const cfg of [{v:clearL, tag:"L"}, {v:clearR, tag:"R"}]){
    const gx = bx + i*(bw + U*0.6);
    const f  = Math.max(0, Math.min(1, cfg.v/CLEAR_CAP));
    const k  = cfg.v < 0.28 ? 'r' : (cfg.v < 0.75 ? 'y' : 'x');
    label(cfg.tag, gx, mid - U*0.72, 'X', U*0.60, "left", 700);
    fillRR(gx, mid - U*0.1, gx + bw, mid - U*0.1 + bh, "rgba(255,255,255,0.14)", bh/2);
    fillRR(gx, mid - U*0.1, gx + Math.max(bh, bw*f), mid - U*0.1 + bh, col(k), bh/2);
    label(Math.round(Math.min(cfg.v, CLEAR_CAP)*100) + (cfg.v >= CLEAR_CAP ? "+" : "") + "CM",
          gx + bw, mid + U*0.95, 'X', U*0.55, "right", 700);
    i++;
  }

  // What the oncoming car has decided, spelled out.
  let intent = null, ikey = 'h';
  if(car.mode === "wait")          { intent = "CAR WAITING  —  PRESS HORN"; ikey = 'h'; }
  else if(car.mode === "backing")  { intent = "CAR BACKING UP FOR YOU";          ikey = 'e'; }
  else if(car.mode === "yield")    { intent = "CAR YIELDING";                    ikey = 'e'; }
  else if(car.mode === "telegraph"){ intent = "CAR THINKING…";              ikey = 'y'; }
  if(intent){
    hudFont(U*0.80, 800);
    const tw = ctx.measureText(intent).width, bx2 = (VW - tw)/2 - U*0.9;
    panel(bx2, py + ph + U*0.7, tw + U*1.8, U*2.0, 10);
    label(intent, VW/2, py + ph + U*0.7 + U, ikey, U*0.80, "center", 800);
  }

  // Squeeze: live gap while inside it, then a result card on the way out.
  if(squeezing){
    const g = Math.min(clearL, clearR);
    hudFont(U*1.05, 800);
    const s2 = "GAP " + Math.round(g*100) + " CM";
    const tw = ctx.measureText(s2).width;
    panel((VW-tw)/2 - U*0.9, VH*0.30 - U*1.1, tw + U*1.8, U*2.2, 11);
    label(s2, VW/2, VH*0.30, g < 0.28 ? 'r' : 'y', U*1.05, "center", 800);
  }
  if(squeezeFlash > 0){
    const t = Math.max(0, Math.min(1, squeezeFlash/1.1));
    ctx.save();
    ctx.globalAlpha = Math.min(1, t*2.2);
    const sc = 1 + (1-t)*0.10;
    hudFont(U*1.9*sc, 800);
    const s3 = "SQUEEZE  " + Math.round(squeezeFlashVal*100) + " CM";
    const tw = ctx.measureText(s3).width;
    panel((VW-tw)/2 - U*1.2, VH*0.62 - U*1.7, tw + U*2.4, U*3.2, 14);
    label(s3, VW/2, VH*0.62, 'y', U*1.9*sc, "center", 800);
    ctx.restore();
  }
}

// ---------- game HUD ----------
function fmtClock(t){
  t = Math.max(0, t);
  const m = Math.floor(t/60), s2 = Math.floor(t - m*60);
  return m + ":" + (s2 < 10 ? "0" : "") + s2;
}
function fmtNum(n){
  n = Math.round(n);
  const s2 = "" + Math.abs(n), out = [];
  for(let i=0;i<s2.length;i++){
    if(i > 0 && (s2.length - i) % 3 === 0) out.push(",");
    out.push(s2[i]);
  }
  return (n < 0 ? "-" : "") + out.join("");
}
function wrapText(str, maxW, px){
  hudFont(px, 600);
  const words = str.split(" "), lines = [];
  let line = "";
  for(const w of words){
    const t = line ? line + " " + w : w;
    if(ctx.measureText(t).width > maxW && line){ lines.push(line); line = w; }
    else line = t;
  }
  if(line) lines.push(line);
  return lines;
}
// Rounded pill helper for the two HUD strips.
function strip(x,y,w,h){ panel(x,y,w,h,h/2); }

function drawGameHUD(){
  const U  = Math.max(11, Math.min(VW,VH) * 0.024);
  const bp = busS();
  const y2 = hudTop() + U*2.9 + U*0.55;
  const h2 = U*1.9;

  // Strip two: the shift. Score, multiplier, load, distance.
  const parts = [];
  parts.push({ t:fmtNum(G.score), k:'x', big:true });
  parts.push({ t:"×" + G.mult, k:G.mult > 1 ? 'e' : 'X', pips:true });
  parts.push({ t:G.riders + "/" + CAP, k:G.riders > 0 ? 'h' : 'X', tag:"ABOARD" });
  parts.push({ t:(bp.s|0) + "/" + (TOTAL_S|0) + "M", k:'X' });

  hudFont(U*0.86, 800);
  let pw2 = U*1.4;
  for(const p of parts) pw2 += ctx.measureText(p.t).width + (p.pips ? U*2.6 : U*0.3) + U*1.1;
  pw2 = Math.min(VW - 16, pw2);
  const px2 = (VW - pw2)/2;
  strip(px2, y2, pw2, h2);

  let cx = px2 + U*0.7;
  for(const p of parts){
    hudFont(U*0.86, 800);
    const w = ctx.measureText(p.t).width;
    label(p.t, cx, y2 + h2/2, p.k, U*0.86, "left", 800);
    cx += w + U*0.35;
    if(p.pips){
      for(let i=0;i<5;i++){
        const on = i < G.mult;
        fillRR(cx, y2 + h2/2 - U*0.30, cx + U*0.34, y2 + h2/2 + U*0.30,
               on ? col('e') : "rgba(255,255,255,0.16)", U*0.10);
        cx += U*0.46;
      }
      cx += U*0.2;
    }
    if(p.tag){ label(p.tag, cx, y2 + h2/2, 'X', U*0.55, "left", 700); cx += ctx.measureText(p.tag).width*0.62 + U*0.4; }
    cx += U*0.5;
  }

  // Comfort, as a thin bar under the strip -- a combo gauge, never a health bar.
  if(G.riders > 0){
    const cbw = pw2*0.55, cbx = (VW - cbw)/2, cby = y2 + h2 + U*0.30;
    fillRR(cbx, cby, cbx + cbw, cby + U*0.24, "rgba(255,255,255,0.13)", U*0.12);
    const ck = G.holdT > 0 ? 'w' : (G.comfort < 0.5 ? 'r' : G.comfort < 0.78 ? 'y' : 'e');
    fillRR(cbx, cby, cbx + cbw*G.comfort, cby + U*0.24, col(ck), U*0.12);
    if(G.holdT > 0)
      label("BRACED", cbx + cbw + U*0.5, cby + U*0.12, 'w', U*0.55, "left", 800);
    else if(G.holdCool <= 0)
      label("HOLD ON  [H]", cbx + cbw + U*0.5, cby + U*0.12, 'X', U*0.55, "left", 700);
  }

  // Bottom card: the next stop, or the boarding progress while docked.
  const st = nextStop();
  if(st){
    // The horn owns the bottom-right corner on touch, so the card is centred in
    // what is left rather than in the screen. The variant strip that used to sit
    // under it has moved into the settings sheet, so it can drop closer to the edge.
    const keep = touchOn ? Math.min(VW*0.34, 150) : 0;
    const cw = Math.min(VW - 24 - keep, Math.max(300, U*26)), cxx = (VW - keep - cw)/2;
    const ch = U*3.2, cyy = VH - ch - (touchOn ? Math.max(U*2.2, 30) : Math.max(U*3.4, 88));
    panel(cxx, cyy, cw, ch, 12);
    if(G.board > 0){
      const f = 1 - G.board/Math.max(0.01, G.boardLen);
      label("DOORS OPEN  ·  " + st.name, cxx + U*0.9, cyy + U*0.95, 'h', U*0.78, "left", 800);
      fillRR(cxx + U*0.9, cyy + ch - U*1.15, cxx + cw - U*0.9, cyy + ch - U*0.72,
             "rgba(255,255,255,0.14)", U*0.22);
      fillRR(cxx + U*0.9, cyy + ch - U*1.15,
             cxx + U*0.9 + (cw - U*1.8)*f, cyy + ch - U*0.72, col('e'), U*0.22);
      label(grade(G.boardQ), cxx + cw - U*0.9, cyy + U*0.95, 'e', U*0.72, "right", 800);
    } else {
      const d = Math.round(st.s - bp.s);
      label("NEXT", cxx + U*0.9, cyy + U*0.86, 'X', U*0.58, "left", 700);
      label(st.name, cxx + U*0.9 + U*2.6, cyy + U*0.90, 'x', U*0.92, "left", 800);
      label((d >= 0 ? d : 0) + " M", cxx + cw - U*0.9, cyy + U*0.90, d < 20 ? 'e' : 'x',
            U*0.92, "right", 800);
      const sub = st.terminus ? "TERMINUS  ·  ALL CHANGE"
                : (st.blocked ? st.on + " WAITING  ·  CAR IN THE STOP"
                              : st.on + " WAITING  ·  " + st.off + " OFF");
      label(sub, cxx + U*0.9, cyy + ch - U*0.95, st.blocked ? 'h' : 'X', U*0.62, "left", 700);
      if(st.missed) label("REVERSE", cxx + cw - U*0.9, cyy + ch - U*0.95, 'h', U*0.62, "right", 800);
      else if(G.next + 1 < G.stops.length)
        label("THEN " + G.stops[G.next+1].name, cxx + cw - U*0.9, cyy + ch - U*0.95,
              'X', U*0.62, "right", 700);
    }
  }

  // Transient line, centred, above the bottom card.
  if(G.msgT > 0){
    hudFont(U*0.95, 800);
    const tw = ctx.measureText(G.msg).width;
    ctx.save();
    ctx.globalAlpha = Math.min(1, G.msgT*2.2);
    panel((VW-tw)/2 - U*0.9, VH*0.72 - U*1.05, tw + U*1.8, U*2.1, 11);
    label(G.msg, VW/2, VH*0.72, G.msgKey, U*0.95, "center", 800);
    ctx.restore();
  }
}

// ---------- front-end cards ----------
// One tappable surface for every non-play screen, so the whole front end is
// a single verb: tap. Hit rectangles are recorded as they are drawn.
function cardHit(x,y,w,h,act){ G.hits.push({x,y,w,h,act}); }
function drawCards(){
  G.hits = [];
  if(G.state === "play") return;
  const U = Math.max(12, Math.min(VW,VH)*0.026);
  ctx.fillStyle = "rgba(6,8,12,0.72)"; ctx.fillRect(0,0,VW,VH);

  const cw = Math.min(VW - U*2, U*30);
  const cx = (VW - cw)/2;
  const pad = U*1.4;

  if(G.state === "title"){
    const ch = U*20;
    const cy = Math.max(U*1.5, (VH - ch)/2);
    panel(cx, cy, cw, ch, 16);
    label("ONE STREET", cx + cw/2, cy + U*3.0, 'x', U*2.6, "center", 800);
    label("HD", cx + cw/2, cy + U*5.2, 'h', U*1.3, "center", 800);
    label("A 12 METRE BUS. A STREET THAT DOES NOT WANT IT.",
          cx + cw/2, cy + U*7.0, 'X', U*0.66, "center", 700);

    for(let k=0;k<ROUTES.length;k++){
      const i = ROUTES[k], L = LEVELS[i];
      const ry = cy + U*8.6 + i*U*3.3, rh = U*2.9;
      const on = G.pick === i;
      fillRR(cx + pad, ry, cx + cw - pad, ry + rh,
             on ? "rgba(255,181,36,0.16)" : "rgba(255,255,255,0.05)", 12);
      if(on){
        rr(cx + pad, ry, cw - pad*2, rh, 12);
        ctx.strokeStyle = col('h'); ctx.lineWidth = 1.5; ctx.stroke();
      }
      label((i+1) + "", cx + pad + U*0.8, ry + rh/2, on ? 'h' : 'X', U*1.05, "left", 800);
      label(L.name, cx + pad + U*2.2, ry + rh*0.36, 'x', U*1.0, "left", 800);
      label(L.route + "  ·  " + L.sub + "  ·  " + L.stops.length + " STOPS",
            cx + pad + U*2.2, ry + rh*0.72, 'X', U*0.6, "left", 700);
      label(G.best[k] ? "BEST " + fmtNum(G.best[k]) : "NEW",
            cx + cw - pad - U*0.8, ry + rh/2, G.best[k] ? 'e' : 'X', U*0.66, "right", 800);
      cardHit(cx + pad, ry, cw - pad*2, rh, "pick" + i);
    }
    label("TAP A ROUTE, THEN TAP AGAIN TO DRIVE  ·  SPACE",
          cx + cw/2, cy + ch - U*1.5, 'X', U*0.62, "center", 700);
    cardHit(0, 0, VW, VH, "advance");
    return;
  }

  if(G.state === "brief"){
    const L = levelData();
    const lines = wrapText(L.brief, cw - pad*2, U*0.72);
    const ch = U*(10.6 + lines.length*1.15 + L.stops.length*1.25);
    const cy = Math.max(U*1.2, (VH - ch)/2);
    panel(cx, cy, cw, ch, 16);
    label("ROUTE " + (routeOrd(G.lvl)+1) + " OF " + ROUTES.length, cx + pad, cy + U*1.9, 'h', U*0.66, "left", 800);
    label("PAR " + fmtClock(L.par), cx + cw - pad, cy + U*1.9, 'X', U*0.66, "right", 800);
    label(L.name, cx + pad, cy + U*3.9, 'x', U*1.9, "left", 800);
    label(L.route + "  ·  " + L.sub, cx + pad, cy + U*5.5, 'X', U*0.66, "left", 700);
    let ly = cy + U*7.2;
    for(const ln of lines){ label(ln, cx + pad, ly, 'x', U*0.72, "left", 600); ly += U*1.15; }
    ly += U*0.7;
    for(const st of L.stops){
      label(st.terminus ? "◉" : "○", cx + pad, ly, st.terminus ? 'h' : 'e', U*0.8, "left", 800);
      label(st.name, cx + pad + U*1.3, ly, 'x', U*0.78, "left", 700);
      label(st.terminus ? "ALL CHANGE" : st.on + " ON  ·  " + st.off + " OFF",
            cx + cw - pad, ly, 'X', U*0.62, "right", 700);
      ly += U*1.25;
    }
    label("TAP TO PULL AWAY", cx + cw/2, cy + ch - U*1.3, 'h', U*0.72, "center", 800);
    cardHit(0, 0, VW, VH, "advance");
    return;
  }

  if(G.state === "result"){
    const R = G.result || {win:false};
    const rows = [
      ["STOPS SERVED", R.served + " / " + R.total],
      ["PASSENGERS",   "" + R.moved],
      ["TIME LEFT",    fmtClock(R.left)],
      ["TIME BONUS",   "+" + fmtNum(R.timeBonus)]
    ];
    const ch = U*(11.5 + rows.length*1.5);
    const cy = Math.max(U*1.2, (VH - ch)/2);
    panel(cx, cy, cw, ch, 16);
    label(R.win ? "ROUTE COMPLETE" : "OUT OF TIME", cx + cw/2, cy + U*2.6,
          R.win ? 'e' : 'r', U*1.7, "center", 800);
    label(levelData().name, cx + cw/2, cy + U*4.3, 'X', U*0.7, "center", 700);
    let ry = cy + U*6.4;
    for(const r of rows){
      label(r[0], cx + pad, ry, 'X', U*0.7, "left", 700);
      label(r[1], cx + cw - pad, ry, 'x', U*0.78, "right", 800);
      ry += U*1.5;
    }
    ctx.strokeStyle = "rgba(160,175,195,0.20)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx+pad, ry-U*0.5); ctx.lineTo(cx+cw-pad, ry-U*0.5); ctx.stroke();
    label("SCORE", cx + pad, ry + U*0.7, 'x', U*0.86, "left", 800);
    label(fmtNum(R.score), cx + cw - pad, ry + U*0.7, 'h', U*1.4, "right", 800);
    label("BEST " + fmtNum(G.best[routeOrd(G.lvl)]), cx + cw - pad, ry + U*2.1, 'X', U*0.62, "right", 700);
    const cta = !R.win ? "TAP TO RUN IT AGAIN"
              : (nextRoute(G.lvl) >= 0 ? "TAP FOR " + LEVELS[nextRoute(G.lvl)].name : "TAP TO FINISH THE SHIFT");
    label(cta, cx + cw/2, cy + ch - U*1.3, 'h', U*0.72, "center", 800);
    cardHit(0, 0, VW, VH, "advance");
    return;
  }

  if(G.state === "shift"){
    const ch = U*(9.5 + ROUTES.length*1.6);
    const cy = Math.max(U*1.2, (VH - ch)/2);
    panel(cx, cy, cw, ch, 16);
    label("SHIFT COMPLETE", cx + cw/2, cy + U*2.8, 'e', U*1.9, "center", 800);
    label("BOTH ROUTES DRIVEN", cx + cw/2, cy + U*4.5, 'X', U*0.68, "center", 700);
    let ry = cy + U*6.6;
    for(let k=0;k<ROUTES.length;k++){
      label(LEVELS[ROUTES[k]].name, cx + pad, ry, 'x', U*0.78, "left", 700);
      label(fmtNum(G.best[k]), cx + cw - pad, ry, 'x', U*0.78, "right", 800);
      ry += U*1.6;
    }
    label("SHIFT TOTAL", cx + pad, ry + U*0.4, 'x', U*0.86, "left", 800);
    label(fmtNum(G.runScore), cx + cw - pad, ry + U*0.4, 'h', U*1.4, "right", 800);
    label("TAP FOR THE DEPOT", cx + cw/2, cy + ch - U*1.3, 'h', U*0.72, "center", 800);
    cardHit(0, 0, VW, VH, "advance");
    return;
  }
}

// Mood + squeeze vignette, drawn over the world and under the HUD.
function drawVignette(){
  const r0 = Math.min(VW,VH)*0.32, r1 = Math.hypot(VW,VH)*0.56;
  let g;
  try { g = ctx.createRadialGradient(VW/2,VH/2,r0,VW/2,VH/2,r1); } catch(e){ g = null; }
  if(g && g.addColorStop){
    g.addColorStop(0, "rgba(0,0,0,0)");
    g.addColorStop(1, "rgba(4,6,10,0.46)");
    ctx.fillStyle = g; ctx.fillRect(0,0,VW,VH);
  }
  if(squeezing){
    const t = Math.max(0, Math.min(1, 1 - Math.min(clearL,clearR)/0.75));
    let g2;
    try { g2 = ctx.createRadialGradient(VW/2,VH/2,r0*(1-0.35*t),VW/2,VH/2,r1); } catch(e){ g2 = null; }
    if(g2 && g2.addColorStop){
      const c = Math.min(clearL,clearR) < 0.28 ? "255,74,61" : "255,181,36";
      g2.addColorStop(0, "rgba("+c+",0)");
      g2.addColorStop(1, "rgba("+c+","+(0.10 + 0.30*t).toFixed(3)+")");
      ctx.fillStyle = g2; ctx.fillRect(0,0,VW,VH);
    }
  }
}

// ---------- frame ----------
function render(rdt){
  rdt = Math.max(0, Math.min(0.1, rdt === undefined ? 1/60 : rdt));
  fxUpdate(rdt);

  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = col('a'); ctx.fillRect(0,0,VW,VH);

  ctx.save();
  if(rot90){ ctx.translate(VW,0); ctx.rotate(Math.PI/2); }
  ctx.translate(W/2,H/2); ctx.scale(zoomEase,zoomEase); ctx.translate(-W/2,-H/2);

  drawGround();
  drawStops();
  drawRoute();
  drawBlockShadows();
  drawBlocks();

  for(const b of bins) drawBin(b);
  for(const o of obstacles){
    if(o.kind === "skip")
      drawSkip(o);
    else if(o.kind === "bar")
      drawBarrier(o);
    else if(o.kind === "van")
      drawRig(o.x,o.y,o.ang, VAN_L/2, VAN_W/2, 'v','V',
              { cabinFrom:0.30, cabinTo:1.55, blind:true, hazard:o.hazard && ((frameNo>>4)&1) });
    else
      drawRig(o.x,o.y,o.ang, CAR_L/2, CAR_W/2, 'c','C', {});
  }
  const blinkOn = (car.mode==="telegraph"||car.mode==="backing"||car.mode==="yield"||car.mode==="wait")
                  && ((frameNo>>3)&1);
  drawRig(car.x, car.y, car.ang, CAR_L/2, CAR_W/2, 'o','O', { head:true, blink:blinkOn });

  drawSoftDots(dust, 168, 162, 148);
  if(showGhost) drawGhostHD();
  drawBus();
  drawSoftDots(puffs, 186, 192, 202);
  drawSparks();
  ctx.restore();
  drawPops();
  drawStopPointer();

  // The waiting car's marker lives in screen space so it never shrinks away.
  if(car.mode === "wait" && ((frameNo>>3)&1)){
    const U = Math.max(11, Math.min(VW,VH)*0.024);
    const lx = sx(car.x), ly = sy(car.y);
    label("!", devX(lx,ly), devY(lx,ly) - U*2.4, 'y', U*2.0, "center", 800);
  }

  drawVignette();
  if(G.state === "play"){ drawHUDHD(); drawGameHUD(); }
  drawPads(rdt);
  drawCards();
}

// An invisible pad you cannot see is an invisible pad you cannot learn, so both
// draw themselves under the thumb while it is down and fade out when it lifts.
// Render-only state, eased on the frame delta, exactly like the zoom.
let padGlow = 0;
function drawPads(rdt){
  const live = ctrlMode === "drag" && touchOn && G.state === "play" && PTR.size > 0;
  padGlow += ((live?1:0) - padGlow) * Math.min(1, rdt*10);
  if(padGlow < 0.02 || PTR.size === 0) return;
  ctx.save();
  ctx.globalAlpha = padGlow;
  for(const p of PTR.values()){
    if(p.zone === "L"){
      const x = p.x0, y = p.y0, halfW = STEER_TRAVEL + 10;
      rr(x-halfW, y-13, halfW*2, 26, 13);
      ctx.fillStyle = "rgba(10,12,16,0.55)"; ctx.fill();
      ctx.strokeStyle = "rgba(160,175,195,0.22)"; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = "rgba(160,175,195,0.35)"; ctx.fillRect(x-1, y-7, 2, 14);
      ctx.fillStyle = "rgba(255,181,36,0.92)";
      ctx.beginPath(); ctx.arc(x + steerPad*STEER_TRAVEL, y, 11, 0, Math.PI*2); ctx.fill();
    } else if(p.zone === "R"){
      const x = p.x0, y = p.y0, halfH = SPEED_TRAVEL + 14;
      rr(x-15, y-halfH, 30, halfH*2, 15);
      ctx.fillStyle = "rgba(10,12,16,0.55)"; ctx.fill();
      ctx.strokeStyle = "rgba(160,175,195,0.22)"; ctx.lineWidth = 1; ctx.stroke();
      // The cruise band is drawn, so the null position reads as a real gear.
      ctx.fillStyle = "rgba(160,175,195,0.16)";
      ctx.fillRect(x-13, y-SPEED_TRAVEL*SPEED_DEAD, 26, SPEED_TRAVEL*SPEED_DEAD*2);
      const dy = Math.max(-1, Math.min(1, (p.y-p.y0)/SPEED_TRAVEL));
      ctx.fillStyle = speedPad === "brake" ? "rgba(255,92,92,0.92)"
                    : speedPad === "go"    ? "rgba(120,230,140,0.92)"
                                           : "rgba(255,181,36,0.92)";
      ctx.beginPath(); ctx.arc(x, y + dy*SPEED_TRAVEL, 12, 0, Math.PI*2); ctx.fill();
    }
  }
  ctx.restore();
}

// ============================================================
// Audio -- verbatim from bus.html, lazily created on first tap.
// ============================================================
let muted = localStorage.getItem("bus4k_mute")==="1";
let actx = null, eng = null, engGain = null, sqOsc = null, sqGain = null;
function audioInit(){
  if(actx) return;
  try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx = null; return; }
  try{
    eng = actx.createOscillator(); engGain = actx.createGain();
    eng.type = "sawtooth"; eng.frequency.value = 48; engGain.gain.value = 0;
    eng.connect(engGain); engGain.connect(actx.destination); eng.start();
    sqOsc = actx.createOscillator(); sqGain = actx.createGain();
    sqOsc.type = "sine"; sqOsc.frequency.value = 400; sqGain.gain.value = 0;
    sqOsc.connect(sqGain); sqGain.connect(actx.destination); sqOsc.start();
  }catch(e){}
}
function beep(freq,dur,type,vol){
  if(muted||!actx) return;
  try{
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type||"square"; o.frequency.value=freq; g.gain.value=vol||0.05;
    o.connect(g); g.connect(actx.destination);
    const t=actx.currentTime; o.start(t);
    g.gain.setValueAtTime(vol||0.05,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.stop(t+dur);
  }catch(e){}
}
function engineUpdate(v){
  if(!actx||!eng) return;
  try{
    const t = actx.currentTime;
    eng.frequency.setTargetAtTime(40 + Math.abs(v)*6.2, t, 0.09);
    engGain.gain.setTargetAtTime(muted?0:(0.010 + Math.min(Math.abs(v)/V_MAX,1)*0.026), t, 0.12);
  }catch(e){}
}
function sSqueeze(g){
  if(!actx||!sqOsc) return;
  try{
    const t = actx.currentTime;
    sqOsc.frequency.setTargetAtTime(420 + (0.75-g)*900, t, 0.05);
    sqGain.gain.setTargetAtTime(muted?0:0.016, t, 0.06);
  }catch(e){}
}
function sSqueezeOff(){ if(actx&&sqGain){ try{ sqGain.gain.setTargetAtTime(0, actx.currentTime, 0.08); }catch(e){} } }
function sHorn(){ beep(233,0.42,"sawtooth",0.05); beep(311,0.42,"square",0.035); }
function sBump(i){ beep(90+Math.random()*40, Math.min(0.22,0.06+i*0.02), "sawtooth", 0.05); }
function sBin(){ beep(320+Math.random()*260, 0.05, "square", 0.035); }
function sChime(){ beep(880,0.07); setTimeout(()=>beep(1320,0.09),70); }
function sDoors(){ beep(180,0.20,"sine",0.035); setTimeout(()=>beep(520,0.10,"square",0.03),90); }
function sJolt(){ beep(70,0.24,"sawtooth",0.06); setTimeout(()=>beep(150,0.10,"square",0.03),60); }
function sHold(){ beep(1180,0.09,"square",0.045); setTimeout(()=>beep(1180,0.09,"square",0.045),150); }
function sTick(){ beep(1500,0.035,"square",0.028); }
