const body = document.body;
let touchOn = false;
function markTouch(){ touchOn = true; if(body && body.classList) body.classList.add("touch"); }
window.addEventListener("touchstart", markTouch, {passive:true});

function bindHold(id,key){
  const el = document.getElementById(id); if(!el) return;
  const on=e=>{ e.preventDefault(); input[key]=true; audioInit(); wake(); };
  const off=e=>{ e.preventDefault(); input[key]=false; };
  el.addEventListener("pointerdown",on); el.addEventListener("pointerup",off);
  el.addEventListener("pointerleave",off); el.addEventListener("pointercancel",off);
}
bindHold("up","up"); bindHold("down","down"); bindHold("left","left"); bindHold("right","right");
// Off the play screen every button becomes the same button: continue.
function pressHorn(){
  audioInit(); wake();
  if(G.state !== "play"){ advance(); return; }
  if(!input.horn){ input.horn=true; input.hornEdge=true; }
}
// Tapping the front end drives it; the cards record their own rects. Both the
// canvas and the drag zones route here, so the menus work under either scheme.
function frontEndTap(cx, cy){
  const r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : {left:0,top:0};
  const x = cx - r.left, y = cy - r.top;
  for(let i=G.hits.length-1;i>=0;i--){
    const h = G.hits[i];
    if(x < h.x || x > h.x+h.w || y < h.y || y > h.y+h.h) continue;
    if(h.act.indexOf("pick") === 0){
      const n = parseInt(h.act.slice(4),10);
      if(G.pick === n){ advance(); } else { G.pick = n; loadLevel(n); resetAll(); buildWaiters(); }
    } else advance();
    return;
  }
  advance();
}
canvas.addEventListener("pointerdown", e=>{
  audioInit(); wake();
  if(G.state === "play") return;
  frontEndTap(e.clientX, e.clientY);
});
function restart(){
  if(G.state === "play") startLevel(G.lvl);
  else { G.state = "title"; loadLevel(G.pick); resetAll(); buildWaiters(); }
}
const hornBtn = document.getElementById("horn");
if(hornBtn){
  hornBtn.addEventListener("pointerdown",e=>{ e.preventDefault(); pressHorn(); });
  hornBtn.addEventListener("pointerup",e=>{ e.preventDefault(); input.horn=false; });
  hornBtn.addEventListener("pointerleave",e=>{ input.horn=false; });
}

// ============================================================
// Touch: two relative drag pads (research S11)
// ============================================================
// Steering is a drag area relative to touch-down x -- never an absolute wheel --
// and it writes the analogue input.axis rather than the boolean flags, because
// S11 is emphatic that a bus needs a holdable partial lock. The right pad is a
// three-band speed control whose null position is auto-throttle, so the hand can
// leave the glass entirely and the bus still rolls. That is what buys us a free
// thumb, which is the whole point of S11's "avoid simultaneous two-thumb actions".
//
// None of this runs inside update(). touchTick() is called from the same fixed
// step immediately before it, exactly like gameTick() is called after, so the
// shared simulation block is untouched and parity holds.
const STEER_TRAVEL = 96;    // CSS px from touch-down to full lock
const STEER_DEAD   = 8;     // snaps to exactly 0, so update() self-centres fast
const SPEED_TRAVEL = 90;
const SPEED_DEAD   = 0.25;  // fraction of travel that still counts as cruise
const CRUISE       = 9.0;   // m/s, about 32 km/h -- an urban bus, not a coach
const TAP_SLOP     = 14;    // S11's commit threshold: past this you are driving
const TAP_PAIR     = 200;   // ms between the two fingers landing
const TAP_HOLD     = 300;   // ms the pair may stay down and still be a tap

let ctrlMode = "drag";
const PTR = new Map();      // pointerId -> {zone, x0, y0, x, y}
const TAP = { ids:[], t0:0, t1:0, armed:false, moved:false, up:0 };
let steerPad = 0;           // -1..1, the analogue steering demand
let speedPad = "cruise";    // "go" | "cruise" | "brake"

function tapReset(){ TAP.ids.length = 0; TAP.armed = false; TAP.moved = false; TAP.up = 0; }

// A two-finger tap only counts from a standing start. If a pointer was already
// down this is the ordinary two-thumb driving posture, not a gesture -- which is
// what stops HOLD ON firing every time the second thumb lands.
function tDown(id, x, y, t, zone){
  const first = PTR.size === 0;
  PTR.set(id, {zone, x0:x, y0:y, x, y});
  if(first){ tapReset(); TAP.ids.push(id); TAP.t0 = t; TAP.armed = true; }
  else if(TAP.armed && TAP.ids.length === 1 && t - TAP.t0 <= TAP_PAIR){ TAP.ids.push(id); TAP.t1 = t; }
  else TAP.armed = false;
  applyPads();
}
function tMove(id, x, y){
  const p = PTR.get(id); if(!p) return;
  p.x = x; p.y = y;
  if(Math.abs(x-p.x0) > TAP_SLOP || Math.abs(y-p.y0) > TAP_SLOP) TAP.moved = true;
  applyPads();
}
function tUp(id, t){
  if(!PTR.has(id)) return;
  PTR.delete(id);
  if(TAP.armed && TAP.ids.indexOf(id) >= 0){
    TAP.up++;
    if(TAP.up === 2 && TAP.ids.length === 2 && !TAP.moved && t - TAP.t1 <= TAP_HOLD){
      holdOn(); tapReset();
    }
  }
  applyPads();
}
function tCancel(){ PTR.clear(); tapReset(); applyPads(); }

// Resolve the live pointers into a steering demand and a speed band. While a
// two-finger tap is still a candidate both are held at neutral, so bracing can
// never yank the wheel.
function applyPads(){
  const pending = TAP.armed && TAP.ids.length === 2 && !TAP.moved;
  let steer = 0, mode = "cruise";
  if(!pending){
    for(const p of PTR.values()){
      if(p.zone === "L"){
        const dx = p.x - p.x0, ax = Math.abs(dx);
        steer = ax <= STEER_DEAD ? 0
              : Math.max(-1, Math.min(1, (dx - (dx<0?-STEER_DEAD:STEER_DEAD)) / (STEER_TRAVEL-STEER_DEAD)));
      } else if(p.zone === "R"){
        const dy = (p.y - p.y0) / SPEED_TRAVEL;
        mode = dy < -SPEED_DEAD ? "go" : dy > SPEED_DEAD ? "brake" : "cruise";
      }
    }
  }
  steerPad = steer; speedPad = mode;
}

// Called once per fixed step, immediately before update().
function touchTick(){
  if(ctrlMode !== "drag" || !touchOn) return;
  if(G.state !== "play"){ input.axis = 0; return; }
  input.axis = steerPad;
  if(speedPad === "go"){ input.up = true;  input.down = false; }
  else if(speedPad === "brake"){ input.up = false; input.down = true; }
  else if(G.board > 0){ input.up = false; input.down = false; }
  else {
    // Auto-throttle (S11): hands off and the bus holds an urban cruise. It only
    // ever sets the same booleans a thumb would, so the driving model is intact.
    input.up   = bus.v < CRUISE - 0.25;
    input.down = bus.v > CRUISE + 1.0;
  }
}

const zoneLEl = document.getElementById("zoneL");
const zoneREl = document.getElementById("zoneR");
function bindZone(el, zone){
  if(!el || !el.addEventListener) return;
  el.addEventListener("pointerdown", e=>{
    e.preventDefault(); audioInit(); wake();
    if(G.state !== "play"){ frontEndTap(e.clientX, e.clientY); return; }
    if(el.setPointerCapture){ try{ el.setPointerCapture(e.pointerId); }catch(_){} }
    tDown(e.pointerId, e.clientX, e.clientY, e.timeStamp || 0, zone);
  });
  el.addEventListener("pointermove", e=>{
    if(!PTR.has(e.pointerId)) return;
    e.preventDefault(); tMove(e.pointerId, e.clientX, e.clientY);
  });
  const up = e=>{ if(PTR.has(e.pointerId)) tUp(e.pointerId, e.timeStamp || 0); };
  el.addEventListener("pointerup", up);
  el.addEventListener("pointercancel", up);
  el.addEventListener("lostpointercapture", up);
}
bindZone(zoneLEl, "L"); bindZone(zoneREl, "R");

const ctrlBtn = document.getElementById("ctrlBtn");
function setCtrl(mode, on){
  ctrlMode = mode === "pads" ? "pads" : "drag";
  if(on !== undefined) touchOn = !!on;
  PTR.clear(); tapReset(); applyPads();
  input.axis = 0; input.left = input.right = false;
  if(body && body.classList){
    body.classList.toggle("drag", ctrlMode === "drag");
    body.classList.toggle("pads", ctrlMode === "pads");
  }
  if(ctrlBtn) ctrlBtn.textContent = ctrlMode === "drag" ? "DRAG" : "PADS";
  try{ localStorage.setItem("bus4k_ctrl", ctrlMode); }catch(e){}
}

// The one-time coaching line. S11 asks for a commit threshold, not a manual, so
// this says the two things that are not guessable and then gets out of the way.
function routeHint(){
  if(ctrlMode !== "drag" || !touchOn) return;
  let seen = 0;
  try{ seen = parseInt(localStorage.getItem("bus4k_seen"),10) || 0; }catch(e){}
  if(seen < 3){
    say("DRAG LEFT: STEER  \u00b7  DRAG RIGHT: SPEED", 'h', 3.4);
    G.hint2 = 3.6;
    try{ localStorage.setItem("bus4k_seen", ""+(seen+1)); }catch(e){}
  } else {
    say("TWO-FINGER TAP  \u00b7  HOLD ON", 'w', 3.0);
  }
}

const KEYMAP = {ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down",
                a:"left",d:"right",w:"up",s:"down",A:"left",D:"right",W:"up",S:"down"};
window.addEventListener("keydown",e=>{
  if(KEYMAP[e.key] && G.state === "play"){ input[KEYMAP[e.key]]=true; e.preventDefault(); hideHint(); wake(); }
  else if(KEYMAP[e.key] && G.state === "title" && (e.key==="ArrowUp"||e.key==="ArrowDown"||e.key==="w"||e.key==="s")){
    const k = (routeOrd(G.pick) + (e.key==="ArrowUp"||e.key==="w" ? ROUTES.length-1 : 1)) % ROUTES.length;
    G.pick = ROUTES[k];
    loadLevel(G.pick); resetAll(); buildWaiters(); e.preventDefault();
  }
  if(e.key===" "||e.key==="Enter"){ if(!e.repeat) pressHorn(); e.preventDefault(); hideHint(); }
  if(e.key==="h"||e.key==="H") holdOn();
  if(e.key==="1"||e.key==="2"){
    const n = (+e.key)-1;
    if(n < ROUTES.length && G.state !== "play"){
      G.pick = ROUTES[n]; loadLevel(G.pick); resetAll(); buildWaiters();
    }
  }
  if(e.key==="r"||e.key==="R") restart();
  if(e.key==="f"||e.key==="F") toggleFull();
});
window.addEventListener("keyup",e=>{
  if(KEYMAP[e.key]){ input[KEYMAP[e.key]]=false; e.preventDefault(); }
  if(e.key===" ") input.horn=false;
});

// The chrome fades out of the way once you are actually driving, and comes
// back the moment you reach for it.
let idleT = 0;
function wake(){
  idleT = 0;
  if(topbarEl && topbarEl.classList) topbarEl.classList.remove("dim");
}
window.addEventListener("pointermove", wake);
window.addEventListener("pointerdown", wake);
const hintEl = document.getElementById("keyhint");
let hintTimer = null;
function hideHint(){
  if(!hintEl || !hintEl.classList || hintTimer) return;
  hintTimer = setTimeout(()=>{ if(hintEl.classList) hintEl.classList.add("gone"); }, 1200);
}

function toggleFull(){
  try{
    if(!document.fullscreenElement && document.documentElement.requestFullscreen)
      document.documentElement.requestFullscreen();
    else if(document.exitFullscreen) document.exitFullscreen();
  }catch(e){}
}

const palBtn = document.getElementById("palBtn");
function refreshPal(){ if(palBtn) palBtn.textContent = PAL_LABEL[palMode]; }
if(palBtn) palBtn.addEventListener("click",()=>{
  palMode = PAL_ORDER[(PAL_ORDER.indexOf(palMode)+1)%PAL_ORDER.length];
  localStorage.setItem("bus4k_pal3",palMode); refreshPal();
});
refreshPal();

const zoomBtn = document.getElementById("zoomBtn");
function refreshZoom(){ if(zoomBtn) zoomBtn.textContent = ZOOMS[zoomStep].toFixed(1) + "\u00d7"; }
if(zoomBtn) zoomBtn.addEventListener("click",()=>{
  zoomStep = (zoomStep+1) % ZOOMS.length;
  localStorage.setItem("bus4k_zoom", ""+zoomStep);
  resize(); updateCam(0,true); refreshZoom();
});
{
  const z = parseInt(localStorage.getItem("bus4k_zoom"),10);
  if(z >= 0 && z < ZOOMS.length) zoomStep = z;
}
refreshZoom();

const muteBtn = document.getElementById("muteBtn");
function refreshMute(){ if(muteBtn) muteBtn.textContent = muted?"MUTED":"SOUND"; }
if(muteBtn) muteBtn.addEventListener("click",()=>{
  muted=!muted; localStorage.setItem("bus4k_mute",muted?"1":"0"); audioInit();
  if(muted) sSqueezeOff();
  refreshMute();
});
refreshMute();
const ghostBtn = document.getElementById("ghostBtn");
function refreshGhost(){
  if(!ghostBtn) return;
  ghostBtn.textContent = "GHOST";
  if(ghostBtn.classList){ if(showGhost) ghostBtn.classList.add("on"); else ghostBtn.classList.remove("on"); }
}
if(ghostBtn) ghostBtn.addEventListener("click",()=>{ showGhost=!showGhost; refreshGhost(); });
refreshGhost();
const resetBtn = document.getElementById("resetBtn");
if(resetBtn) resetBtn.addEventListener("click",()=>{ closeSet(); restart(); });
const fullBtn = document.getElementById("fullBtn");
if(fullBtn) fullBtn.addEventListener("click",()=>toggleFull());
if(ctrlBtn) ctrlBtn.addEventListener("click",()=>setCtrl(ctrlMode === "drag" ? "pads" : "drag"));

// ---------- settings sheet ----------
// Opening it pauses: the clock is the only thing that can end a run, so it must
// not tick while someone is reading a menu.
const setEl = document.getElementById("settings");
let paused = false;
function setPaused(p){
  paused = !!p;
  if(paused){ input.left = input.right = input.up = input.down = false; input.axis = 0; }
}
function openSet(){ if(setEl) setEl.hidden = false; PTR.clear(); tapReset(); applyPads(); setPaused(true); }
function closeSet(){ if(setEl) setEl.hidden = true; setPaused(false); }
function toggleSet(){ if(setEl && setEl.hidden) openSet(); else closeSet(); }
const gearBtn = document.getElementById("gear");
if(gearBtn) gearBtn.addEventListener("click",()=>{ audioInit(); toggleSet(); });
const closeBtn = document.getElementById("closeBtn");
if(closeBtn) closeBtn.addEventListener("click",()=>closeSet());
if(setEl) setEl.addEventListener("pointerdown", e=>{ if(e.target === setEl) closeSet(); });

{
  let m = null;
  try{ m = localStorage.getItem("bus4k_ctrl"); }catch(e){}
  setCtrl(m === "pads" ? "pads" : "drag");
}

document.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});
document.addEventListener("gesturestart",e=>e.preventDefault());
document.addEventListener("dblclick",e=>e.preventDefault());
window.addEventListener("resize", ()=>{ resize(); updateCam(0,true); });
window.addEventListener("orientationchange", ()=>{ resize(); updateCam(0,true); });

// ============================================================
// Boot / reset
// ============================================================
function resetAll(){
  buildWorld(); resetBus(); spawnCar();
  sparks.length = 0; shake = 0; hitCount = 0;
  squeezing = false; squeezeFlash = 0; squeezeDirty = false; timeScale = 1;
  clearL = clearR = CLEAR_CAP;
  puffs.length = 0; dust.length = 0; skids.length = 0; lastRear = null;
  updateCam(0, true);
}
resize();
loadLevel(0);
resetAll();
buildWaiters();

const STEP = 1000/60; let acc = 0, last = performance.now();
// The fixed-step body, split out so the harness can drive the real loop --
// including the settings pause -- rather than a reimplementation of it.
function stepSim(raw){
  acc += raw; if(acc > 200) acc = 200;
  if(paused){ acc = 0; return; }
  while(acc >= STEP){
    // Off the play screen the bus takes no orders; it just coasts to a stop.
    if(G.state !== "play"){ input.left = input.right = input.up = input.down = false; input.axis = 0; }
    touchTick();
    update();
    gameTick();
    acc -= STEP;
  }
}
function frame(now){
  const raw = now - last;
  last = now;
  stepSim(raw);
  idleT += raw/1000;
  if(idleT > 3.5 && Math.abs(bus.v) > 1.5){
    if(topbarEl && topbarEl.classList) topbarEl.classList.add("dim");
  }
  render(Math.min(0.1, raw/1000));
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- Headless test handle ----------
if(typeof window!=="undefined" && window.__busHook){
  window.__busHook({
    bus, car, input,
    obstacles:()=>obstacles, bins:()=>bins, segs:()=>SEGS, totalS:()=>TOTAL_S,
    project, pathPoint, toWorld, busCentre, busOBB, busLocal, busS, freeInterval,
    clearances:()=>({l:clearL, r:clearR}), squeezing:()=>squeezing,
    hits:()=>hitCount, single:()=>update(), step:n=>{ for(let i=0;i<(n||60);i++) update(); },
    render, reset:resetAll, spawnCar,
    setPal:p=>{ palMode = p; }, getPal:()=>palMode,
    setGhost:b=>{ showGhost = b; },
    setNoclip:b=>{ noClip = b; },
    place:(s,q,dh)=>{ const w = toWorld(s,q); bus.rx=w.x; bus.ry=w.y; bus.h=w.ang+(dh||0); bus.v=0;
                      bus.steerNorm=0; bus.steer=0; updateCam(0,true); },
    honk:()=>{ input.hornEdge = true; },
    keys:()=>({ tone:KEY_TONE, gbc:GBC }),
    blocks:()=>BLOCKS, props:()=>PROPS,
    game:G, levels:LEVELS, routes:()=>ROUTES.slice(), loadLevel, startLevel, advance, holdOn, restart,
    gameTick, nextStop, stopPost, stopDoorQ, dockAt, buildWaiters,
    // Physics + game together, which is what the real loop runs.
    play:n=>{ for(let i=0;i<(n||60);i++){ update(); gameTick(); } },
    // The whole loop including the touch layer, for the gesture tests.
    drive:n=>{ for(let i=0;i<(n||60);i++){ touchTick(); update(); gameTick(); } },
    touch:{ down:tDown, move:tMove, up:tUp, cancel:tCancel, tick:touchTick,
            ptrs:()=>PTR.size, pads:()=>({steer:steerPad, speed:speedPad}),
            tuning:{STEER_TRAVEL,STEER_DEAD,SPEED_TRAVEL,SPEED_DEAD,CRUISE,
                    TAP_SLOP,TAP_PAIR,TAP_HOLD} },
    setCtrl, ctrl:()=>ctrlMode, loopStep:stepSim,
    setPaused, isPaused:()=>paused, openSet, closeSet, frontEndTap,
    viewport:()=>({VW,VH,W,H,DPR,PPM,PPM_BASE,rot90,zoom:ZOOMS[zoomStep]}),
    setZoomStep:i=>{ zoomStep=i; resize(); },
    resize,
    consts:{BUS_L,BUS_W,WB,FRONT_OH,REAR_OH,STEER_MAX,PPM,W,H,NEED_BOTH,CLEAR_CAP,
            VARIANT:"4k", VIEW_X_M, VIEW_Y_M}
  });
}

})();
