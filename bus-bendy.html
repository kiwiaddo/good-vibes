<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f380f">
<title>ONE STREET / BENDY · Good Vibes Arcade</title>
<style>
  :root{ --c0:#0f380f; --c1:#306230; --c2:#8bac0f; --c3:#9bbc0f; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{
    background:#0a140a; color:var(--c3);
    font-family:"Courier New",monospace;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    overflow:hidden; touch-action:none; user-select:none;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  #shell{ width:min(100vw,480px); display:flex; flex-direction:column; gap:6px; padding:8px; }
  #topbar{ display:flex; align-items:center; justify-content:space-between; font-size:12px; letter-spacing:1px; }
  #topbar a{ color:var(--c2); text-decoration:none; font-weight:bold; }
  #topbar a:active{ color:var(--c3); }
  .chip{
    background:var(--c0); color:var(--c3); border:2px solid var(--c1);
    border-radius:6px; padding:4px 6px; font-weight:bold; font-size:11px;
    cursor:pointer; min-width:62px;
  }
  .chip:active{ background:var(--c1); }
  #screen{
    position:relative; background:#081208; border:4px solid var(--c0);
    border-radius:12px; padding:6px;
    box-shadow:0 6px 0 #050a05, inset 0 0 0 2px var(--c1);
  }
  canvas{ display:block; width:100%; height:auto; image-rendering:pixelated; image-rendering:crisp-edges; border-radius:5px; }
  #subbar{ display:flex; gap:6px; justify-content:center; }
  #variants{ display:flex; gap:5px; justify-content:center; }
  .vchip{
    flex:1; text-align:center; text-decoration:none;
    background:#0a1c0a; color:var(--c2); border:2px solid var(--c1);
    border-radius:6px; padding:5px 2px; font-size:10px; font-weight:bold; letter-spacing:1px;
  }
  .vchip.on{ background:var(--c1); color:var(--c3); border-color:var(--c2); }
  #controls{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:2px; }
  #dpad{ display:grid; grid-template-columns:repeat(3,50px); grid-template-rows:repeat(3,50px); gap:4px; }
  .btn{
    background:var(--c1); color:var(--c3); border:none; border-bottom:4px solid var(--c0);
    border-radius:10px; font-weight:bold; font-size:18px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; touch-action:none;
  }
  .btn:active{ background:var(--c2); color:var(--c0); border-bottom-width:2px; transform:translateY(2px); }
  #up{ grid-area:1/2; } #left{ grid-area:2/1; } #right{ grid-area:2/3; } #down{ grid-area:3/2; }
  #horn{
    width:108px; height:108px; border-radius:50%;
    background:#c8901c; color:#2a1c04; border-bottom:6px solid #7a5610;
    font-size:17px; letter-spacing:1px;
  }
  #horn:active{ background:#e8ae30; border-bottom-width:2px; transform:translateY(3px); }
  #hint{ text-align:center; font-size:10px; color:var(--c1); letter-spacing:1px; margin-top:2px; line-height:1.5; }
</style>
</head>
<body>
  <div id="shell">
    <div id="topbar">
      <a href="index.html">&#9664; ARCADE</a>

    </div>

    <div id="controls">
      <div id="dpad">
        <button class="btn" id="up">&#9650;</button>
        <button class="btn" id="left">&#9664;</button>
        <button class="btn" id="right">&#9654;</button>
        <button class="btn" id="down">&#9660;</button>
      </div>
      <button class="btn" id="horn">HORN</button>
    </div>
    <div id="hint">VARIANT: BENDY BUS &middot; 18 m articulated<br>Same street, same camera &mdash; only the vehicle differs from RIGID.</div>
  </div>

<script>
(function(){
"use strict";

// ============================================================
// ONE-STREET PROTOTYPE
// The gate test from docs/bus-game-research.md section 15.
// A 12 m bus, one narrow winding street, six parked cars (two badly),
// one oncoming car that negotiates, and nothing else. No score, no
// timer, no passengers -- if threading this is fun bare, the game exists.
// ============================================================

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;
const W = canvas.width, H = canvas.height;   // 320 x 192
const PPM = 6;                               // pixels per world metre

// ---------- Palettes ----------
// Bodies are authored with single-char colour KEYS. Every new key must be
// added to BOTH KEY_TONE and GBC or it renders magenta.
const TONES = {
  green: ["#0f380f","#306230","#8bac0f","#9bbc0f"],
  gray:  ["#0b0b0b","#4a4a4a","#a6a6a6","#eaeaea"]
};
const KEY_TONE = {
  ".":-1,
  "a":0,"b":0,"B":1,                    // void, building, building edge
  "d":1,"D":0,"p":2,"k":3,"l":3,        // asphalt, shade, pavement, kerb, paint
  "u":3,"U":2,"g":1,"G":0,"t":0,"m":2,  // bus body/shade, glass, tyre, mirror
  "c":2,"C":1,"v":2,"V":1,"o":2,"O":1,  // parked car, van, oncoming car
  "h":3,"r":2,"n":1,"N":2,              // hazard, brake light, bin, bin lid
  "s":3,"e":2,"x":3,"X":1,"y":3,"w":3   // spark, ghost, hud, hud dim, warn, white
};
const GBC = {
  "a":"#0e0f14","b":"#3b3129","B":"#5c4a3c",
  "d":"#3a3b42","D":"#26272d","p":"#74767e","k":"#a8aeb6","l":"#ded8c0",
  "u":"#e34b3a","U":"#a32f22","g":"#37556a","G":"#1e3140","t":"#17181c","m":"#b8bcc2",
  "c":"#4a86c6","C":"#2f5e91","v":"#ded9cc","V":"#a9a496","o":"#52a86e","O":"#2f7048",
  "h":"#ffb524","r":"#ff4a3d","n":"#4d6046","N":"#6e8564",
  "s":"#fff0b8","e":"#6fe3bd","x":"#eceadf","X":"#8b8778","y":"#ffe45c","w":"#ffffff"
};
const PAL_ORDER = ["green","gray","color"];
const PAL_LABEL = { green:"GB GREEN", gray:"GB GRAY", color:"GB COLOR" };
let palMode = localStorage.getItem("bus_pal3") || "color";
if(PAL_ORDER.indexOf(palMode) < 0) palMode = "color";

function col(key){
  if(palMode === "color") return GBC[key] || "#ff00ff";
  const t = KEY_TONE[key]; return TONES[palMode][t === undefined ? 0 : t];
}

// ---------- Draw helpers ----------
function rect(x,y,w,h,key){
  if(key === ".") return;
  ctx.fillStyle = col(key);
  ctx.fillRect(x|0, y|0, Math.ceil(w), Math.ceil(h));
}
// Rotated rect, rasterised by scanline with run-length batching so bodies stay
// crisp pixels rather than antialiased canvas transforms.
function fillOBB(cx,cy,c,s,hl,hw,key){
  const ex = Math.abs(c*hl) + Math.abs(s*hw);
  const ey = Math.abs(s*hl) + Math.abs(c*hw);
  let x0 = Math.floor(cx-ex), x1 = Math.ceil(cx+ex);
  let y0 = Math.floor(cy-ey), y1 = Math.ceil(cy+ey);
  if(x1 < 0 || x0 > W || y1 < 0 || y0 > H) return;
  if(x0 < 0) x0 = 0; if(x1 > W-1) x1 = W-1;
  if(y0 < 0) y0 = 0; if(y1 > H-1) y1 = H-1;
  ctx.fillStyle = col(key);
  for(let py=y0; py<=y1; py++){
    let run = -1;
    const dy = py + 0.5 - cy;
    for(let px=x0; px<=x1; px++){
      const dx = px + 0.5 - cx;
      const lx = dx*c + dy*s, ly = dx*s - dy*c;
      const inside = lx >= -hl && lx <= hl && ly >= -hw && ly <= hw;
      if(inside){ if(run < 0) run = px; }
      else if(run >= 0){ ctx.fillRect(run,py,px-run,1); run = -1; }
    }
    if(run >= 0) ctx.fillRect(run,py,x1+1-run,1);
  }
}
// Dotted line in screen pixels, for the swept-path preview.
function dline(x0,y0,x1,y1,key,gap){
  gap = gap || 2;
  const dx = x1-x0, dy = y1-y0;
  const n = Math.max(1, Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))));
  ctx.fillStyle = col(key);
  for(let i=0;i<=n;i++){
    if(i % gap) continue;
    const px = (x0 + dx*i/n)|0, py = (y0 + dy*i/n)|0;
    if(px<0||py<0||px>=W||py>=H) continue;
    ctx.fillRect(px,py,1,1);
  }
}

const FONT = {
  "0":[7,5,5,5,7],"1":[2,6,2,2,7],"2":[7,1,7,4,7],"3":[7,1,7,1,7],"4":[5,5,7,1,1],
  "5":[7,4,7,1,7],"6":[7,4,7,5,7],"7":[7,1,2,2,2],"8":[7,5,7,5,7],"9":[7,5,7,1,7],
  "A":[7,5,7,5,5],"B":[6,5,6,5,6],"C":[7,4,4,4,7],"D":[6,5,5,5,6],"E":[7,4,7,4,7],
  "F":[7,4,7,4,4],"G":[7,4,5,5,7],"H":[5,5,7,5,5],"I":[7,2,2,2,7],"J":[1,1,1,5,7],
  "K":[5,5,6,5,5],"L":[4,4,4,4,7],"M":[5,7,7,5,5],"N":[5,7,7,7,5],"O":[7,5,5,5,7],
  "P":[7,5,7,4,4],"Q":[7,5,5,7,3],"R":[7,5,6,5,5],"S":[7,4,7,1,7],"T":[7,2,2,2,2],
  "U":[5,5,5,5,7],"V":[5,5,5,5,2],"W":[5,5,7,7,5],"X":[5,5,2,5,5],"Y":[5,5,2,2,2],
  "Z":[7,1,2,4,7]," ":[0,0,0,0,0],"-":[0,0,7,0,0],".":[0,0,0,0,2],"!":[2,2,2,0,2],
  ":":[0,2,0,2,0],"/":[1,1,2,4,4],"+":[0,2,7,2,0]
};
function text(s,x,y,key,sc){
  sc = sc || 1; let cx = x; s = (""+s).toUpperCase();
  for(let n=0;n<s.length;n++){
    const g = FONT[s[n]] || FONT[" "];
    for(let r=0;r<5;r++){ const b=g[r];
      for(let c=0;c<3;c++){ if(b & (4>>c)) rect(cx+c*sc, y+r*sc, sc, sc, key); }
    }
    cx += 4*sc;
  }
}
function textC(s,y,key,sc){ sc=sc||1; const w=(""+s).length*4*sc - sc; text(s,(W-w)/2|0,y,key,sc); }

// ============================================================
// The street: a centreline polyline with a varying half-width.
// Half-width is the BUILDING line -- hard collision. Inside it sits a
// 0.9 m pavement strip each side that the bus may mount (rumble, no damage),
// which is the small voluntary margin the design wants players to gamble on.
// ============================================================
const PAVE = 0.9;
const NODES = [
  {x:0,   y:0,   hw:4.6},
  {x:40,  y:0,   hw:4.6},
  {x:70,  y:-8,  hw:4.2},
  {x:105, y:-12, hw:4.0},
  {x:135, y:-4,  hw:3.3},   // the pinch
  {x:160, y:6,   hw:3.4},
  {x:190, y:10,  hw:4.0},
  {x:220, y:2,   hw:4.4},
  {x:236, y:-2,  hw:5.0},
  {x:252, y:-2,  hw:7.2}    // turning head
];
const SEGS = [];
let TOTAL_S = 0;
(function buildPath(){
  for(let i=0;i<NODES.length-1;i++){
    const a = NODES[i], b = NODES[i+1];
    const dx = b.x-a.x, dy = b.y-a.y;
    const len = Math.hypot(dx,dy);
    SEGS.push({
      ax:a.x, ay:a.y, bx:b.x, by:b.y,
      dx:dx/len, dy:dy/len, nx:dy/len, ny:-dx/len,   // left normal
      len, s0:TOTAL_S, hw0:a.hw, hw1:b.hw
    });
    TOTAL_S += len;
  }
})();

// Nearest point on the path. Returns along-distance s, lateral offset q
// (positive = left of travel), and the half-width there.
function project(x,y){
  let best = null, bestD = Infinity;
  for(let i=0;i<SEGS.length;i++){
    const g = SEGS[i];
    let t = ((x-g.ax)*g.dx + (y-g.ay)*g.dy);
    if(t < 0) t = 0; else if(t > g.len) t = g.len;
    const px = g.ax + g.dx*t, py = g.ay + g.dy*t;
    const d = Math.hypot(x-px, y-py);
    if(d < bestD){
      bestD = d;
      const u = t/g.len;
      best = { s:g.s0+t, q:(x-g.ax)*g.nx + (y-g.ay)*g.ny, hw:g.hw0+(g.hw1-g.hw0)*u, seg:i, t };
    }
  }
  return best;
}
// World position / frame at a given along-distance.
function pathPoint(s){
  if(s < 0) s = 0; else if(s > TOTAL_S) s = TOTAL_S;
  for(let i=0;i<SEGS.length;i++){
    const g = SEGS[i];
    if(s <= g.s0+g.len || i === SEGS.length-1){
      const t = Math.min(s-g.s0, g.len), u = t/g.len;
      return { x:g.ax+g.dx*t, y:g.ay+g.dy*t, dx:g.dx, dy:g.dy, nx:g.nx, ny:g.ny,
               hw:g.hw0+(g.hw1-g.hw0)*u, ang:Math.atan2(g.dy,g.dx) };
    }
  }
  return null;
}
function toWorld(s,q){ const p = pathPoint(s); return { x:p.x+p.nx*q, y:p.y+p.ny*q, ang:p.ang }; }

// ============================================================
// Obstacles. Six parked cars, two of them badly -- each one is a joke that
// is also a geometry problem. Bins are nudgeable (the pressure valve).
// ============================================================
const CAR_L = 4.2, CAR_W = 1.8, VAN_L = 5.4, VAN_W = 2.1;
const PARKED_SPEC = [
  {s:34,  q:2.7,  a:0.02,  t:"car", tint:"c"},
  {s:74,  q:-2.5, a:-0.03, t:"car", tint:"c"},
  {s:98,  q:2.6,  a:0.0,   t:"car", tint:"c"},
  {s:118, q:2.4,  a:0.03,  t:"car", tint:"c"},                 // narrows the squeeze-past
  {s:132, q:-1.35,a:-0.05, t:"van", tint:"v", hazard:true},    // BADLY: double-parked
  {s:178, q:1.9,  a:0.56,  t:"car", tint:"c", straddle:true}   // BADLY: 32 deg across two bays
];
const BIN_SPEC = [ {s:60,q:3.0},{s:62.2,q:3.05},{s:184,q:-2.8},{s:186.4,q:-2.95},{s:188.6,q:-2.6} ];

let obstacles = [], bins = [];
function buildWorld(){
  obstacles = PARKED_SPEC.map(p=>{
    const w = toWorld(p.s, p.q);
    const isVan = p.t === "van";
    const o = { x:w.x, y:w.y, ang:w.ang + p.a,
             hl:(isVan?VAN_L:CAR_L)/2, hw:(isVan?VAN_W:CAR_W)/2,
             kind:p.t, hazard:!!p.hazard, straddle:!!p.straddle };
    const pr = project(o.x,o.y); o.ps = pr.s; o.pq = pr.q;
    return o;
  });
  bins = BIN_SPEC.map(b=>{
    const w = toWorld(b.s, b.q);
    return { x:w.x, y:w.y, vx:0, vy:0, ang:Math.random()*3, spin:0, r:0.36 };
  });
}

// ============================================================
// The bus. Bicycle model driven from the REAR AXLE, with real overhangs so
// the tail sweeps outward opposite the turn. That sweep is the whole game.
// ============================================================
const BUS_L = 11.0, BUS_W = 2.55, WB = 5.5, FRONT_OH = 2.5, REAR_OH = 3.0;
// Articulation: the trailer hangs off a hitch just behind the front section's
// tail. It CUTS IN through bends while the front section's tail swings OUT --
// two opposite behaviours to fight at once, from one steering input.
const HITCH_OFF = 2.9, TRAIL_L = 7.0, TRAIL_WB = 4.6, JACK = 0.87;
const BUS_HW = BUS_W/2;
const STEER_MAX = 0.733;          // ~42 deg -> ~22 m kerb-to-kerb circle
const V_MAX = 14.0, V_REV = 4.0;  // m/s
const ACCEL = 1.9, BRAKE = 4.2, DRAG = 0.55;

const bus = {
  rx:0, ry:0, h:0, th:0, v:0,
  steer:0, steerNorm:0,
  scrapes:[],      // permanent decals: {a, side}
  bump:0
};
function busFrame(){ return { c:Math.cos(bus.h), s:Math.sin(bus.h) }; }
// Local (along-from-rear-axle, left-offset) -> world.
function busLocal(a,b){
  const c = Math.cos(bus.h), s = Math.sin(bus.h);
  return { x:bus.rx + a*c + b*s, y:bus.ry + a*s - b*c };
}
function busCentre(){ return busLocal(WB + FRONT_OH - BUS_L/2, 0); }
function hitchPos(){ return busLocal(-HITCH_OFF, 0); }
function trailerCentre(){
  const p = hitchPos();
  return { x:p.x - (TRAIL_L/2)*Math.cos(bus.th), y:p.y - (TRAIL_L/2)*Math.sin(bus.th) };
}
function trailerOBB(){
  const c = trailerCentre();
  return { x:c.x, y:c.y, ang:bus.th, hl:TRAIL_L/2, hw:BUS_HW };
}
// Whole-rig centre, so the camera frames all 18 m rather than just the cab.
function rigCentre(){ return busLocal((WB+FRONT_OH - (HITCH_OFF+TRAIL_L))/2, 0); }
function wrapPi(a){ while(a >  Math.PI) a -= 2*Math.PI; while(a < -Math.PI) a += 2*Math.PI; return a; }
function artAngle(){ return wrapPi(bus.h - bus.th); }
function clampJack(){
  const d = artAngle();
  if(d >  JACK) bus.th = bus.h - JACK;
  if(d < -JACK) bus.th = bus.h + JACK;
}
function busOBB(){
  const p = busCentre();
  return { x:p.x, y:p.y, ang:bus.h, hl:BUS_L/2, hw:BUS_HW };
}

function resetBus(){
  const w = toWorld(8, 2.0);
  bus.rx = w.x; bus.ry = w.y; bus.h = w.ang; bus.th = w.ang; bus.v = 0;
  bus.steer = 0; bus.steerNorm = 0; bus.scrapes.length = 0; bus.bump = 0;
}

// ============================================================
// Geometry utilities
// ============================================================
function pointInOBB(px,py,o){
  const c = Math.cos(o.ang), s = Math.sin(o.ang);
  const dx = px-o.x, dy = py-o.y;
  const lx = dx*c + dy*s, ly = dx*s - dy*c;
  return lx >= -o.hl && lx <= o.hl && ly >= -o.hw && ly <= o.hw;
}
function obbAxes(o){
  const c = Math.cos(o.ang), s = Math.sin(o.ang);
  return [{x:c,y:s},{x:s,y:-c}];
}
function obbProject(o,ax){
  const c = Math.cos(o.ang), s = Math.sin(o.ang);
  const cen = o.x*ax.x + o.y*ax.y;
  const r = o.hl*Math.abs(c*ax.x + s*ax.y) + o.hw*Math.abs(s*ax.x - c*ax.y);
  return {min:cen-r, max:cen+r};
}
// Separating-axis test. Returns the minimum translation vector pushing A out of B.
function satOBB(A,B){
  const axes = obbAxes(A).concat(obbAxes(B));
  let best = Infinity, bx = 0, by = 0;
  for(const ax of axes){
    const pa = obbProject(A,ax), pb = obbProject(B,ax);
    const ov = Math.min(pa.max,pb.max) - Math.max(pa.min,pb.min);
    if(ov <= 0) return null;
    if(ov < best){
      best = ov;
      const dir = (pa.min+pa.max)/2 < (pb.min+pb.max)/2 ? -1 : 1;
      bx = ax.x*dir; by = ax.y*dir;
    }
  }
  return {depth:best, nx:bx, ny:by};
}

// ============================================================
// The oncoming car: it negotiates rather than just existing.
// Telegraphs every decision, yields into a bay when the corridor cannot
// hold both, or -- if stubborn -- refuses until you use the horn.
// ============================================================
const NEED_BOTH = BUS_W + CAR_W + 0.55;   // width for a shared pass
const car = { s:0, q:0, v:0, targetQ:0, mode:"cruise", timer:0, stubborn:false,
              honked:false, blink:0, ang:0, x:0, y:0 };

function spawnCar(){
  car.s = TOTAL_S - 10; car.q = -2.0; car.v = 0; car.targetQ = -2.0;
  car.mode = "cruise"; car.timer = 0; car.honked = false;
  car.stubborn = Math.random() < 0.5;
  const w = toWorld(car.s, car.q); car.x = w.x; car.y = w.y; car.ang = w.ang + Math.PI;
}
// Widest free lateral interval at along-distance s, ignoring the given actor.
function freeInterval(s){
  const p = pathPoint(s);
  if(!p) return {lo:0, hi:0, w:0};
  const lim = p.hw;
  // Collect blocked spans from static obstacles that straddle this s.
  const blocked = [];
  for(const o of obstacles){
    const reach = Math.abs(o.hl*Math.cos(o.ang - p.ang)) + Math.abs(o.hw*Math.sin(o.ang - p.ang));
    if(s < o.ps - reach || s > o.ps + reach) continue;
    const half = Math.abs(o.hl*Math.sin(o.ang - p.ang)) + Math.abs(o.hw*Math.cos(o.ang - p.ang));
    blocked.push([o.pq-half, o.pq+half]);
  }
  blocked.sort((a,b)=>a[0]-b[0]);
  let lo = -lim, best = {lo:-lim, hi:lim, w:2*lim};
  best.w = -1;
  let cursor = -lim;
  for(const b of blocked){
    if(b[0] > cursor){
      const w = Math.min(b[0],lim) - cursor;
      if(w > best.w) best = {lo:cursor, hi:Math.min(b[0],lim), w};
    }
    if(b[1] > cursor) cursor = b[1];
  }
  if(lim > cursor){ const w = lim - cursor; if(w > best.w) best = {lo:cursor, hi:lim, w}; }
  if(best.w < 0) best = {lo:0, hi:0, w:0};
  return best;
}
function busS(){ const p = busCentre(); return project(p.x,p.y); }

function updateCar(dt){
  const bp = busS();
  const gap = car.s - bp.s;             // positive while the car is still ahead
  car.blink += dt;

  // Is there a sample between us where we cannot both fit?
  let conflict = false, worstS = car.s;
  if(gap > 0){
    for(let s = Math.max(bp.s, car.s-60); s <= car.s; s += 2){
      if(freeInterval(s).w < NEED_BOTH){ conflict = true; worstS = s; break; }
    }
  }

  if(car.mode === "cruise"){
    // Close to within sight of the pinch before negotiating, so the whole
    // exchange happens on screen where the player can read it.
    if(conflict && gap < 55 && (car.s - worstS) < 18){ car.mode = "telegraph"; car.timer = 0.42; }
  } else if(car.mode === "telegraph"){
    car.timer -= dt;
    if(car.timer <= 0){
      if(car.stubborn && !car.honked){ car.mode = "wait"; car.honked = false; }
      else {
        // Look behind (higher s) for a bay wide enough to share.
        let bay = -1;
        for(let s = Math.max(worstS, car.s); s < Math.min(TOTAL_S-4, car.s+38); s += 1.5){
          if(freeInterval(s).w >= NEED_BOTH + 0.6){ bay = s + 6; break; }
        }
        if(bay > 0 && bay > car.s){ car.mode = "backing"; car.bay = Math.min(bay, TOTAL_S-6); }
        else { car.mode = "wait"; car.honked = false; }
      }
    }
  } else if(car.mode === "backing"){
    car.v = 3.0;                        // reverse, away from the bus
    if(car.s >= car.bay){ car.v = 0; car.mode = "yield"; }
  } else if(car.mode === "yield" || car.mode === "wait"){
    car.v = 0;
    if(car.mode === "wait" && car.honked){ car.mode = "telegraph"; car.timer = 0.42; car.stubborn = false; }
    if(gap < -9) { car.mode = "cruise"; car.honked = false; }
  }

  if(car.mode === "cruise"){
    // Keep left, but step around anything parked in the way.
    const look = freeInterval(car.s - 7);
    let want = -2.0;
    if(want < look.lo + CAR_W/2 + 0.2 || want > look.hi - CAR_W/2 - 0.2){
      want = (look.lo + look.hi)/2;
    }
    car.targetQ = want;
    // Slow down as the gap to the bus closes (light IDM flavour).
    let vWant = 7.0;
    if(gap > 0 && gap < 30) vWant = Math.max(1.6, 7.0 * (gap-6)/24);
    if(gap > 0 && gap < 9) vWant = 0;
    car.v += Math.max(-6*dt, Math.min(6*dt, (-vWant) - car.v));
  } else if(car.mode === "yield"){
    // Hug the far side of the bay so the bus gets the room.
    const fi = freeInterval(car.s);
    car.targetQ = fi.lo + CAR_W/2 + 0.15;
  } else if(car.mode === "telegraph" || car.mode === "wait"){
    car.v += Math.max(-8*dt, Math.min(8*dt, 0 - car.v));
  }

  car.s += car.v * dt;        // signed along +s: cruise negative, backing positive
  car.q += Math.max(-1.8*dt, Math.min(1.8*dt, car.targetQ - car.q));
  if(car.s < 4 || car.s > TOTAL_S - 2) spawnCar();

  const w = toWorld(car.s, car.q);
  const lateralDrift = (car.targetQ - car.q);
  car.x = w.x; car.y = w.y;
  car.ang = w.ang + Math.PI + Math.max(-0.25, Math.min(0.25, -lateralDrift*0.35));
}
function carOBB(){ return {x:car.x, y:car.y, ang:car.ang, hl:CAR_L/2, hw:CAR_W/2}; }

// ============================================================
// Clearance probing -- ray-march outward from the bus flanks. Feeds the
// squeeze feedback, the mirror fold and the HUD bars.
// ============================================================
let clearL = 1.5, clearR = 1.5, squeezing = false, squeezeMin = 9, squeezeDirty = false;
let squeezeFlash = 0, squeezeFlashVal = 0;
const CLEAR_CAP = 1.5;

function blockedAt(px,py){
  const pr = project(px,py);
  if(Math.abs(pr.q) > pr.hw || pr.s <= 0.2 || pr.s >= TOTAL_S-0.2) return true;
  for(const o of obstacles) if(pointInOBB(px,py,o)) return true;
  const co = carOBB();
  if(pointInOBB(px,py,co)) return true;
  for(const b of bins) if((px-b.x)*(px-b.x)+(py-b.y)*(py-b.y) < b.r*b.r) return true;
  return false;
}
function probeSide(sign){
  let best = CLEAR_CAP;
  const frames = [
    { ox:bus.rx, oy:bus.ry, c:Math.cos(bus.h), s:Math.sin(bus.h),
      offs:[-REAR_OH+0.4, 0, 2.5, WB+FRONT_OH-0.4] }
  ];
  const H = hitchPos();
  frames.push({ ox:H.x, oy:H.y, c:Math.cos(bus.th), s:Math.sin(bus.th),
                offs:[-0.6, -TRAIL_L/2, -TRAIL_L+0.4] });
  for(const f of frames){
    for(const a of f.offs){
      const ox = f.ox + a*f.c, oy = f.oy + a*f.s;
      for(let d=0; d<=CLEAR_CAP; d+=0.12){
        const b = sign*(BUS_HW + d);
        if(blockedAt(ox + b*f.s, oy - b*f.c)){ if(d < best) best = d; break; }
      }
    }
  }
  return best;
}

// ============================================================
// Collision -- forgiving by design. Scrapes cost paint and a little speed,
// head-on contact stalls you. Nothing ever ends the run.
// ============================================================
let shake = 0, hitCount = 0;
const sparks = [];
function addSparks(x,y,n){
  for(let i=0;i<n;i++)
    sparks.push({x,y, vx:(Math.random()-0.5)*7, vy:(Math.random()-0.5)*7, life:0.28+Math.random()*0.22});
}
function resolveHit(nx,ny,depth,px,py){
  bus.rx += nx*depth; bus.ry += ny*depth;
  const c = Math.cos(bus.h), s = Math.sin(bus.h);
  const along = Math.abs(nx*c + ny*s);         // 1 = head-on, 0 = pure scrape
  const impact = Math.abs(bus.v) * (0.25 + along);
  if(along > 0.55){
    bus.v *= 0.06;                              // stall
  } else {
    bus.v *= 0.90;                              // scrape past
    const lx = (px-bus.rx)*c + (py-bus.ry)*s;
    const side = ((px-bus.rx)*s - (py-bus.ry)*c) > 0 ? 1 : -1;
    if(bus.scrapes.length < 40 && Math.abs(bus.v) > 0.6) bus.scrapes.push({a:lx, side});
    bus.h += side * Math.min(0.05, Math.abs(bus.v)*0.006);   // slight yaw kick
  }
  if(impact > 0.7){
    shake = Math.min(4.5, shake + impact*0.5);
    addSparks(px, py, 3 + (impact*1.5|0));
    sBump(impact);
    hitCount++;
    squeezeDirty = true;
  }
  bus.bump = Math.max(bus.bump, Math.min(1, impact/6));
}
// A shove on the trailer swings it about the hitch rather than sliding the
// whole rig sideways.
function resolveTrailerHit(nx,ny,depth,px,py){
  const ct = Math.cos(bus.th), st = Math.sin(bus.th);
  const side  = nx*st - ny*ct;              // component along trailer-left
  const along = Math.abs(nx*ct + ny*st);
  bus.th += Math.max(-0.07, Math.min(0.07, side*depth/(TRAIL_L*0.5)));
  bus.rx += nx*depth*0.55; bus.ry += ny*depth*0.55;
  const impact = Math.abs(bus.v)*(0.25 + along);
  bus.v *= along > 0.55 ? 0.5 : 0.93;
  if(impact > 0.7){
    shake = Math.min(4.5, shake + impact*0.5);
    addSparks(px,py,3 + (impact|0)); sBump(impact); hitCount++; squeezeDirty = true;
  }
  clampJack();
}
function collideTrailer(){
  const T = trailerOBB();
  for(const o of obstacles){
    const m = satOBB(T,o);
    if(m) resolveTrailerHit(m.nx, m.ny, m.depth, (T.x+o.x)/2, (T.y+o.y)/2);
  }
  const co = carOBB();
  const mc = satOBB(T,co);
  if(mc) resolveTrailerHit(mc.nx, mc.ny, mc.depth, (T.x+co.x)/2, (T.y+co.y)/2);
  const ct = Math.cos(bus.th), st = Math.sin(bus.th);
  for(const a of [-TRAIL_L/2, 0, TRAIL_L/2]){
    for(const b of [-BUS_HW, BUS_HW]){
      const px = T.x + a*ct + b*st, py = T.y + a*st - b*ct;
      const pr = project(px,py);
      const over = Math.abs(pr.q) - pr.hw;
      if(over > 0){
        const p = pathPoint(pr.s), sgn = pr.q > 0 ? 1 : -1;
        resolveTrailerHit(-p.nx*sgn, -p.ny*sgn, over, px, py);
      }
    }
  }
}
function collide(){
  const A = busOBB();
  for(const o of obstacles){
    const m = satOBB(A,o);
    if(m) resolveHit(m.nx, m.ny, m.depth, (A.x+o.x)/2, (A.y+o.y)/2);
  }
  const co = carOBB();
  const mc = satOBB(A,co);
  if(mc) resolveHit(mc.nx, mc.ny, mc.depth, (A.x+co.x)/2, (A.y+co.y)/2);

  // Walls: push each body corner and flank midpoint back inside the corridor.
  const c = Math.cos(bus.h), s = Math.sin(bus.h);
  for(const a of [-REAR_OH, 0, 2.5, 5.5, WB+FRONT_OH]){
    for(const b of [-BUS_HW, BUS_HW]){
      const px = bus.rx + a*c + b*s, py = bus.ry + a*s - b*c;
      const pr = project(px,py);
      const over = Math.abs(pr.q) - pr.hw;
      if(over > 0){
        const p = pathPoint(pr.s);
        const sgn = pr.q > 0 ? 1 : -1;
        resolveHit(-p.nx*sgn, -p.ny*sgn, over, px, py);
      }
      if(pr.s < 0.4 || pr.s > TOTAL_S-0.4){
        const p = pathPoint(pr.s < 0.4 ? 0 : TOTAL_S);
        const sgn = pr.s < 0.4 ? 1 : -1;
        resolveHit(p.dx*sgn, p.dy*sgn, 0.5, px, py);
      }
    }
  }
  // Bins are nudgeable -- the pressure valve, and the funniest thing here.
  for(const bn of bins){
    const pr2 = ((bn.x-A.x)*Math.cos(A.ang) + (bn.y-A.y)*Math.sin(A.ang));
    const ly = ((bn.x-A.x)*Math.sin(A.ang) - (bn.y-A.y)*Math.cos(A.ang));
    if(Math.abs(pr2) < A.hl + bn.r && Math.abs(ly) < A.hw + bn.r){
      const push = (ly > 0 ? 1 : -1);
      const c2 = Math.cos(bus.h), s2 = Math.sin(bus.h);
      bn.vx += (s2*push)*Math.abs(bus.v)*0.55 + c2*bus.v*0.25;
      bn.vy += (-c2*push)*Math.abs(bus.v)*0.55 + s2*bus.v*0.25;
      bn.spin += (Math.random()-0.5)*9;
      const need = A.hw + bn.r - Math.abs(ly);
      bn.x += s2*push*need; bn.y += -c2*push*need;
      if(Math.abs(bus.v) > 1.2){ sBin(); }
    }
  }
  collideTrailer();
}

// ============================================================
// Camera -- world-fixed (never rotates), critically damped, with a
// look-ahead that is capped so the tail can never leave the screen.
// ============================================================
let camX = 0, camY = 0, camVX = 0, camVY = 0;
function updateCam(dt, snap){
  const p = rigCentre();
  const c = Math.cos(bus.h), s = Math.sin(bus.h);
  const halfAlong = ((W/2)*Math.abs(c) + (H/2)*Math.abs(s)) / PPM;
  const RIG_HALF = (WB + FRONT_OH + HITCH_OFF + TRAIL_L)/2;
  const maxLook = Math.max(0, halfAlong - RIG_HALF - 2.0);
  const look = Math.min(Math.abs(bus.v) * 1.15, maxLook, 20);
  const tx = p.x + c*look, ty = p.y + s*look;
  if(snap){ camX = tx; camY = ty; camVX = camVY = 0; return; }
  const w = 6.5;
  camVX += (-2*w*camVX - w*w*(camX-tx))*dt; camX += camVX*dt;
  camVY += (-2*w*camVY - w*w*(camY-ty))*dt; camY += camVY*dt;
}
let shakeX = 0, shakeY = 0;
function sx(x){ return (x-camX)*PPM + W/2 + shakeX; }
function sy(y){ return (y-camY)*PPM + H/2 + shakeY; }

// ============================================================
// Update
// ============================================================
const input = { left:false, right:false, up:false, down:false, horn:false, hornEdge:false };
let timeScale = 1, showGhost = true, frameNo = 0;
let noClip = false;   // test-only: skip collision resolution

function update(){
  frameNo++;
  const target = squeezing ? 0.9 : 1;
  timeScale += (target - timeScale) * 0.12;
  const dt = (1/60) * timeScale;

  // Steering ramps to lock over ~250 ms and self-centres faster, so a
  // partial lock is holdable. Binary steer would ruin the precision fantasy.
  let want = 0;
  if(input.left) want -= 1;
  if(input.right) want += 1;
  const rate = want === 0 ? dt/0.18 : dt/0.25;
  const diff = want - bus.steerNorm;
  bus.steerNorm += Math.max(-rate, Math.min(rate, diff));
  const speedFrac = Math.min(1, Math.abs(bus.v)/V_MAX);
  bus.steer = bus.steerNorm * STEER_MAX * (1 - 0.62*speedFrac);

  // Mass: slow to wind up, slow to shed.
  if(input.up)        bus.v += ACCEL*dt;
  else if(input.down){
    if(bus.v > 0.15)  bus.v -= BRAKE*dt;
    else              bus.v -= ACCEL*0.7*dt;
  } else {
    const d = DRAG*dt;
    if(bus.v > d) bus.v -= d; else if(bus.v < -d) bus.v += d; else bus.v = 0;
  }
  if(bus.v > V_MAX) bus.v = V_MAX;
  if(bus.v < -V_REV) bus.v = -V_REV;

  const omega = bus.v*Math.tan(bus.steer)/WB;
  bus.rx += bus.v*dt*Math.cos(bus.h);
  bus.ry += bus.v*dt*Math.sin(bus.h);
  bus.h  += omega*dt;
  // Trailer axle is constrained to travel along its own heading; solving that
  // gives the standard articulated rate, with the hitch offset term included.
  const dA = artAngle();
  bus.th += ((bus.v*Math.sin(dA) - HITCH_OFF*omega*Math.cos(dA))/TRAIL_WB)*dt;
  clampJack();

  if(input.hornEdge){
    input.hornEdge = false;
    sHorn();
    const bp = busS();
    if(Math.abs(car.s - bp.s) < 50) car.honked = true;
  }

  updateCar(dt);
  if(!noClip) collide();

  for(const b of bins){
    b.x += b.vx*dt; b.y += b.vy*dt; b.ang += b.spin*dt;
    const f = Math.pow(0.02, dt);
    b.vx *= f; b.vy *= f; b.spin *= f;
    const pr = project(b.x,b.y);
    if(Math.abs(pr.q) > pr.hw - b.r){
      const p = pathPoint(pr.s), sg = pr.q > 0 ? 1 : -1;
      const over = Math.abs(pr.q) - (pr.hw - b.r);
      b.x -= p.nx*sg*over; b.y -= p.ny*sg*over;
      b.vx *= -0.4; b.vy *= -0.4;
    }
  }
  for(let i=sparks.length-1;i>=0;i--){
    const p = sparks[i];
    p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= 0.9; p.vy *= 0.9;
    p.life -= dt; if(p.life <= 0) sparks.splice(i,1);
  }

  clearL = probeSide(1); clearR = probeSide(-1);
  const wasSqueezing = squeezing;
  squeezing = clearL < 0.75 && clearR < 0.75;
  if(squeezing){
    const g = Math.min(clearL, clearR);
    if(!wasSqueezing){ squeezeMin = g; squeezeDirty = false; }
    else if(g < squeezeMin) squeezeMin = g;
    sSqueeze(g);
  } else if(wasSqueezing){
    if(!squeezeDirty){ squeezeFlash = 1.1; squeezeFlashVal = squeezeMin; sChime(); }
    squeezeDirty = false;
  }
  if(squeezeFlash > 0) squeezeFlash -= dt;

  if(shake > 0){ shake = Math.max(0, shake - dt*9); }
  shakeX = shake ? (Math.random()-0.5)*shake*2 : 0;
  shakeY = shake ? (Math.random()-0.5)*shake*2 : 0;
  bus.bump = Math.max(0, bus.bump - dt*2.5);

  updateCam(dt, false);
  engineUpdate(bus.v);
}

// ============================================================
// Render
// ============================================================
function drawParts(x,y,ang,parts){
  const c = Math.cos(ang), s = Math.sin(ang);
  const px = sx(x), py = sy(y);
  for(const p of parts){
    const lcx = (p[0]+p[2])/2, lcy = (p[1]+p[3])/2;
    const wx = px + (lcx*c + lcy*s)*PPM;
    const wy = py + (lcx*s - lcy*c)*PPM;
    fillOBB(wx, wy, c, s, Math.abs(p[2]-p[0])/2*PPM, Math.abs(p[3]-p[1])/2*PPM, p[4]);
  }
}
// Parts are [x0,y0,x1,y1,key] in local metres: +x forward, +y left.
function busParts(){
  const foldL = clearL < 0.45, foldR = clearR < 0.45;
  const P = [
    [-5.5,-1.275, 5.5,1.275,'u'],
    [-5.5, 0.72,  5.5,1.275,'U'], [-5.5,-1.275, 5.5,-0.72,'U'],
    [-5.5,-1.275,-5.1,1.275,'t'],                            // bellows face
    [ 4.0,-1.05, 5.1,1.05,'g'],
    [-3.9,-1.2, 3.4,-0.86,'g'], [-3.9,0.86, 3.4,1.2,'g'],
    [ 5.12,-0.8, 5.48,0.8,'h'],
    [ 5.1,-1.2, 5.5,-0.85,'s'], [5.1,0.85, 5.5,1.2,'s'],
    [-3.2,-1.275,-1.8,-1.02,'t'], [-3.2,1.02,-1.8,1.275,'t'],
    [ 2.3,-1.275, 3.7,-1.02,'t'], [ 2.3,1.02, 3.7,1.275,'t'],
    [ 0.4,-1.275, 0.55,1.275,'U']
  ];
  P.push([4.5, foldL?1.28:1.30, 4.85, foldL?1.55:1.95, 'm']);
  P.push([4.5, foldR?-1.55:-1.95, 4.85, foldR?-1.28:-1.30, 'm']);
  for(const sc of bus.scrapes){
    const a = Math.max(-5.3, Math.min(5.3, sc.a - 2.5));
    P.push([a-0.35, sc.side>0?1.05:-1.275, a+0.35, sc.side>0?1.275:-1.05, 'U']);
  }
  return P;
}
// Trailer local frame: hitch at +3.5, tail at -3.5, axle at -1.1.
function trailerParts(){
  return [
    [-3.5,-1.275, 3.5,1.275,'u'],
    [-3.5, 0.72,  3.5,1.275,'U'], [-3.5,-1.275, 3.5,-0.72,'U'],
    [ 3.1,-1.275, 3.5,1.275,'t'],                            // bellows face
    [-3.4,-1.2, 2.5,-0.86,'g'], [-3.4,0.86, 2.5,1.2,'g'],
    [-3.5,-0.95,-2.95,0.95,'G'],
    [-3.5,-1.2,-3.2,-0.85,'r'], [-3.5,0.85,-3.2,1.2,'r'],
    [-1.8,-1.275,-0.4,-1.02,'t'], [-1.8,1.02,-0.4,1.275,'t'],
    [ 1.2,-1.275, 1.35,1.275,'U']
  ];
}
function carParts(tint, shade, lit){
  const P = [
    [-2.1,-0.9, 2.1,0.9, tint],
    [-2.1,-0.9, 2.1,-0.62, shade], [-2.1,0.62, 2.1,0.9, shade],
    [-0.75,-0.7, 1.0,0.7, shade],
    [ 0.95,-0.62, 1.3,0.62,'g'], [-1.1,-0.6,-0.78,0.6,'g'],
    [-2.1,-0.85,-1.92,-0.5,'r'], [-2.1,0.5,-1.92,0.85,'r']
  ];
  if(lit){ P.push([1.92,-0.85,2.1,-0.48,'s']); P.push([1.92,0.48,2.1,0.85,'s']); }
  return P;
}
function vanParts(blink){
  const P = [
    [-2.7,-1.05, 2.7,1.05,'v'],
    [-2.7,-1.05, 2.7,-0.75,'V'], [-2.7,0.75, 2.7,1.05,'V'],
    [ 1.35,-1.05, 2.7,1.05,'V'],
    [ 2.3,-0.82, 2.62,0.82,'g'],
    [-2.7,-0.5,-2.5,0.5,'V']
  ];
  if(blink){
    P.push([2.45,-1.05,2.7,-0.6,'h']); P.push([2.45,0.6,2.7,1.05,'h']);
    P.push([-2.7,-1.05,-2.45,-0.6,'h']); P.push([-2.7,0.6,-2.45,1.05,'h']);
  }
  return P;
}

function drawStreet(){
  ctx.fillStyle = col('b'); ctx.fillRect(0,0,W,H);
  // Building texture: a coarse window grid, skipped anywhere near the corridor.
  const x0 = camX - (W/2)/PPM, y0 = camY - (H/2)/PPM;
  for(let gx = Math.floor(x0/4)*4; gx < x0 + W/PPM + 4; gx += 4){
    for(let gy = Math.floor(y0/4)*4; gy < y0 + H/PPM + 4; gy += 4){
      const pr = project(gx,gy);
      if(Math.abs(pr.q) < pr.hw + 1.6) continue;
      rect(sx(gx), sy(gy), 1.4*PPM, 1.4*PPM, 'B');
    }
  }
  for(const g of SEGS){
    const mx = (g.ax+g.bx)/2, my = (g.ay+g.by)/2;
    const hw = (g.hw0+g.hw1)/2;
    const c = g.dx, s = g.dy;
    fillOBB(sx(mx), sy(my), c, s, (g.len/2+0.35)*PPM, hw*PPM, 'p');
    fillOBB(sx(mx), sy(my), c, s, (g.len/2+0.35)*PPM, (hw-PAVE)*PPM, 'd');
    // Kerb lines
    for(const sg of [1,-1]){
      const kx = mx + g.nx*sg*(hw-PAVE), ky = my + g.ny*sg*(hw-PAVE);
      fillOBB(sx(kx), sy(ky), c, s, (g.len/2+0.35)*PPM, 0.11*PPM, 'k');
    }
  }
  // Dashed centre line
  for(let s = 0; s < TOTAL_S; s += 5){
    const p = pathPoint(s), q = pathPoint(Math.min(TOTAL_S, s+2.6));
    const mx = (p.x+q.x)/2, my = (p.y+q.y)/2;
    const dx = q.x-p.x, dy = q.y-p.y, L = Math.hypot(dx,dy) || 1;
    fillOBB(sx(mx), sy(my), dx/L, dy/L, (L/2)*PPM, 0.09*PPM, 'l');
  }
  // End walls
  for(const s of [0, TOTAL_S]){
    const p = pathPoint(s);
    fillOBB(sx(p.x), sy(p.y), p.dx, p.dy, 0.4*PPM, p.hw*PPM, 'B');
  }
}

function drawGhost(){
  // Project the bicycle model forward and trace where the TAIL corners go.
  // Tail swing is only fair if it is knowable.
  let rx = bus.rx, ry = bus.ry, h = bus.h, th = bus.th;
  const dir = bus.v < -0.2 ? -1 : 1;
  const v = Math.max(Math.abs(bus.v), 2.6) * dir;
  const N = 16, dt = 0.9/N;
  const tan = Math.tan(bus.steer);
  let pL = null, pR = null;
  for(let i=0;i<N;i++){
    const om = v*tan/WB;
    rx += v*dt*Math.cos(h); ry += v*dt*Math.sin(h);
    const d = wrapPi(h - th);
    th += ((v*Math.sin(d) - HITCH_OFF*om*Math.cos(d))/TRAIL_WB)*dt;
    h  += om*dt;
    const dd = wrapPi(h - th);
    if(dd >  JACK) th = h - JACK;
    if(dd < -JACK) th = h + JACK;
    const c = Math.cos(h), s = Math.sin(h), ct = Math.cos(th), st = Math.sin(th);
    const hx = rx - HITCH_OFF*c, hy = ry - HITCH_OFF*s;
    const ax = hx - TRAIL_L*ct, ay = hy - TRAIL_L*st;
    const lx = ax + BUS_HW*st, ly = ay - BUS_HW*ct;
    const rx2 = ax - BUS_HW*st, ry2 = ay + BUS_HW*ct;
    if(pL){ dline(sx(pL.x),sy(pL.y),sx(lx),sy(ly),'e',2); dline(sx(pR.x),sy(pR.y),sx(rx2),sy(ry2),'e',2); }
    pL = {x:lx,y:ly}; pR = {x:rx2,y:ry2};
  }
  // Final pose outline: the trailer, since that is the half you cannot see coming
  const c = Math.cos(h), s = Math.sin(h), ct = Math.cos(th), st = Math.sin(th);
  const hx2 = rx - HITCH_OFF*c, hy2 = ry - HITCH_OFF*s;
  const cor = [];
  for(const a of [0, -TRAIL_L]) for(const b of [BUS_HW,-BUS_HW])
    cor.push({x:hx2 + a*ct + b*st, y:hy2 + a*st - b*ct});
  const order = [cor[0],cor[1],cor[3],cor[2]];
  for(let i=0;i<4;i++){
    const A = order[i], B = order[(i+1)%4];
    dline(sx(A.x),sy(A.y),sx(B.x),sy(B.y),'e',3);
  }
}

function drawHUD(){
  rect(0,0,W,15,'a');
  const kmh = Math.abs(bus.v)*3.6;
  text((kmh<10?" ":"")+(kmh|0)+" KM/H", 4, 5, 'x', 1);
  const bp = busS();
  text((bp.s|0)+"/"+(TOTAL_S|0)+" M", 62, 5, 'X', 1);
  if(bus.v < -0.2) text("REV", 44, 5, 'y', 1);
  const art = Math.abs(artAngle())*180/Math.PI;
  text("ART "+(art|0), 108, 5, art > 42 ? 'r' : 'X', 1);

  // Clearance bars: left flank on the left, right flank on the right.
  text("L", 196, 5, 'X', 1);
  text("R", 276, 5, 'X', 1);
  for(const cfg of [{v:clearL, x:203}, {v:clearR, x:238}]){
    const frac = Math.max(0, Math.min(1, cfg.v/CLEAR_CAP));
    const k = cfg.v < 0.28 ? 'r' : (cfg.v < 0.75 ? 'y' : 'x');
    rect(cfg.x, 5, 34, 5, 'X');
    rect(cfg.x, 5, Math.max(1, 34*frac), 5, k);
  }
  if(squeezing){
    const g = Math.min(clearL, clearR);
    text("GAP "+Math.round(g*100)+"CM", 140, 5, 'y', 1);
    // Warning frame -- the squeeze wants to be felt at the screen edge.
    const on = ((frameNo>>2)&1) ? 'y' : 'h';
    rect(0,15,W,1,on); rect(0,H-1,W,1,on); rect(0,15,1,H,on); rect(W-1,15,1,H,on);
  }
  if(squeezeFlash > 0 && ((frameNo>>2)&1 || squeezeFlash < 0.7)){
    textC("SQUEEZE  "+Math.round(squeezeFlashVal*100)+"CM", H-24, 'y', 2);
  }
  // The oncoming car's intent, spelled out.
  if(car.mode === "wait")      textC("CAR WAITING - PRESS HORN", H-11, 'h', 1);
  else if(car.mode === "backing") textC("CAR BACKING UP FOR YOU", H-11, 'e', 1);
  else if(car.mode === "yield")   textC("CAR YIELDING", H-11, 'e', 1);
}

function render(){
  drawStreet();
  for(const b of bins){
    drawParts(b.x, b.y, b.ang, [[-0.36,-0.36,0.36,0.36,'n'],[-0.36,-0.36,-0.05,0.36,'N']]);
  }
  for(const o of obstacles){
    if(o.kind === "van") drawParts(o.x,o.y,o.ang, vanParts(o.hazard && ((frameNo>>4)&1)));
    else drawParts(o.x,o.y,o.ang, carParts('c','C',false));
  }
  // Oncoming car, with indicator telegraph before it ever acts.
  const blinkOn = (car.mode==="telegraph"||car.mode==="backing"||car.mode==="yield"||car.mode==="wait")
                  && ((frameNo>>3)&1);
  const cp = carParts('o','O',true);
  if(blinkOn){ cp.push([-2.1,-0.9,-1.5,-0.5,'h']); cp.push([1.5,-0.9,2.1,-0.5,'h']);
               cp.push([-2.1,0.5,-1.5,0.9,'h']); cp.push([1.5,0.5,2.1,0.9,'h']); }
  drawParts(car.x, car.y, car.ang, cp);
  if(car.mode === "wait" && ((frameNo>>3)&1)){
    text("!", sx(car.x)-1, sy(car.y)-14, 'y', 2);
  }

  if(showGhost) drawGhost();

  const tc = trailerCentre();
  drawParts(tc.x, tc.y, bus.th, trailerParts());
  const bc = busCentre();
  drawParts(bc.x, bc.y, bus.h, busParts());

  for(const p of sparks) rect(sx(p.x), sy(p.y), 1, 1, 's');
  drawHUD();
}

// ============================================================
// Audio -- lazily created on first tap (mobile autoplay rule).
// ============================================================
let muted = localStorage.getItem("bus_mute")==="1";
let actx = null, eng = null, engGain = null, sqOsc = null, sqGain = null;
function audioInit(){
  if(actx) return;
  try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx = null; return; }
  try{
    eng = actx.createOscillator(); engGain = actx.createGain();
    eng.type = "sawtooth"; eng.frequency.value = 48; engGain.gain.value = 0;
    eng.connect(engGain); engGain.connect(actx.destination); eng.start();
    sqOsc = actx.createOscillator(); sqGain = actx.createGain();
    sqOsc.type = "sine"; sqOsc.frequency.value = 400; sqGain.gain.value = 0;
    sqOsc.connect(sqGain); sqGain.connect(actx.destination); sqOsc.start();
  }catch(e){}
}
function beep(freq,dur,type,vol){
  if(muted||!actx) return;
  try{
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type||"square"; o.frequency.value=freq; g.gain.value=vol||0.05;
    o.connect(g); g.connect(actx.destination);
    const t=actx.currentTime; o.start(t);
    g.gain.setValueAtTime(vol||0.05,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.stop(t+dur);
  }catch(e){}
}
function engineUpdate(v){
  if(!actx||!eng) return;
  try{
    const t = actx.currentTime;
    eng.frequency.setTargetAtTime(40 + Math.abs(v)*6.2, t, 0.09);
    engGain.gain.setTargetAtTime(muted?0:(0.010 + Math.min(Math.abs(v)/V_MAX,1)*0.026), t, 0.12);
  }catch(e){}
}
function sSqueeze(g){
  if(!actx||!sqOsc) return;
  try{
    const t = actx.currentTime;
    sqOsc.frequency.setTargetAtTime(420 + (0.75-g)*900, t, 0.05);
    sqGain.gain.setTargetAtTime(muted?0:0.016, t, 0.06);
  }catch(e){}
}
function sSqueezeOff(){ if(actx&&sqGain){ try{ sqGain.gain.setTargetAtTime(0, actx.currentTime, 0.08); }catch(e){} } }
function sHorn(){ beep(233,0.42,"sawtooth",0.05); beep(311,0.42,"square",0.035); }
function sBump(i){ beep(90+Math.random()*40, Math.min(0.22,0.06+i*0.02), "sawtooth", 0.05); }
function sBin(){ beep(320+Math.random()*260, 0.05, "square", 0.035); }
function sChime(){ beep(880,0.07); setTimeout(()=>beep(1320,0.09),70); }

// ============================================================
// Input
// ============================================================
function bindHold(id,key){
  const el = document.getElementById(id); if(!el) return;
  const on=e=>{ e.preventDefault(); input[key]=true; audioInit(); };
  const off=e=>{ e.preventDefault(); input[key]=false; };
  el.addEventListener("pointerdown",on); el.addEventListener("pointerup",off);
  el.addEventListener("pointerleave",off); el.addEventListener("pointercancel",off);
}
bindHold("up","up"); bindHold("down","down"); bindHold("left","left"); bindHold("right","right");
function pressHorn(){ audioInit(); if(!input.horn){ input.horn=true; input.hornEdge=true; } }
const hornBtn = document.getElementById("horn");
if(hornBtn){
  hornBtn.addEventListener("pointerdown",e=>{ e.preventDefault(); pressHorn(); });
  hornBtn.addEventListener("pointerup",e=>{ e.preventDefault(); input.horn=false; });
  hornBtn.addEventListener("pointerleave",e=>{ input.horn=false; });
}
const KEYMAP = {ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down",
                a:"left",d:"right",w:"up",s:"down",A:"left",D:"right",W:"up",S:"down"};
window.addEventListener("keydown",e=>{
  if(KEYMAP[e.key]){ input[KEYMAP[e.key]]=true; e.preventDefault(); }
  if(e.key===" "){ if(!e.repeat) pressHorn(); e.preventDefault(); }
  if(e.key==="r"||e.key==="R") resetAll();
});
window.addEventListener("keyup",e=>{
  if(KEYMAP[e.key]){ input[KEYMAP[e.key]]=false; e.preventDefault(); }
  if(e.key===" ") input.horn=false;
});

const palBtn = document.getElementById("palBtn");
function refreshPal(){ if(palBtn) palBtn.textContent = PAL_LABEL[palMode]; }
if(palBtn) palBtn.addEventListener("click",()=>{
  palMode = PAL_ORDER[(PAL_ORDER.indexOf(palMode)+1)%PAL_ORDER.length];
  localStorage.setItem("bus_pal3",palMode); refreshPal();
});
refreshPal();
const muteBtn = document.getElementById("muteBtn");
function refreshMute(){ if(muteBtn) muteBtn.textContent = muted?"MUTED":"SOUND"; }
if(muteBtn) muteBtn.addEventListener("click",()=>{
  muted=!muted; localStorage.setItem("bus_mute",muted?"1":"0"); audioInit();
  if(muted) sSqueezeOff();
  refreshMute();
});
refreshMute();
const ghostBtn = document.getElementById("ghostBtn");
function refreshGhost(){ if(ghostBtn) ghostBtn.textContent = showGhost?"GHOST ON":"GHOST OFF"; }
if(ghostBtn) ghostBtn.addEventListener("click",()=>{ showGhost=!showGhost; refreshGhost(); });
refreshGhost();
const resetBtn = document.getElementById("resetBtn");
if(resetBtn) resetBtn.addEventListener("click",()=>resetAll());

document.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});
document.addEventListener("gesturestart",e=>e.preventDefault());
document.addEventListener("dblclick",e=>e.preventDefault());

// ============================================================
// Boot / reset -- restarting must be near-instant.
// ============================================================
function resetAll(){
  buildWorld(); resetBus(); spawnCar();
  sparks.length = 0; shake = 0; hitCount = 0;
  squeezing = false; squeezeFlash = 0; squeezeDirty = false; timeScale = 1;
  clearL = clearR = CLEAR_CAP;
  updateCam(0, true);
}
resetAll();

const STEP = 1000/60; let acc = 0, last = performance.now();
function frame(now){
  acc += now-last; last = now; if(acc > 200) acc = 200;
  while(acc >= STEP){ update(); acc -= STEP; }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- Headless test handle ----------
if(typeof window!=="undefined" && window.__busHook){
  window.__busHook({
    bus, car, input,
    obstacles:()=>obstacles, bins:()=>bins, segs:()=>SEGS, totalS:()=>TOTAL_S,
    project, pathPoint, toWorld, busCentre, busOBB, busLocal, busS, freeInterval,
    trailerOBB, trailerCentre, hitchPos, artAngle,
    clearances:()=>({l:clearL, r:clearR}), squeezing:()=>squeezing,
    hits:()=>hitCount, single:()=>update(), step:n=>{ for(let i=0;i<(n||60);i++) update(); },
    render, reset:resetAll, spawnCar,
    setPal:p=>{ palMode = p; }, getPal:()=>palMode,
    setGhost:b=>{ showGhost = b; },
    setNoclip:b=>{ noClip = b; },
    place:(s,q,dh)=>{ const w = toWorld(s,q); bus.rx=w.x; bus.ry=w.y; bus.h=w.ang+(dh||0); bus.th=bus.h; bus.v=0;
                      bus.steerNorm=0; bus.steer=0; updateCam(0,true); },
    honk:()=>{ input.hornEdge = true; },
    consts:{BUS_L,BUS_W,WB,FRONT_OH,REAR_OH,STEER_MAX,PPM,W,H,NEED_BOTH,CLEAR_CAP,
            VARIANT:"bendy", HITCH_OFF, TRAIL_L, TRAIL_WB, JACK,
            RIG_L:WB+FRONT_OH+HITCH_OFF+TRAIL_L}
  });
}

})();
